<html lang="en-GB">
<head>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Emma's Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;
  font-family:'Andika','Chalkboard SE','Comic Sans MS',system-ui,sans-serif}
body{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,#5a3f9e 0%,#2a2160 60%,#1b1745 100%)}
svg{display:block}

#stage{position:absolute;left:0;top:0;width:1180px;height:820px;transform-origin:0 0}
#sky{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.star{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}

#title{position:absolute;left:0;right:0;top:34px;text-align:center;font-size:52px;font-weight:700;color:#fff6fb;letter-spacing:1px;
  text-shadow:0 4px 0 #b4458a,0 0 26px rgba(255,150,220,.55);pointer-events:none}
#cards{position:absolute;left:50%;top:150px;display:flex;flex-wrap:wrap;justify-content:center;gap:30px;transform-origin:50% 0}
.card{position:relative;width:330px;height:496px;border-radius:44px;background:#fff;padding:12px 12px 0;touch-action:none;cursor:pointer;
  box-shadow:0 12px 0 rgba(0,0,0,.25),0 20px 40px rgba(0,0,0,.35);transform:scale(.6);opacity:0;
  transition:transform .5s cubic-bezier(.3,1.5,.5,1),opacity .3s}
.card.in{transform:scale(1);opacity:1}
.card .art{width:306px;height:400px;border-radius:34px;overflow:hidden;pointer-events:none}
.card .art svg{width:306px;height:400px}
.card .name{height:72px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;pointer-events:none}
.card.uni{box-shadow:0 12px 0 #b4458a,0 20px 40px rgba(0,0,0,.35)}
.card.uni .name{color:#b4458a}
.card.wand{box-shadow:0 12px 0 #d49a1f,0 20px 40px rgba(0,0,0,.35)}
.card.wand .name{color:#6a2bbf}
.card.fluff{box-shadow:0 12px 0 #3f9c78,0 20px 40px rgba(0,0,0,.35)}
.card.fluff .name{color:#2f7f60}
.card.moon{box-shadow:0 12px 0 #5a3f9e,0 20px 40px rgba(0,0,0,.35)}
.card.moon .name{color:#5a3f9e}
.card.world{box-shadow:0 12px 0 #e2683f,0 20px 40px rgba(0,0,0,.35)}
.card.world .name{color:#c4462a;font-size:29px;white-space:nowrap}
.card.down{transform:scale(.95)}
.card.chosen{animation:chosen .9s ease-in-out infinite;z-index:2}
@keyframes chosen{0%,100%{transform:scale(1.04) rotate(-1.5deg)}50%{transform:scale(1.1) rotate(1.5deg)}}
.cards-busy .card:not(.chosen){opacity:.55;transition:opacity .3s}

/* art details */
.uni-art .u-eye{transform-box:fill-box;transform-origin:center;animation:eyeBlink 4.5s infinite}
.moon-art .u-eye{transform-box:fill-box;transform-origin:center;animation:eyeBlink 4.5s infinite}
.world-art .u-eye{transform-box:fill-box;transform-origin:center;animation:eyeBlink 4.5s infinite}
.world-art .tail{transform-box:fill-box;transform-origin:50% 0;animation:sway 3.2s ease-in-out infinite}
.world-art .tail.r{animation-delay:-1.6s}
@keyframes sway{0%,100%{transform:rotate(2.5deg)}50%{transform:rotate(-2.5deg)}}
.world-art .wave{transform-box:fill-box;transform-origin:100% 100%;animation:wave 1.3s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(14deg)}}
@keyframes eyeBlink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.uni-art .shine,.twk{animation:twinkle 1.6s ease-in-out infinite}
.wand-art .wand-glow{transform-box:fill-box;transform-origin:center;animation:glowpulse 1.6s ease-in-out infinite}
@keyframes glowpulse{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.3);opacity:1}}
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.fluff-art .f1{fill:var(--fluff,#a8e8cc)}.fluff-art .f1s{stroke:var(--fluff,#a8e8cc)}
.fluff-art .f2{fill:var(--fluff2,#79cfa9)}.fluff-art .f2s{stroke:var(--fluff2,#79cfa9)}
.fluff-art .f3{fill:var(--fluff3,#e4fbf1)}
.fluff-art .fp{fill:var(--pat,#ffffff)}
.fluff-art .ein{fill:#ffd2de}
.fluff-art .eyesClosed,.fluff-art .mouthO,.fluff-art .puffcheeks,.fluff-art .pattern,.fluff-art .crown,.fluff-art .mud path{display:none}
.fluff-art .breathe{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.04,.96)}}

/* Play: a white triangle on a round disc, the same as in the games */
#start{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 50%,rgba(90,63,158,.55),rgba(20,16,55,.9))}
#start.gone{display:none}
#play{width:240px;height:240px;border-radius:50%;touch-action:none;cursor:pointer;
  background:radial-gradient(circle at 35% 30%,#ffb3dc,#ff5fae 60%,#e0408f);box-shadow:0 12px 0 #b4307a,0 22px 40px rgba(0,0,0,.35);
  display:flex;align-items:center;justify-content:center;animation:pulse 1.6s ease-in-out infinite}
#play svg{width:110px;height:110px;margin-left:14px;pointer-events:none}
#play.down{animation:none;transform:translateY(6px) scale(.97)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

/* grown-ups only: small link to the listening sheet */
#grownups{position:absolute;right:12px;bottom:10px;z-index:60;font-size:15px;color:rgba(255,255,255,.55);text-decoration:none;
  padding:6px 10px;border-radius:10px;border:1px solid rgba(255,255,255,.25)}

#sparks{position:absolute;inset:0;pointer-events:none;z-index:40}
.spark{position:absolute;font-size:34px;color:#ffe27a;pointer-events:none;text-shadow:0 0 10px #fff2a8}
#version{position:fixed;right:14px;bottom:10px;z-index:5;font:700 17px/1 system-ui,sans-serif;color:rgba(80,50,120,.7);pointer-events:none}
</style>
</head>

<script src="shared/audio.js"></script>
<script>
'use strict';
/* Emma's picture menu. Play unlocks audio (iOS), Elizabeth says hello, a tap on a card says the
   game's name and opens it. All speech is pre-generated (menu-audio/lines.json). */
const A = window.EmmaAudio;
A.init({ base: 'menu-audio/', phonics: 'shared/audio/phonics/' });

const CLIPS = ['menu-welcome', 'menu-moon-meadow-world', 'menu-moon-meadow-home', 'menu-unicorn-egg-nest', 'menu-pippas-word-wand', 'menu-fluffle-nursery'];
const stage = document.getElementById('stage');
const start = document.getElementById('start');
const play = document.getElementById('play');
const cards = [...document.querySelectorAll('.card')];
let busy = false;
let started = false;

/* fit the 1180 x 820 stage (820 x 1180 in portrait) into the screen. The cards take the grid that
   makes them biggest under the title: five cards are three over two in both orientations. */
const CARD_W = 330, CARD_H = 496 + 12, GAP = 30; // 12: the coloured edge under each card
function fit(){
  const portrait = innerHeight > innerWidth;
  const W = portrait ? 820 : 1180, H = portrait ? 1180 : 820;
  stage.style.width = W + 'px'; stage.style.height = H + 'px';
  const titleTop = portrait ? 22 : 34;
  document.getElementById('title').style.top = titleTop + 'px';
  const top = titleTop + 82, availW = W - 40, availH = H - top - 14;
  let best = null;
  for (let cols = 1; cols <= cards.length; cols++){
    const rows = Math.ceil(cards.length / cols);
    const w = cols * CARD_W + (cols - 1) * GAP, h = rows * CARD_H + (rows - 1) * GAP;
    const k = Math.min(1, availW / w, availH / h);
    if (!best || k > best.k) best = { w, h, k };
  }
  const cardsEl = document.getElementById('cards');
  cardsEl.style.width = best.w + 'px';
  cardsEl.style.top = (top + (availH - best.h * best.k) / 2) + 'px';
  cardsEl.style.transform = `translateX(-50%) scale(${best.k})`;
  const s = Math.min(innerWidth / W, innerHeight / H);
  stage.style.transform = `translate(${(innerWidth - W * s) / 2}px,${(innerHeight - H * s) / 2}px) scale(${s})`;
}
addEventListener('resize', fit);
addEventListener('orientationchange', () => setTimeout(fit, 200));
fit();

/* stars */
const sky = document.getElementById('sky');
for (let i = 0; i < 50; i++){
  const s = document.createElement('div'); s.className = 'star';
  s.style.left = (Math.random() * 100) + '%'; s.style.top = (Math.random() * 100) + '%';
  s.style.animationDelay = (Math.random() * 3) + 's'; sky.appendChild(s);
}

/* no zoom, no long-press menu, no double-tap zoom */
['gesturestart', 'gesturechange', 'dblclick', 'contextmenu'].forEach(t => document.addEventListener(t, e => e.preventDefault()));

function sparkle(el){
  const r = el.getBoundingClientRect(), sr = stage.getBoundingClientRect(), k = sr.width / stage.offsetWidth;
  const cx = (r.left + r.width / 2 - sr.left) / k, cy = (r.top + r.height / 2 - sr.top) / k;
  const box = document.getElementById('sparks');
  for (let i = 0; i < 12; i++){
    const s = document.createElement('div'); s.className = 'spark'; s.textContent = ['✦', '★', '✧', '♥'][i % 4];
    s.style.left = cx + 'px'; s.style.top = cy + 'px'; box.appendChild(s);
    const a = Math.random() * Math.PI * 2, d = 140 + Math.random() * 110;
    s.animate([{ transform: 'translate(-50%,-50%) scale(.4)', opacity: 1 }, { transform: `translate(calc(-50% + ${Math.cos(a) * d}px),calc(-50% + ${Math.sin(a) * d}px)) scale(1.1)`, opacity: 0 }],
      { duration: 900 + Math.random() * 300, easing: 'cubic-bezier(.2,.8,.4,1)', fill: 'forwards' }).onfinish = () => s.remove();
  }
}

function wait(ms){ return new Promise(r => setTimeout(r, ms)); }

play.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (started) return;
  started = true;
  play.classList.add('down');
  A.unlock();
  const loaded = A.preload(CLIPS);
  A.sfx('magic');
  setTimeout(() => {
    start.classList.add('gone');
    cards.forEach((c, i) => setTimeout(() => c.classList.add('in'), 120 + i * 160));
    loaded.then(() => wait(450)).then(() => { if (!busy) A.say('menu-welcome'); });
  }, 180);
});

cards.forEach(card => {
  card.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (busy || !started) return;
    card.classList.add('down');
  });
  const lift = () => card.classList.remove('down');
  card.addEventListener('pointercancel', lift);
  card.addEventListener('pointerleave', lift);
  card.addEventListener('pointerup', async e => {
    e.preventDefault();
    lift();
    if (busy || !started) return;
    busy = true;
    document.getElementById('cards').classList.add('cards-busy');
    card.classList.add('chosen');
    A.sfx('sparkle');
    sparkle(card);
    const said = A.say('menu-' + card.dataset.game);
    await Promise.race([said.then(() => wait(250)), wait(3000)]);
    A.stop();
    location.href = card.dataset.href;
  });
});

/* back from a game through the browser history: the page may come back from the cache */
addEventListener('pageshow', e => {
  if (!e.persisted) return;
  busy = false;
  document.getElementById('cards').classList.remove('cards-busy');
  cards.forEach(c => c.classList.remove('chosen', 'down'));
});

/* the release version, from the newest entry in CHANGELOG.md */
fetch('CHANGELOG.md',{cache:'no-cache'}).then(r=>r.ok?r.text():'').then(t=>{
  const m=/^## \[(\d+\.\d+\.\d+)\]/m.exec(t);
  if(m) document.getElementById('version').textContent='v'+m[1];
}).catch(()=>{});
</script>
<div id="version" aria-hidden="true"></div>
