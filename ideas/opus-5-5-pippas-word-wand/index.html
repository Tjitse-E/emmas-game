<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#8fd29c">
<link rel="icon" href="data:,">
<title>Pippa's Word Wand</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{background:#8fd29c radial-gradient(ellipse at 50% 40%,#d4f3da 0%,#9ad8a6 55%,#6db87c 100%);
  font-family:"Chalkboard SE","Comic Sans MS","Comic Neue","Andika",ui-rounded,system-ui,sans-serif;color:#3a2850}
svg{display:block}
svg.art{overflow:visible}
button{font:inherit;border:0;padding:0;background:none;color:inherit;cursor:pointer;touch-action:none}
.hidden{display:none!important}

#stage{position:absolute;left:50%;top:50%;width:1180px;height:820px;margin:-410px 0 0 -590px;transform-origin:50% 50%;
  overflow:hidden;border-radius:26px;background:#fffaf0;box-shadow:0 18px 50px rgba(30,70,40,.35)}

/* ---------- scene ---------- */
#scene{position:absolute;left:0;top:0;width:1180px;height:486px;overflow:hidden}
#bg,#special,#props,#aboveDark,#dark{position:absolute;inset:0}
#bg svg{width:100%;height:100%}
#special{z-index:2}#props{z-index:3}#group{z-index:5}#dark{z-index:7}#aboveDark{z-index:8;pointer-events:none}#bubble{z-index:9}
#dark{pointer-events:none;opacity:0;transition:opacity 2.2s ease;
  background:radial-gradient(ellipse 330px 260px at 420px 360px,rgba(16,8,40,.42) 0%,rgba(10,5,28,.86) 100%)}
#dark.on{opacity:1}

#group{position:absolute;top:198px;left:-400px;width:350px;height:256px}
#group .pippa{position:absolute;left:84px;top:0;width:160px;height:250px}
#group .bobo{position:absolute;left:232px;top:136px;width:112px;height:122px}
#group .cat{position:absolute;left:0;top:160px;width:92px;height:92px}
.pippa,.bobo,.cat{transform-origin:50% 100%}
.walking .pippa{animation:walkbob .5s ease-in-out infinite}
.walking .bobo{animation:hop .42s ease-in-out infinite}
.walking .cat{animation:walkbob .38s ease-in-out infinite}
.bobo-idle{animation:breathe 2.2s ease-in-out infinite}
@keyframes walkbob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
@keyframes hop{0%,100%{transform:translateY(0) scaleY(1)}40%{transform:translateY(-26px) scaleY(1.05)}85%{transform:translateY(0) scaleY(.88)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.04,.96)}}
.squish{animation:squish .5s ease!important}
@keyframes squish{0%{transform:scale(1)}30%{transform:scale(1.25,.75)}60%{transform:scale(.9,1.15) translateY(-20px)}100%{transform:scale(1)}}
.blink{animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.wand-glow{animation:glowpulse 1.6s ease-in-out infinite;transform-origin:140px 62px}
.glowing .wand-glow{animation:glowbig 1.6s ease-in-out infinite}
@keyframes glowpulse{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.3);opacity:1}}
@keyframes glowbig{0%,100%{transform:scale(3);opacity:.9}50%{transform:scale(3.6);opacity:1}}
.cat.lick .cat-paw{animation:lickpaw .7s ease-in-out 3}
.cat.lick .cat-head{animation:lickhead .7s ease-in-out 3;transform-origin:60px 60px}
@keyframes lickpaw{0%,100%{transform:translate(0,0)}50%{transform:translate(2px,-40px)}}
@keyframes lickhead{0%,100%{transform:rotate(0)}50%{transform:rotate(8deg)}}
.cat-tail{animation:tail 2s ease-in-out infinite;transform-origin:28px 86px}
@keyframes tail{0%,100%{transform:rotate(0)}50%{transform:rotate(12deg)}}

#bubble{position:absolute;width:184px;height:156px;transform-origin:20% 100%;transition:transform .45s cubic-bezier(.3,1.6,.5,1),opacity .3s;cursor:pointer}
#bubble.off{transform:scale(0);opacity:0}
#bubble .pic{position:absolute;left:44px;top:18px;width:100px;height:100px;animation:float 2.4s ease-in-out infinite}
#bubble .wordhint{position:absolute;left:24px;top:40px;width:140px;text-align:center;font-size:48px;font-weight:700;color:#4b2f78}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* map */
#map{position:absolute;left:150px;top:10px;width:880px;height:70px;z-index:75;border-radius:35px;
  background:rgba(255,249,234,.94);box-shadow:0 4px 0 rgba(140,100,50,.18),0 6px 16px rgba(0,0,0,.08)}
#map .route{position:absolute;inset:0}
.stop{position:absolute;top:7px;width:56px;height:56px;margin-left:-28px}
.stop .done{position:absolute;right:-8px;top:-6px;width:28px;height:28px;transform:scale(0);transition:transform .5s cubic-bezier(.3,1.8,.5,1)}
.stop.ok .done{transform:scale(1)}
#marker{position:absolute;top:4px;width:62px;height:62px;margin-left:-31px;border-radius:50%;overflow:hidden;background:#fff;border:3px solid #f5c542;transition:left 2s cubic-bezier(.5,0,.3,1);
  filter:drop-shadow(0 3px 2px rgba(0,0,0,.2))}

/* speak button */
#speak{position:absolute;right:12px;top:6px;width:104px;height:104px;border-radius:50%;z-index:90;background:#fff;
  border:6px solid #f5c542;box-shadow:0 6px 0 #d49a1f,0 8px 18px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center}
#speak:active{transform:translateY(4px);box-shadow:0 2px 0 #d49a1f}
#speak svg{width:64px;height:64px}
#speak .w{opacity:.35}
#speak.talking .w1{animation:wave 1s infinite}
#speak.talking .w2{animation:wave 1s .2s infinite}
@keyframes wave{0%,100%{opacity:.25}50%{opacity:1}}

/* ---------- panel, wand, gems ---------- */
#panel{position:absolute;left:0;top:470px;width:1180px;height:350px;z-index:10;
  background:radial-gradient(ellipse 900px 300px at 50% 0%,#fffaf0 0%,#f6e8cc 70%,#efd9b2 100%)}
#panel svg.edge{position:absolute;left:0;top:-4px;width:1180px;height:30px}
.home-spot{position:absolute;width:104px;height:104px;opacity:.5;pointer-events:none}
#wandArt{position:absolute;left:300px;top:596px;width:720px;height:160px;z-index:11;pointer-events:none;transform-origin:45% 50%}
#wandArt svg{overflow:visible}
#wandArt.wiggle{animation:wiggle .6s ease}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-3deg)}40%{transform:rotate(3deg)}60%{transform:rotate(-2deg)}80%{transform:rotate(2deg)}}
.socket{transition:fill .3s}
.socket.lit{fill:#fff6b0}
.star-glow{animation:glowpulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
#wandArt.full .star-glow{animation:glowbig2 .9s ease-in-out infinite}
@keyframes glowbig2{0%,100%{transform:scale(1.1);opacity:.8}50%{transform:scale(1.5);opacity:1}}
#track{position:absolute;left:356px;top:748px;width:470px;height:68px;z-index:12;pointer-events:none;opacity:0;
  transform:scale(.6);transition:opacity .3s,transform .4s cubic-bezier(.3,1.6,.5,1)}
#track.show{opacity:1;transform:scale(1)}
#track .shim{animation:shim 1.4s linear infinite}
@keyframes shim{from{transform:translateX(-60px)}to{transform:translateX(420px)}}
#wandHit{position:absolute;left:300px;top:600px;width:720px;height:220px;z-index:13}
#gemLayer{position:absolute;inset:0;z-index:20;pointer-events:none}
.gem{position:absolute;left:0;top:0;width:104px;height:104px;pointer-events:auto;touch-action:none;
  transition:transform .5s cubic-bezier(.3,1.35,.5,1);z-index:2;--glow:rgba(255,255,255,.6)}
.gem.dragging{transition:none;z-index:60}
.gem-in{position:absolute;inset:0;transition:transform .2s;
  filter:drop-shadow(0 6px 0 rgba(70,40,90,.22)) drop-shadow(0 0 7px var(--glow))}
.gem.dragging .gem-in{transform:scale(1.14) rotate(-4deg)}
.gem .cut,.gem .face{position:absolute;clip-path:polygon(29% 0,71% 0,100% 29%,100% 71%,71% 100%,29% 100%,0 71%,0 29%)}
.gem .cut{inset:0;background:linear-gradient(150deg,var(--light) 0%,var(--rim) 48%,var(--dark) 100%)}
.gem .face{inset:11px;background:radial-gradient(circle at 32% 26%,#fff 0%,var(--face) 72%)}
.gem .shine{position:absolute;left:21px;top:17px;width:26px;height:11px;border-radius:50%;background:rgba(255,255,255,.95);transform:rotate(-28deg)}
.gem .ltr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:70px;font-weight:700;
  color:var(--ink);line-height:1;padding-bottom:10px}
.gem.lit .gem-in{transform:scale(1.2);filter:drop-shadow(0 0 14px #fff6a0) drop-shadow(0 0 26px #ffcf2e)}
.gem.hint .gem-in{animation:hintglow 1.3s ease-in-out infinite}
.gem.boing .gem-in{animation:boing .45s ease}
.gem.popin .gem-in{animation:popin .55s cubic-bezier(.3,1.7,.5,1) backwards}
@keyframes hintglow{0%,100%{transform:scale(1);filter:drop-shadow(0 6px 0 rgba(70,40,90,.22)) drop-shadow(0 0 6px #ffe066)}
  50%{transform:scale(1.08);filter:drop-shadow(0 6px 0 rgba(70,40,90,.22)) drop-shadow(0 0 24px #ffc400)}}
@keyframes boing{0%{transform:scale(1)}35%{transform:scale(1.18,.86)}65%{transform:scale(.92,1.1)}100%{transform:scale(1)}}
@keyframes popin{0%{transform:scale(0) rotate(-30deg)}100%{transform:scale(1) rotate(0)}}

/* ---------- effects ---------- */
#fx{position:absolute;inset:0;z-index:45;pointer-events:none}
.spark{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;
  clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%)}
.puff{position:absolute;border-radius:50%;background:#ffc2e0}
.magicword{position:absolute;left:0;top:0;width:1180px;text-align:center;pointer-events:none}
.magicword span{display:inline-block;padding:0 46px;height:128px;line-height:118px;font-size:100px;font-weight:700;color:#6a2bbf;letter-spacing:6px;
  background:radial-gradient(ellipse at 50% 30%,#fff 0%,#fff8e1 100%);border:7px solid #f5c542;border-radius:64px;
  box-shadow:0 0 0 8px rgba(255,236,150,.55),0 0 40px rgba(255,214,70,.8),0 8px 0 #d49a1f}
.magicword.silly span{border-color:#ff9ad5;color:#c2407e;box-shadow:0 0 0 8px rgba(255,190,225,.5),0 0 40px rgba(255,150,200,.7),0 8px 0 #e070a8}
.zz{position:absolute;font-size:40px;font-weight:700;color:#6f7fd8}
.heart{position:absolute;font-size:38px;color:#ff6f9c}
.prop{position:absolute;transform-origin:50% 100%}
.prop svg{width:100%;height:100%}
.spin svg{animation:spin 2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#hand{position:absolute;left:0;top:0;width:96px;height:96px;font-size:84px;line-height:96px;text-align:center;z-index:55;
  pointer-events:none;opacity:0;filter:drop-shadow(0 4px 4px rgba(0,0,0,.25))}
.ghost{opacity:.55;transition:none!important;z-index:54!important;pointer-events:none!important}

/* scene specials */
#goat{position:absolute;left:650px;top:314px;width:170px;height:150px;transition:left 1.6s ease-in-out}
#goat .goat-art{transition:transform .2s}
#goat.flip .goat-art{transform:scaleX(-1)}
#goat.munch .goat-head{animation:munch .32s ease-in-out 5}
#goat.walk{animation:walkbob .4s infinite}
@keyframes munch{0%,100%{transform:rotate(0)}50%{transform:rotate(-10deg)}}
.goat-head{transform-origin:70px 70px}
#gatePanel{position:absolute;left:888px;top:296px;width:124px;height:176px;transform-origin:0 50%;
  transition:transform 1.4s cubic-bezier(.4,0,.2,1);transform:perspective(700px) rotateY(0)}
#gatePanel.open{transform:perspective(700px) rotateY(-78deg)}
#batEyes{position:absolute;left:792px;top:118px;width:70px;height:30px;transition:opacity 1s}
#batEyes i{position:absolute;top:0;width:24px;height:30px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#fffbd0,#ffd84a 60%,#e0a51e);
  box-shadow:0 0 16px #ffe066;animation:eyeblink 3.2s infinite}
#batEyes i:first-child{left:0}#batEyes i:last-child{right:0}
@keyframes eyeblink{0%,88%,100%{transform:scaleY(1)}92%{transform:scaleY(.08)}}
#bat{position:absolute;left:756px;top:84px;width:140px;height:90px;animation:batbob 2s ease-in-out infinite}
@keyframes batbob{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
.bat-wing-l{animation:flapl .5s ease-in-out infinite;transform-origin:56px 48px}
.bat-wing-r{animation:flapr .5s ease-in-out infinite;transform-origin:84px 48px}
@keyframes flapl{0%,100%{transform:rotate(0)}50%{transform:rotate(-18deg)}}
@keyframes flapr{0%,100%{transform:rotate(0)}50%{transform:rotate(18deg)}}
#scene.lit .crystal{animation:twinkle 1.6s ease-in-out infinite}
#scene.lit .crystal:nth-of-type(2n){animation-delay:.5s}
#scene.lit .crystal:nth-of-type(3n){animation-delay:1s}
@keyframes twinkle{0%,100%{opacity:.85}50%{opacity:1;filter:brightness(1.6)}}
.wave{animation:wavemove 2.4s ease-in-out infinite}
.wave:nth-of-type(2n){animation-delay:-1.2s}
@keyframes wavemove{0%,100%{transform:translateX(0)}50%{transform:translateX(10px)}}

/* ---------- fade ---------- */
#fade{position:absolute;inset:0;z-index:80;background:#fff7e8;opacity:0;pointer-events:none;transition:opacity .6s}
#fade.on{opacity:1;pointer-events:auto}

/* ---------- party ---------- */
#party{position:absolute;inset:0;z-index:70;overflow:hidden}
#party .bgp{position:absolute;inset:0}
#party .bgp svg{width:100%;height:100%}
#queen{position:absolute;left:900px;top:400px;width:200px;height:300px;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite}
#queen.bow{animation:bow 1.4s ease}
@keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
@keyframes bow{0%,100%{transform:rotate(0)}40%,60%{transform:rotate(-9deg) translateX(-10px)}}
#pgroup{position:absolute;left:50px;top:466px;width:350px;height:256px}
#pgroup .pippa{position:absolute;left:84px;top:0;width:160px;height:250px}
#pgroup .bobo{position:absolute;left:232px;top:136px;width:112px;height:122px}
#pgroup .cat{position:absolute;left:0;top:160px;width:92px;height:92px}
.cheer .pippa{animation:walkbob .5s ease-in-out infinite}
.cheer .bobo{animation:hop .45s ease-in-out infinite}
#table{position:absolute;left:340px;top:582px;width:520px;height:132px}
#items{position:absolute;left:340px;top:420px;width:520px;height:190px}
.item{position:absolute;width:96px;height:132px;text-align:center}
.item .pic{width:84px;height:84px;margin:0 auto}
.item .lbl{display:inline-block;margin-top:2px;padding:0 10px;font-size:32px;font-weight:700;color:#4b2f78;background:#fff;border-radius:14px;
  box-shadow:0 2px 0 rgba(0,0,0,.12);line-height:40px}
.item.say{animation:boing .6s ease}
.confetti{position:absolute;top:-30px;width:14px;height:9px;border-radius:2px}
#pButtons{position:absolute;left:0;top:690px;width:1180px;display:flex;justify-content:center;gap:40px}
.roundbtn{width:112px;height:112px;border-radius:50%;background:#fff;border:6px solid #f5c542;box-shadow:0 6px 0 #d49a1f,0 8px 18px rgba(0,0,0,.15);
  display:flex;align-items:center;justify-content:center;position:relative}
.roundbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #d49a1f}
.roundbtn svg{width:70px;height:70px}
.roundbtn .badge{position:absolute;right:-8px;top:-8px;min-width:40px;height:40px;border-radius:20px;background:#ff6f9c;color:#fff;font-size:26px;
  font-weight:700;line-height:40px;text-align:center;padding:0 8px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.flycrown{position:absolute;width:220px;height:220px;z-index:96}

/* ---------- start ---------- */
#start{position:absolute;inset:0;z-index:100;overflow:hidden}
#start .bgs{position:absolute;inset:0}
#start .bgs svg{width:100%;height:100%}
#title{position:absolute;left:0;top:44px;width:1180px;text-align:center;font-size:76px;font-weight:700;color:#fff;letter-spacing:1px;
  -webkit-text-stroke:8px #8e5bc4;paint-order:stroke fill;text-shadow:0 8px 0 rgba(90,40,140,.25)}
#play{position:absolute;left:460px;top:250px;width:260px;height:260px;border-radius:50%;background:#fff;border:10px solid #f5c542;
  box-shadow:0 10px 0 #d49a1f,0 0 0 18px rgba(255,255,255,.45),0 18px 40px rgba(0,0,0,.2);overflow:hidden;animation:pulse 1.8s ease-in-out infinite}
#play .face{position:absolute;inset:0}
#play .tri{position:absolute;right:14px;bottom:14px;width:76px;height:76px;border-radius:50%;background:#8e5bc4;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 0 #6a3ba0}
#sPippa{position:absolute;left:150px;top:340px;width:220px;height:344px}
#sBobo{position:absolute;left:390px;top:540px;width:150px;height:163px}
#sBook{position:absolute;right:30px;bottom:30px}

/* ---------- sticker book ---------- */
#book{position:absolute;inset:0;z-index:110;background:rgba(60,30,90,.45);display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .35s}
#book.show{opacity:1;pointer-events:auto}
.bk{position:relative;width:1060px;height:700px;display:flex;border-radius:28px;background:#8e5bc4;padding:18px;
  box-shadow:0 14px 0 #6a3ba0,0 20px 50px rgba(0,0,0,.3);transform:scale(.8);transition:transform .45s cubic-bezier(.3,1.5,.5,1)}
#book.show .bk{transform:scale(1)}
.pg{flex:1;background:#fffaf0;position:relative;overflow:hidden}
.pg.l{border-radius:16px 4px 4px 16px;flex:0 0 380px;box-shadow:inset -18px 0 24px -16px rgba(0,0,0,.25)}
.pg.r{border-radius:4px 16px 16px 4px;box-shadow:inset 18px 0 24px -16px rgba(0,0,0,.25)}
.bigcrown{position:absolute;left:90px;top:60px;width:200px;height:200px}
#crownCount{position:absolute;left:0;top:270px;width:100%;text-align:center;font-size:90px;font-weight:700;color:#d49a1f;-webkit-text-stroke:3px #fff;paint-order:stroke fill}
#crownRow{position:absolute;left:30px;top:400px;width:320px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
#crownRow .mc{width:56px;height:56px}
.bkp{position:absolute;left:120px;bottom:12px;width:150px;height:110px}
#stickers{position:absolute;left:26px;top:26px;right:26px;bottom:26px;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:150px;gap:10px}
.sticker{position:relative;border-radius:22px;background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.08);border:3px dashed #e3d3f3;display:flex;flex-direction:column;align-items:center;justify-content:center}
.sticker .pic{width:86px;height:86px}
.sticker .lbl{font-size:34px;font-weight:700;color:#4b2f78;line-height:40px;height:40px}
.sticker.got{border:4px solid #fff;box-shadow:0 0 0 3px #f5c542,0 4px 0 rgba(0,0,0,.1)}
.sticker.locked .pic{filter:grayscale(1) brightness(0);opacity:.12}
.sticker.new{animation:newsticker 1s ease 2}
.sticker.say{animation:boing .5s ease}
@keyframes newsticker{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.12) rotate(-4deg)}}
#bookClose{position:absolute;right:-26px;top:-26px;z-index:2}
</style>
</head>
<body>
<div id="stage">
  <div id="scene">
    <div id="bg"></div>
    <div id="special"></div>
    <div id="props"></div>
    <div id="group">
      <div class="cat hidden"></div>
      <div class="pippa"></div>
      <div class="bobo"></div>
    </div>
    <div id="dark"></div>
    <div id="aboveDark"></div>
    <div id="bubble" class="off"></div>
  </div>

  <div id="map"></div>

  <div id="panel"></div>
  <div id="wandArt"></div>
  <div id="track"></div>
  <div id="wandHit"></div>
  <div id="gemLayer"></div>

  <div id="fx"></div>
  <div id="hand">👆</div>

  <div id="party" class="hidden">
    <div class="bgp"></div>
    <div id="table"></div>
    <div id="items"></div>
    <div id="queen"></div>
    <div id="pgroup"><div class="cat hidden"></div><div class="pippa"></div><div class="bobo"></div></div>
    <div id="pButtons" class="hidden">
      <button class="roundbtn" id="pBook" aria-label="Sticker book"></button>
      <button class="roundbtn" id="pAgain" aria-label="Play again"></button>
    </div>
  </div>

  <button id="speak" class="hidden" aria-label="Say it again"></button>
  <div id="fade"></div>

  <div id="book">
    <div class="bk">
      <div class="pg l"><div class="bigcrown"></div><div id="crownCount">0</div><div id="crownRow"></div></div>
      <div class="pg r"><div id="stickers"></div></div>
      <button class="roundbtn" id="bookClose" aria-label="Close"></button>
    </div>
  </div>

  <div id="start">
    <div class="bgs"></div>
    <div id="title">Pippa's Word Wand</div>
    <div id="sPippa"></div>

function gearPts(cx, cy, R, r, teeth){ const st = Math.PI*2/teeth, p = [];

/* =====================================================================
   AUDIO: say(id) tries audio/<id>.mp3, falls back to speechSynthesis
   ===================================================================== */
const voiceEl = new Audio(); voiceEl.preload = 'auto';
const missing = new Set();
const active = new Set();
let gen = 0, chain = Promise.resolve(), ttsVoice = null;
function pickVoice(){
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices(), gb = vs.filter(v => /en[-_]GB/i.test(v.lang));
  const pref = ['Serena','Kate','Stephanie','Martha','Google UK English Female','Fiona','Moira','Daniel'];
  ttsVoice = pref.map(n => gb.find(v => v.name.includes(n))).find(Boolean) || gb[0] || vs.find(v => /^en/i.test(v.lang)) || null;
}
if ('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function talkingUI(){ $('#speak').classList.toggle('talking', active.size > 0); }
function stopVoice(){
  gen++; chain = Promise.resolve();
  [...active].forEach(c => c.finish());
  try { voiceEl.pause(); } catch(e){}
  try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch(e){}
}
function play(id, o = {}){
  return new Promise(resolve => {
    let done = false, fb = false;
    const c = { finish(){ if (done) return; done = true; clearTimeout(c.t); active.delete(c); talkingUI(); resolve(); } };
    active.add(c); talkingUI(); G.lastSaid = id;
    const text = LINES[id] || id.replace(/^\w+-/, '');
    if (G.fast){ c.t = setTimeout(c.finish, 20); return; }
    const fallback = () => {
      if (done || fb) return; fb = true; missing.add(id);
      const t = id.startsWith('sound-') ? SOUND_TTS[id.slice(6)] || text : text;
      const est = Math.max(700, t.length * 65 / (o.stretch ? .6 : 1)) + 800;
      c.t = setTimeout(c.finish, est * 1.4);
      if (!('speechSynthesis' in window)) { clearTimeout(c.t); c.t = setTimeout(c.finish, est * .7); return; }
      const u = new SpeechSynthesisUtterance(t);
      u.lang = 'en-GB'; if (ttsVoice) u.voice = ttsVoice;
      u.rate = o.stretch ? .55 : (id.startsWith('sound-') ? .75 : .9);
      u.pitch = o.pitch || 1.1;
      u.onend = () => c.finish(); u.onerror = () => c.finish();
      setTimeout(() => { if (!done) speechSynthesis.speak(u); }, 40);
    };
    if (missing.has(id)) return fallback();
    voiceEl.onended = () => c.finish();
    voiceEl.onerror = fallback;
    voiceEl.src = 'audio/' + id + '.mp3';
    voiceEl.playbackRate = o.stretch ? .8 : 1;
    const p = voiceEl.play(); if (p && p.catch) p.catch(fallback);
  });
}
function say(id, o){ stopVoice(); const p = play(id, o); chain = p; return p; }
function sayQ(id, o){ const g = gen; chain = chain.then(() => g === gen ? play(id, o) : undefined); return chain; }

/* ---------- WebAudio sound effects ---------- */
let AC = null;
function ac(){ if (!AC){ try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} } return AC; }
function tone(f, t0, dur, type = 'sine', vol = .15, f2){
  const a = ac(); if (!a || G.fast) return; const t = a.currentTime + t0;
  const o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .05);
}
function noise(t0, dur, vol = .2, ftype = 'lowpass', freq = 1200, freq2){
  const a = ac(); if (!a || G.fast) return; const t = a.currentTime + t0;
  const buf = a.createBuffer(1, Math.ceil(a.sampleRate * dur), a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1;
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(); s.buffer = buf; f.type = ftype; f.frequency.setValueAtTime(freq, t);
  if (freq2) f.frequency.exponentialRampToValueAtTime(freq2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(a.destination); s.start(t);
}
const SFX = {
  tap(){ tone(700, 0, .1, 'sine', .1); },
  snap(){ tone(880, 0, .09, 'triangle', .15); tone(1320, .05, .15, 'sine', .1); },
  chime(){ [1046,1318,1568,2093].forEach((f,i) => tone(f, i*.08, .5, 'sine', .09)); },
  sparkle(){ for (let i = 0; i < 9; i++) tone(1400 + Math.random()*1600, i*.045, .14, 'sine', .05); },
  pop(){ tone(380, 0, .12, 'sine', .18, 900); },
  whoosh(){ noise(0, .35, .12, 'bandpass', 400, 2400); },
  giggle(){ [700,920,760,980,820,1040].forEach((f,i) => tone(f, i*.085, .08, 'triangle', .1, f*1.25)); },
  splash(){ noise(0, .7, .22, 'lowpass', 2400, 300); noise(.12, .4, .1, 'highpass', 3000); },
  thud(){ tone(130, 0, .3, 'sine', .3, 55); noise(0, .15, .1, 'lowpass', 500); },
  bleat(){ const a = ac(); if (!a || G.fast) return; const t = a.currentTime;
    const o = a.createOscillator(), l = a.createOscillator(), lg = a.createGain(), g = a.createGain(), f = a.createBiquadFilter();
    o.type = 'sawtooth'; o.frequency.value = 330; l.frequency.value = 22; lg.gain.value = 26; l.connect(lg).connect(o.frequency);
    f.type = 'lowpass'; f.frequency.value = 1600; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.12, t + .05); g.gain.exponentialRampToValueAtTime(.0001, t + .8);
    o.connect(f).connect(g).connect(a.destination); o.start(t); l.start(t); o.stop(t + .85); l.stop(t + .85); },
  munch(){ for (let i = 0; i < 5; i++) noise(i*.32, .12, .16, 'bandpass', 900); },
  squeak(){ tone(1200, 0, .12, 'sine', .14, 1900); tone(1500, .14, .12, 'sine', .12, 2300); },
  snore(){ noise(0, .9, .07, 'lowpass', 300, 600); noise(1.1, .9, .07, 'lowpass', 300, 600); },
  meow(){ tone(600, 0, .5, 'triangle', .1, 900); tone(900, .25, .35, 'triangle', .08, 520); },
  creak(){ tone(160, 0, 1, 'sawtooth', .04, 240); },
  clack(){ tone(900, 0, .05, 'square', .06); tone(700, .18, .05, 'square', .06); tone(1000, .34, .05, 'square', .05); },
  drip(){ tone(1400, 0, .12, 'sine', .08, 600); },
  fanfare(){ [[523,0,.18],[659,.18,.18],[784,.36,.18],[1046,.54,.6],[784,.95,.16],[1046,1.12,.8]].forEach(([f,t,d]) => { tone(f, t, d, 'square', .05); tone(f, t, d, 'sine', .1); }); },
  hum(){ [523,659,784].forEach(f => tone(f, 0, 1.4, 'sine', .05)); },
};

function silentWav(){
  const n = 800, b = new Uint8Array(44 + n), v = new DataView(b.buffer), w = (o, t) => [...t].forEach((c, i) => b[o + i] = c.charCodeAt(0));
  w(0,'RIFF'); v.setUint32(4, 36 + n, true); w(8,'WAVE'); w(12,'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true); w(36,'data'); v.setUint32(40, n, true); b.fill(128, 44);
  let s = ''; b.forEach(x => s += String.fromCharCode(x)); return 'data:audio/wav;base64,' + btoa(s);
}
function unlockAudio(){
  if (G.unlocked) return; G.unlocked = true;
  const a = ac(); if (a && a.state === 'suspended') a.resume();
  try { voiceEl.src = silentWav();
    const p = voiceEl.play(); if (p && p.catch) p.catch(() => {}); } catch(e){}
  try { if ('speechSynthesis' in window){ const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } } catch(e){}
}

/* Shuffle the gem row so no target word can be read off it in order.
   Otherwise she could drag the first three gems without listening. */
function shuffledGems(sc){
  const inOrder = (row, w) => { let k = 0; for (const l of row) if (l === w[k]) k++; return k === w.length; };
  let row = sc.gems.slice();
  for (let n = 0; n < 200; n++){
    for (let i = row.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i + 1)); [row[i], row[j]] = [row[j], row[i]]; }
    if (!sc.target.some(w => inOrder(row, w))) break;
  }
  return row;
}

let gesture = null;
let slide = null;
function touched(){ resetIdle(); }
$('#gemLayer').addEventListener('pointerdown', e => {
  const ge = e.target.closest('.gem'); if (!ge || G.mode !== 'play' || gesture) return;
  const g = G.gems.find(x => x.el === ge); if (!g) return;
  e.preventDefault(); try { ge.setPointerCapture(e.pointerId); } catch(_){}
  const p = toStage(e);
  gesture = {type:'gem', g, id:e.pointerId, sx:p.x, sy:p.y, ox:p.x - g.x, oy:p.y - g.y, mode:'pending'};
  touched();
});
$('#wandHit').addEventListener('pointerdown', e => {
  if (G.mode !== 'play' || gesture) return; e.preventDefault();
  try { e.target.setPointerCapture(e.pointerId); } catch(_){}
  const p = toStage(e); touched();
  gesture = {type:'wand', id:e.pointerId, sx:p.x, sy:p.y, mode:'pending'};
});
addEventListener('pointermove', e => {
  if (!gesture || e.pointerId !== gesture.id) return;
  const p = toStage(e), dx = p.x - gesture.sx, dy = p.y - gesture.sy, dist = Math.hypot(dx, dy);
  if (gesture.mode === 'pending' && dist > 16){
    if (allFull() && (gesture.type === 'wand' || (gesture.g.slot >= 0 && Math.abs(dx) > Math.abs(dy)))) { gesture.mode = 'slide'; startSlide(); }
    else if (gesture.type === 'gem'){
      gesture.mode = 'drag'; const g = gesture.g;
      if (g.slot >= 0){ G.slots[g.slot] = null; g.slot = -1; updateWand(); }
      g.el.classList.add('dragging'); g.el.classList.remove('hint');
    }
  }
  if (gesture.mode === 'drag'){ setGemPos(gesture.g, {x:p.x - gesture.ox, y:p.y - gesture.oy}); }
  if (gesture.mode === 'slide') slideMove(p);
});
function endGesture(e){
  if (!gesture || e.pointerId !== gesture.id) return;
  const gs = gesture; gesture = null;
  if (gs.mode === 'drag'){ gs.g.el.classList.remove('dragging'); applyHintGlow(); dropGem(gs.g); return; }
  if (gs.mode === 'slide'){ endSlide(); return; }
  // taps
  if (gs.type === 'gem'){
    const g = gs.g;
    if (g.slot >= 0){ sendHome(g); applyHintGlow(); return; }
    g.el.classList.add('boing'); setTimeout(() => g.el.classList.remove('boing'), 460); SFX.tap(); say('sound-' + g.letter);
    if (++G.taps >= 4){ G.taps = 0; setTimeout(() => { if (G.mode === 'play'){ sayQ('hint-drag'); demoDrag(); } }, 700); }
  } else if (gs.type === 'wand'){
    if (allFull()) slideHint();
  }
}
addEventListener('pointerup', endGesture);
addEventListener('pointercancel', endGesture);

function slideMove(p){
  if (!slide || slide.done) return;
  if (Math.abs(p.x - slide.lastSpark) > 30){ slide.lastSpark = p.x; sparkleBurst(p.x, Math.min(p.y, 800), 3); }
  while (slide.next < 3 && p.x >= SLOT_X[slide.next] - 34){

  if (!slide) return;

  slide = null;

   ===================================================================== */
function isCVC(w){ return w.length === 3 && !VOWELS.includes(w[0]) && VOWELS.includes(w[1]) && !VOWELS.includes(w[2]); }
/* Made-up words are read aloud only when they follow English spelling.
   English words do not end in c (loc sounds like lock), h or j, so those get a giggle instead. */
function sayable(w){ return isCVC(w) && !'chj'.includes(w[2]) && !AVOID.includes(w); }

async function finishBlend(){
  if (G.mode !== 'play') return;

  const word = G.slots.map(g => g.letter).join('');
  const sc = SCENES[G.sceneIdx], kind = sc.words[word] || 'none';
  G.spells.push(word);
  await chain;
  G.slots.forEach(g => g.el.classList.remove('lit'));
  SLOT_X.forEach((_, i) => document.getElementById('sock' + i).classList.remove('lit'));
  if (kind === 'none'){
    const p = showWord(word, true);
    await wait(700);
    if (sayable(word)){ await say('nonword-' + word); await say('silly-word'); }
    else { await say('giggle'); await say('silly-word'); }
    await p;
  } else {
    await say('word-' + word);
    await showWord(word);
    if (kind === 'solve'){ addConjured(word); hideBubble(); await returnAllGems(); await SOLVE[sc.id](word); return; }
    if (kind === 'thing'){ addConjured(word); await THING[word](); }
    if (kind === 'word'){

      else { puff(800, 420, '#d5f2ff', 7); SFX.splash(); }

    }

  G.misses++;
  await returnAllGems();
  await wait(300);
  applyHintGlow();
  G.mode = 'play'; updateWand();
  if (G.misses >= 4) { await segmentHint(); }
  G.line = sc.line; resetIdle();
}

  const bb = $('#pBook').getBoundingClientRect(), sr = stage.getBoundingClientRect();
  const bx = (bb.left - sr.left)/G.scale + 56 - 110, by = (bb.top - sr.top)/G.scale + 56 - 110;
  await cr.animate([{transform:'translate(480px,260px) scale(1)'},{transform:`translate(${bx}px,${by}px) scale(.25) rotate(360deg)`}], {duration:900, easing:'ease-in', fill:'forwards'}).finished;
  cr.remove(); SFX.pop();
  const before = G.book.words.slice();
  G.book.crowns++; G.conjured.forEach(w => { if (!G.book.words.includes(w)) G.book.words.push(w); }); saveBook(G.book); updateBadges();
  $('#pBook').animate([{transform:'scale(1)'},{transform:'scale(1.3)'},{transform:'scale(1)'}], {duration:500});
  sparkleBurst((bb.left - sr.left)/G.scale + 56, (bb.top - sr.top)/G.scale + 56, 14);
  await wait(700);
  $('#pgroup').classList.remove('cheer');
  openBook(G.book.words.filter(w => !before.includes(w)), true);
}
function loadBook(){ try { const b = JSON.parse(localStorage.getItem('pww-book')); if (b && Array.isArray(b.words)) return b; } catch(e){} return {crowns:0, words:[]}; }
function saveBook(b){ try { localStorage.setItem('pww-book', JSON.stringify(b)); } catch(e){} }
function updateBadges(){ const n = G.book.words.length; ['#pBadge','#sBadge'].forEach(s => { const e = $(s); if (e){ e.textContent = n; e.style.display = n ? '' : 'none'; } }); }
let bookFromParty = false;
function openBook(fresh = [], fromParty = false){
  bookFromParty = fromParty;
  const b = G.book;
  $('#crownCount').textContent = b.crowns;
  $('#crownRow').innerHTML = Array.from({length:Math.min(b.crowns, 10)}, () => `<div class="mc">${svgCrown()}</div>`).join('');
  $('#stickers').innerHTML = ALL_THINGS.map(w => b.words.includes(w)
    ? `<div class="sticker got ${fresh.includes(w) ? 'new' : ''}" data-w="${w}"><div class="pic">${ITEM(w)}</div><div class="lbl">${w}</div></div>`
    : `<div class="sticker locked"><div class="pic">${ITEM(w)}</div><div class="lbl"></div></div>`).join('');
  $('#book').classList.add('show'); SFX.whoosh();
  if (G.unlocked){ if (fromParty) say('book-look'); }
}
function closeBook(){
  $('#book').classList.remove('show'); SFX.whoosh();
  if (bookFromParty || G.mode === 'party'){ bookFromParty = false; G.line = 'play-again'; say('play-again'); $('#pAgain').classList.add('pulse'); }
}
$('#stickers').addEventListener('pointerdown', e => {
  const s = e.target.closest('.sticker.got'); if (!s) return; e.preventDefault(); unlockAudio();
  s.classList.remove('say', 'new'); void s.offsetWidth; s.classList.add('say'); say('word-' + s.dataset.w);
});
$('#bookClose').addEventListener('pointerdown', e => { e.preventDefault(); closeBook(); });
$('#pBook').addEventListener('pointerdown', e => { e.preventDefault(); openBook([], false); });
$('#sBook').addEventListener('pointerdown', e => { e.preventDefault(); unlockAudio(); openBook([], false); });
$('#pAgain').addEventListener('pointerdown', e => { e.preventDefault(); restart(); });

/* ---------- start and restart ---------- */
async function startGame(){
  G.mode = 'cut'; G.conjured = []; G.spells = []; G.hasCat = false; G.slideTold = false;
  $('#group .cat').classList.add('hidden');
  for (let i = 0; i < 4; i++) document.getElementById('stop' + i).classList.remove('ok');
  $('#speak').classList.remove('hidden');
  await enterScene(0, {intro:true});
}
async function restart(){
  stopVoice(); $('#pAgain').classList.remove('pulse');
  await fadeOut(); $('#party').classList.add('hidden'); fx.innerHTML = '';
  startGame();
}
$('#play').addEventListener('pointerdown', e => {
  e.preventDefault(); unlockAudio(); SFX.chime();
  $('#fade').classList.add('on');
  setTimeout(() => { $('#start').classList.add('hidden'); startGame(); }, 500);
});
$('#speak').addEventListener('pointerdown', e => {
  e.preventDefault(); touched();
  const b = $('#speak'); b.animate([{transform:'scale(1)'},{transform:'scale(1.12)'},{transform:'scale(1)'}], {duration:300});
  if (G.mode === 'cut' || (G.mode === 'party' && $('#pButtons').classList.contains('hidden'))) return;
  if (G.mode === 'play' && allFull()) { slideHint(); return; }
  if (G.mode === 'play' && G.line === 'hint-drag') { say('hint-drag'); demoDrag(); return; }
  if (G.line) say(G.line);
});
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());

buildStatic();

/* ---------- debug hook for testers ---------- */
window.__game = {
  G, LINES, SCENES,
  get state(){ return {mode:G.mode, scene:G.sceneIdx >= 0 && G.sceneIdx < 3 ? SCENES[G.sceneIdx].id : (G.sceneIdx === 3 ? 'party' : 'start'),
    misses:G.misses, slots:G.slots.map(g => g ? g.letter : null), conjured:G.conjured.slice(), spells:G.spells.slice(), hasCat:G.hasCat, book:G.book, lastSaid:G.lastSaid}; },
  set fast(v){ G.fast = !!v; }, get fast(){ return G.fast; },
  start(){ $('#start').classList.add('hidden'); return startGame(); },
  /* Spell a word as if Emma dragged the gems and slid along the wand. */
  async spell(word){
    if (G.mode !== 'play') return 'not ready: ' + G.mode;
    G.slots.filter(Boolean).forEach(g => sendHome(g, true));
    const used = [];
    for (let i = 0; i < 3; i++){ const g = G.gems.find(x => x.letter === word[i] && !used.includes(x)); if (!g) return 'no gem ' + word[i]; used.push(g); placeInSlot(g, i); }
    startSlide(); slideMove({x:SLOT_X[2] + 60, y:780});
    return 'ok';
  },
  skipTo(i){ stopVoice(); $('#start').classList.add('hidden'); $('#speak').classList.remove('hidden'); if (i >= 3) return party(); return enterScene(i); },
  resetBook(){ G.book = {crowns:0, words:[]}; saveBook(G.book); updateBadges(); },
};
</script>
