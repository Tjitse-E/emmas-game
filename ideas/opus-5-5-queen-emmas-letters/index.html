<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#5d0f3a">
<title>Queen Emma's Letters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#43233f; --gold:#f6c453; --gold-d:#c98e12; --velvet:#8e1e5a; --velvet-d:#55093a;
  --parch:#fff6dc; --parch-d:#ecd6a0; --sky:#bfe9ff; --grass:#9fdc7c; --grass-d:#6fbf58;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#2c0b26;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  font-family:Andika,"Avenir Next Rounded","Arial Rounded MT Bold","Avenir Next",system-ui,sans-serif;color:var(--ink)}
button{font:inherit;border:0;padding:0;background:none;color:inherit;cursor:pointer}
svg{display:block;width:100%;height:100%;overflow:visible}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:#3b1736;touch-action:none}

/* ---------- Desk ---------- */
#desk{position:absolute;overflow:hidden;
  background:
    radial-gradient(circle at 30% 20%, rgba(255,255,255,.12), transparent 40%),
    repeating-linear-gradient(115deg, rgba(255,255,255,.035) 0 6px, transparent 6px 14px),
    radial-gradient(ellipse at 50% 50%, #a52a6a, var(--velvet) 55%, var(--velvet-d));}
#desk::after{content:"";position:absolute;inset:0;pointer-events:none;border:6px solid var(--gold);border-radius:0;box-shadow:inset 0 0 0 3px #fff3, inset 0 0 40px #0006}
.landscape #desk{left:0;top:0;width:380px;height:820px}
.portrait #desk{left:0;top:0;width:820px;height:400px}
.deskitem{position:absolute}
.landscape #earBtn{left:18px;top:18px}
.portrait #earBtn{left:18px;top:18px}
#earBtn{width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffe7a3 60%,#f1b53a);box-shadow:0 6px 0 var(--gold-d),0 10px 18px #0005;z-index:5}
#earBtn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--gold-d),0 4px 10px #0005}
#earBtn svg{width:62%;height:62%;margin:auto}
#earBtn.talk svg .wave{animation:wavey .6s infinite alternate}
@keyframes wavey{to{opacity:.3}}
.landscape #crown{left:122px;top:10px;width:240px;height:124px}
.portrait #crown{left:14px;top:118px;width:196px;height:104px}
#crown .gem{opacity:0;transform:scale(.2);transform-box:fill-box;transform-origin:center;transition:all .5s cubic-bezier(.3,1.8,.5,1)}
#crown .gem.on{opacity:1;transform:scale(1)}
#crown.shine{animation:crownShine 1.2s ease-in-out 2}
@keyframes crownShine{50%{filter:drop-shadow(0 0 18px #fff6a8) brightness(1.2);transform:scale(1.08) rotate(-3deg)}}
.landscape #scrollArea{left:16px;top:146px;width:348px;height:496px}
.portrait #scrollArea{left:226px;top:12px;width:440px;height:376px}
.landscape #bell{left:20px;top:664px;width:130px;height:136px}
.portrait #bell{left:46px;top:236px;width:130px;height:136px}
.landscape #inkpot{left:154px;top:700px;width:66px;height:100px}
.portrait #inkpot{left:700px;top:24px;width:84px;height:120px}
.landscape #basket{left:222px;top:662px;width:150px;height:140px}
.portrait #basket{left:670px;top:236px;width:140px;height:140px}

/* Bell */
#bell{z-index:4}
#bell .ring-bg{stroke:#ffffff30}
#bell .ring{stroke:var(--gold);transition:stroke .3s}
#bell.ready .ring{stroke:#ffe680}
#bell.ready .bellbody{animation:bellWiggle 1.4s ease-in-out infinite;transform-origin:60px 30px}
#bell.ready{filter:drop-shadow(0 0 14px #ffe680)}
#bell.nope .bellbody{animation:nope .35s;transform-origin:60px 30px}
#bell.ringing .bellbody{animation:ringing .18s 6 alternate;transform-origin:60px 30px}
@keyframes bellWiggle{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-10deg)}80%{transform:rotate(10deg)}90%{transform:rotate(-5deg)}}
@keyframes nope{33%{transform:rotate(-4deg)}66%{transform:rotate(4deg)}}
@keyframes ringing{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}

/* Scroll */
#rolled{position:absolute;left:50%;top:50%;width:230px;height:120px;margin:-60px 0 0 -115px;display:none;z-index:3}
#rolled.show{display:block;animation:rolledIdle 1.6s ease-in-out infinite}
@keyframes rolledIdle{50%{transform:translateY(-6px) rotate(-2deg)}}
#scroll{position:absolute;inset:0;display:none;z-index:2;transform-origin:50% 0}
#scroll.show{display:block}
#scroll .rod{position:absolute;left:-6px;right:-6px;height:26px;border-radius:13px;background:linear-gradient(#f9dc8c,#d39b2a 60%,#a86f12);box-shadow:0 4px 8px #0005}
#scroll .rod::before,#scroll .rod::after{content:"";position:absolute;top:-4px;width:20px;height:34px;border-radius:10px;background:radial-gradient(circle at 40% 35%,#fff2b8,#d39b2a 60%,#8a5a0c)}
#scroll .rod::before{left:-10px}#scroll .rod::after{right:-10px}
#scroll .rod.top{top:0}#scroll .rod.bot{bottom:0}
#scroll .paper{position:absolute;left:4px;right:4px;top:12px;bottom:12px;
  background:radial-gradient(ellipse at 50% 40%,#fffbea,var(--parch) 60%,#f3e1b0);
  box-shadow:inset 0 0 30px #c9a25a55, 0 6px 16px #0004;}
#seal{position:absolute;left:50%;top:-6px;width:84px;height:84px;margin-left:-42px;border-radius:50%;z-index:3;
  background:radial-gradient(circle at 40% 35%,#fff,#ffe9f3);border:5px solid var(--gold);box-shadow:0 4px 10px #0004;overflow:hidden}
#seal svg{width:86%;height:86%;margin:8% auto 0}
#words{position:absolute;left:14px;right:14px;top:84px;bottom:28px;display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:center;gap:2px 16px}
.portrait #words{top:80px;gap:0 18px}
.word{position:relative;display:inline-flex;align-items:flex-start;justify-content:center;min-width:72px;height:86px;padding:0 4px;
  font-size:58px;line-height:62px;font-weight:700;color:var(--ink);border-radius:18px;touch-action:none;transition:background .2s}
.word .g{position:relative;display:inline-block;height:86px}
.word .dot{position:absolute;left:50%;bottom:8px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#7c5a8a;opacity:0;transform:scale(0);transition:all .25s cubic-bezier(.3,1.8,.5,1)}
.word .dot.dash{width:70%;margin-left:-35%;height:10px;border-radius:5px;bottom:11px}
.word.dotted .dot{opacity:1;transform:scale(1)}
.word .g.on .dot{background:#ff5fa2;transform:scale(1.5);box-shadow:0 0 10px #ff9ccc}
.word .g.on{color:#d81b72}
.word .p{display:inline-block;height:86px;color:#8a6a7a;pointer-events:none}
.word.tricky::after{content:"";position:absolute;left:8px;right:8px;bottom:12px;height:8px;border-radius:4px;background:linear-gradient(90deg,#f6c453,#ffe58a,#f6c453);box-shadow:0 1px 0 var(--gold-d)}
.word.tricky .p{margin-left:2px}
.word.num{color:#1f6fb8}
.word.num::after{content:"";position:absolute;left:10px;right:10px;bottom:12px;height:8px;border-radius:4px;background:#8ec9ff}
.word.read{background:#ffffff8c}
.word.say{background:#ffe3f1;transform:scale(1.06)}
.word.pulse{animation:wpulse 1s ease-in-out 3}
@keyframes wpulse{50%{transform:scale(1.15);background:#fff1a8}}
.word.pop{animation:wpop .5s}
@keyframes wpop{40%{transform:scale(1.22) rotate(-3deg)}}

/* Basket */
#basket{display:none;z-index:6;touch-action:none}
#basket.show{display:block;animation:popIn .6s cubic-bezier(.3,1.6,.5,1)}
.bwrap{position:absolute;inset:0}
.bapples{position:absolute;left:14%;right:14%;bottom:34%;height:60%}
.bapples .mini{position:absolute;width:34px;height:36px}
.bnum{position:absolute;right:4px;top:-8px;min-width:54px;height:54px;border-radius:27px;background:#fff;border:4px solid #1f6fb8;color:#1f6fb8;font-weight:700;font-size:36px;line-height:46px;text-align:center;display:none}
.bnum.show{display:block}
#basket.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.1,0.92)}}
@keyframes popIn{from{transform:scale(0)}to{transform:scale(1)}}

/* ---------- Map ---------- */
#map{position:absolute;overflow:hidden;background:#9fdc7c}
.landscape #map{left:380px;top:0;width:800px;height:820px}
.portrait #map{left:0;top:400px;width:820px;height:780px}
#mapInner{position:absolute;left:0;top:0;width:800px;height:820px;transform-origin:0 0}
.portrait #mapInner{transform:translate(29px,0) scale(.9512)}
.ent{position:absolute;touch-action:none}
.ent>svg{pointer-events:none}
#bg{position:absolute;inset:0}
.portrait #bg{left:-31px;right:-31px}
#hearts{position:absolute;left:280px;top:14px;width:240px;height:78px;border-radius:40px;background:#fff8;box-shadow:0 4px 0 #0001;display:flex;justify-content:space-around;align-items:center;padding:0 12px;z-index:30}
#hearts .hs{width:62px;height:58px;transition:transform .3s}
#hearts .hs .fill{opacity:0;transition:opacity .3s}
#hearts .hs.on .fill{opacity:1}
#hearts .hs.on{animation:heartPop .6s}
@keyframes heartPop{40%{transform:scale(1.5)}}
.bounce{animation:bounce .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes bounce{40%{transform:translateY(-22px) scale(1.06,.95)}70%{transform:translateY(0) scale(.95,1.05)}}
.wiggle{animation:wiggle .5s}
@keyframes wiggle{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}

#pig{z-index:12}
#pig.roll{animation:pigRoll 1.6s ease-in-out}
@keyframes pigRoll{20%{transform:rotate(-30deg) translateY(10px)}50%{transform:rotate(200deg) translateY(10px)}80%{transform:rotate(360deg)}100%{transform:rotate(360deg)}}
.muddy .mudspots{opacity:1}
.mudspots{transition:opacity .6s}
#pig.happy{animation:happyHop 1.2s ease-in-out infinite}
@keyframes happyHop{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-8px) rotate(-4deg)}75%{transform:translateY(-8px) rotate(4deg)}}
#hen{z-index:11}
#hen .head{transform-origin:90px 60px;transition:transform .5s}
#hen .wing{transform-origin:44px 76px;transition:transform .5s}
#hen .tailf{transform-origin:32px 72px;transition:transform .5s}
#hen .tear{transition:opacity .4s}
#seal .tear{opacity:1}
#hen.sad .head{transform:rotate(16deg) translateY(4px)}
#hen.sad .wing{transform:rotate(18deg)}
#hen.sad .tailf{transform:rotate(-22deg)}
#hen.sad .tear{opacity:1;animation:tear 2s infinite}
@keyframes tear{0%{transform:translateY(0);opacity:0}30%{opacity:1}100%{transform:translateY(14px);opacity:0}}
#hen.flap .wing{animation:flap .16s 8 alternate}
@keyframes flap{to{transform:rotate(-38deg)}}
#hen.dance{animation:dance .8s ease-in-out infinite}
@keyframes dance{0%,100%{transform:rotate(0) translateY(0)}25%{transform:rotate(-8deg) translateY(-12px)}75%{transform:rotate(8deg) translateY(-12px)}}
#hen .onhead{position:absolute;left:52px;top:-40px;width:92px;height:70px;pointer-events:none}
#hen.sad .onhead{left:58px;top:-30px;transform:rotate(14deg)}
#fox{z-index:11}
#fox .tail{transform-origin:96px 118px}
#fox.wag .tail{animation:wag .2s 6 alternate}
@keyframes wag{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
#fox.jump{animation:bounce .5s}
#duck{z-index:9;animation:duckBob 3s ease-in-out infinite}
@keyframes duckBob{50%{transform:translateY(5px) rotate(2deg)}}
#duck.quack{animation:bounce .45s}
#store .doorL,#store .doorR{transition:transform .6s;transform-box:fill-box}
#store .doorL{transform-origin:left center}
#store .doorR{transform-origin:right center}
#store.open .doorL{transform:scaleX(.15)}
#store.open .doorR{transform:scaleX(.15)}
#wardrobe .wdoor{transition:transform .6s;transform-box:fill-box;transform-origin:left center}
#wardrobe.open .wdoor{transform:scaleX(.12)}
.zone{z-index:3}
.zone-glow{animation:zglow 1s ease-in-out 3}
@keyframes zglow{50%{filter:drop-shadow(0 0 16px #fff) brightness(1.15);transform:scale(1.05)}}

.panel{position:absolute;display:none;z-index:25;border-radius:28px;background:#fffaf0f2;border:6px solid #c98e12;box-shadow:0 10px 30px #0005}
.panel.show{display:block;animation:popIn .45s cubic-bezier(.3,1.6,.5,1)}
#storePanel{left:14px;top:500px;width:562px;height:306px;transform-origin:85% 60%}
#frame{position:absolute;left:14px;top:14px;display:grid;grid-template-columns:repeat(5,100px);grid-template-rows:repeat(2,100px);gap:6px}
#frame .cell{position:relative;width:100px;height:100px;border-radius:16px;background:#f3e3bd;box-shadow:inset 0 3px 0 #0001;border:3px dashed #d7b979}
#frame .apple{position:absolute;inset:4px;touch-action:none}
#frame .apple.ghosty{opacity:.25;filter:grayscale(.6)}
#frame .apple.hop{animation:bounce .5s}
#eq{position:absolute;left:0;right:0;bottom:8px;height:66px;display:flex;justify-content:center;align-items:center;gap:18px;font-size:54px;font-weight:700;color:#1f6fb8}
#eq span{opacity:0;transform:scale(.3);transition:all .45s cubic-bezier(.3,1.8,.5,1)}
#eq span.on{opacity:1;transform:scale(1)}
#eq .foxmini{width:56px;height:52px;display:inline-block}
#wardPanel{left:200px;top:540px;width:476px;height:270px;transform-origin:10% 80%}
#wardPanel .slot{position:absolute;width:140px;height:110px;border-radius:18px;background:#f4e8ff;border:3px dashed #c4a8f0}
#wardPanel .item{position:absolute;inset:6px;touch-action:none}

#rainbow{position:absolute;left:-40px;top:-60px;width:880px;height:520px;z-index:2;pointer-events:none;opacity:0}
#rainbow.show{opacity:1}
#rainbow path{stroke-dasharray:1400;stroke-dashoffset:1400}
#rainbow.show path{animation:draw 2s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
#unicorn{display:none;z-index:13}
#unicorn.show{display:block}
#unicorn.trot .legs1{animation:trot .25s infinite alternate}
#unicorn.trot .legs2{animation:trot .25s infinite alternate-reverse}
@keyframes trot{to{transform:translateY(-8px)}}
.cheer{animation:cheer .5s ease-in-out 4 !important}
@keyframes cheer{50%{transform:translateY(-26px) rotate(-5deg)}}

/* ---------- FX layer ---------- */
#fx{position:absolute;inset:0;pointer-events:none;z-index:50}
.ghost{position:absolute;z-index:60;animation:none !important;transform:scale(1.1);filter:drop-shadow(0 14px 10px #0004);pointer-events:none;opacity:1 !important}
#tilly{position:absolute;width:140px;height:120px;display:none;z-index:70}
#tilly .wl{transform-origin:44px 56px;animation:flapL .18s infinite alternate}
#tilly .wr{transform-origin:96px 56px;animation:flapR .18s infinite alternate}
@keyframes flapL{to{transform:rotate(-34deg)}}
@keyframes flapR{to{transform:rotate(34deg)}}
#hand{position:absolute;width:96px;height:96px;font-size:84px;line-height:96px;text-align:center;display:none;z-index:80;filter:drop-shadow(0 6px 6px #0005)}
.spark{position:absolute;font-size:30px;line-height:1;color:#ffe066;text-shadow:0 0 8px #fff}
.confetti{position:absolute;width:14px;height:22px;border-radius:3px}
.flyheart{position:absolute;width:64px;height:60px;z-index:75}
.drop{position:absolute;width:18px;height:18px;border-radius:50%;background:#7cc8ff}
.balloon{position:absolute;left:50%;top:-118px;width:86px;height:124px;margin-left:-43px}

/* ---------- Start + Feast ---------- */
.overlay{position:absolute;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column}
#start{background:radial-gradient(circle at 50% 35%,#c2387d,#7b1f4b 50%,#3b0a2a);overflow:hidden}
#start .stars{position:absolute;inset:0;background-image:radial-gradient(#fff9 1.5px,transparent 2px);background-size:46px 46px;opacity:.35}
#start h1{position:relative;margin:0 0 10px;font-size:64px;color:#fff3c4;text-shadow:0 4px 0 #8a3a12,0 8px 20px #0007;letter-spacing:1px;text-align:center}
#start .hero{position:relative;width:420px;height:230px}
#start .hero .q{position:absolute;left:40px;top:10px;width:180px;height:210px;animation:floaty 3s ease-in-out infinite}
#start .hero .t{position:absolute;right:30px;top:30px;width:160px;height:138px;animation:floaty 2.4s ease-in-out infinite reverse}
@keyframes floaty{50%{transform:translateY(-10px)}}
#playBtn{position:relative;margin-top:24px;width:210px;height:210px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7c8,#f6c453 55%,#d48a10);box-shadow:0 10px 0 #9a5c06,0 18px 40px #0008;animation:pulse 1.6s ease-in-out infinite}
#playBtn:active{transform:translateY(8px);box-shadow:0 2px 0 #9a5c06}
#playBtn svg{width:46%;height:46%;margin:0 auto;transform:translateX(8%)}
@keyframes pulse{50%{transform:scale(1.07)}}
#feast{display:none;background:radial-gradient(ellipse at 50% 30%,#ffe7b0,#f7b46a 60%,#c4642c)}
#feast.show{display:flex;animation:fadeIn .8s}
@keyframes fadeIn{from{opacity:0}}
#feastScene{position:relative;width:1100px;height:640px;flex:none}
.portrait #feastScene{transform:scale(.72)}
#feastScene{margin-top:60px}
#bunting{position:absolute;left:0;right:0;top:0;height:90px}
.guest{position:absolute;z-index:1;bottom:250px;width:130px;height:140px;transform-origin:50% 100%}
.guest.bob{animation:guestBob .9s ease-in-out infinite}
@keyframes guestBob{50%{transform:translateY(-10px)}}
.cup{position:absolute;z-index:3;bottom:262px;width:46px;height:60px;transition:transform .25s}
#table{position:absolute;z-index:2;left:30px;width:1040px;bottom:0;height:270px}
.drape{position:absolute;top:0;width:150px;height:100%;z-index:0}
.drape.l{left:0}.drape.r{right:0;transform:scaleX(-1)}
.treat{position:absolute;z-index:4;font-size:76px;line-height:1}
#againBtn{position:absolute;right:30px;bottom:24px;width:120px;height:120px;border-radius:50%;display:none;background:radial-gradient(circle at 35% 30%,#fff,#bff0c8 55%,#3fb35c);box-shadow:0 8px 0 #1f7a37,0 14px 30px #0006;z-index:5}
#againBtn.show{display:block;animation:popIn .5s cubic-bezier(.3,1.6,.5,1)}
#againBtn svg{width:60%;height:60%;margin:auto}
.portrait #againBtn{right:40px;bottom:60px;width:140px;height:140px}
</style>
</head>
<body>
<div id="stage" class="landscape">

  <!-- ===== Desk ===== -->
  <div id="desk">
    <button id="earBtn" class="deskitem" aria-label="Hear again">
      <svg viewBox="0 0 100 100"><path d="M18 38h16l22-18v60L34 62H18z" fill="#8e1e5a"/><path class="wave" d="M66 36q10 14 0 28" stroke="#8e1e5a" stroke-width="7" fill="none" stroke-linecap="round"/><path class="wave" d="M76 26q20 24 0 48" stroke="#8e1e5a" stroke-width="7" fill="none" stroke-linecap="round"/></svg>
    </button>
    <div id="crown" class="deskitem">
      <svg viewBox="0 0 240 124">
        <path d="M20 104 L10 30 L64 70 L120 10 L176 70 L230 30 L220 104 Z" fill="#f6c453" stroke="#b77a0c" stroke-width="5" stroke-linejoin="round"/>
        <rect x="18" y="98" width="204" height="20" rx="8" fill="#e9a82a" stroke="#b77a0c" stroke-width="4"/>
        <circle cx="10" cy="28" r="9" fill="#fff3c4" stroke="#b77a0c" stroke-width="3"/><circle cx="120" cy="8" r="9" fill="#fff3c4" stroke="#b77a0c" stroke-width="3"/><circle cx="230" cy="28" r="9" fill="#fff3c4" stroke="#b77a0c" stroke-width="3"/>
        <g><circle cx="62" cy="80" r="15" fill="#6b3d12" stroke="#b77a0c" stroke-width="3"/><circle cx="120" cy="66" r="17" fill="#6b3d12" stroke="#b77a0c" stroke-width="3"/><circle cx="178" cy="80" r="15" fill="#6b3d12" stroke="#b77a0c" stroke-width="3"/></g>
        <g class="gem" data-i="0"><path d="M62 64 l14 10 -5 18 h-18 l-5 -18z" fill="#ff3d7f" stroke="#fff" stroke-width="2"/><path d="M56 72 l6 -4 4 5z" fill="#fff" opacity=".8"/></g>
        <g class="gem" data-i="1"><path d="M120 48 l16 12 -6 20 h-20 l-6 -20z" fill="#38c172" stroke="#fff" stroke-width="2"/><path d="M113 58 l7 -5 4 6z" fill="#fff" opacity=".8"/></g>
        <g class="gem" data-i="2"><path d="M178 64 l14 10 -5 18 h-18 l-5 -18z" fill="#3b82f6" stroke="#fff" stroke-width="2"/><path d="M172 72 l6 -4 4 5z" fill="#fff" opacity=".8"/></g>
      </svg>
    </div>
    <div id="scrollArea" class="deskitem">
      <div id="rolled">
        <svg viewBox="0 0 230 120">
          <ellipse cx="115" cy="104" rx="100" ry="10" fill="#0003"/>
          <rect x="22" y="30" width="186" height="64" rx="32" fill="#fff1c9" stroke="#d6b064" stroke-width="4"/>
          <ellipse cx="22" cy="62" rx="16" ry="32" fill="#f3dc9e" stroke="#d6b064" stroke-width="4"/>

    const fail = () => {

    voiceEl.onended = () => { if (!settled && my === token){ settled = true; done(); } };

/* =========================================================
   Pointer helpers (pointer events + pointer capture)
   ========================================================= */
function onTap(node, fn){
  let p = null;
  node.addEventListener('pointerdown', e => { p = {x:e.clientX, y:e.clientY, id:e.pointerId}; });
  node.addEventListener('pointerup', e => { if (p && p.id === e.pointerId && Math.hypot(e.clientX-p.x, e.clientY-p.y) < 24*S) fn(e); p = null; });
  node.addEventListener('pointercancel', () => { p = null; });
}
function makeGhost(src){
  const r = srect(src);
  const g = src.cloneNode(true);
  g.removeAttribute('id'); g.classList.add('ghost');
  g.style.cssText = `position:absolute;left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px;margin:0`;
  g._src = src; g._x = r.x; g._y = r.y;
  fx.appendChild(g);
  src.style.opacity = '0';
  return g;
}
function moveGhost(g, x, y){ g._x = x; g._y = y; g.style.left = x+'px'; g.style.top = y+'px'; }
async function glide(node, x, y, dur=450, arc=0){
  const x0 = parseFloat(node.style.left)||0, y0 = parseFloat(node.style.top)||0;
  const dx = x - x0, dy = y - y0;
  const base = node.classList.contains('ghost') ? ' scale(1.1)' : '';
  const kf = arc ? [{transform:`translate(0,0)${base}`},{transform:`translate(${dx/2}px,${dy/2-arc}px)${base}`},{transform:`translate(${dx}px,${dy}px)${base}`}]
                 : [{transform:`translate(0,0)${base}`},{transform:`translate(${dx}px,${dy}px)${base}`}];
  const a = node.animate(kf, {duration: state.fast ? 20 : dur, easing:'ease-in-out', fill:'forwards'});
  await a.finished.catch(()=>{});
  node.style.left = x+'px'; node.style.top = y+'px'; node._x = x; node._y = y;
  a.cancel();
}
async function returnGhost(g){
  const r = srect(g._src);
  await glide(g, r.x, r.y, 380);
  g._src.style.opacity = ''; g.remove();
}
function draggable(node, o){
  let st = null;
  node.addEventListener('pointerdown', e => {
    if (st) return;
    st = {id:e.pointerId, x0:e.clientX, y0:e.clientY, drag:false, g:null};
    try { node.setPointerCapture(e.pointerId); } catch(_){}
  });
  node.addEventListener('pointermove', e => {
    if (!st || e.pointerId !== st.id) return;
    const dx = (e.clientX - st.x0)/S, dy = (e.clientY - st.y0)/S;
    if (!st.drag){
      if (Math.hypot(dx, dy) < 14) return;
      if (o.canDrag && !o.canDrag()){ if (o.onBlocked && !st.blocked){ st.blocked = true; o.onBlocked(); } return; }
      st.drag = true; st.g = makeGhost(node); st.gx = st.g._x; st.gy = st.g._y; sfx.pick();
    }
    moveGhost(st.g, st.gx + dx, st.gy + dy);
  });
  const end = e => {
    if (!st || e.pointerId !== st.id) return;
    const s = st; st = null;
    try { node.releasePointerCapture(e.pointerId); } catch(_){}
    if (s.drag){
      if (e.type === 'pointercancel') returnGhost(s.g);
      else o.onDrop(e.clientX, e.clientY, s.g);
    } else if (e.type === 'pointerup' && o.onTap) o.onTap(e);
  };
  node.addEventListener('pointerup', end);
  node.addEventListener('pointercancel', end);
}
stage.addEventListener('pointerdown', () => { lastAct = Date.now(); }, true);
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('touchmove', e => e.preventDefault(), {passive:false});

function sparkle(x, y, n=10, chars='✦✧★'){
  for (let i=0;i<n;i++){
    const s = el(`<div class="spark">${chars[i%chars.length]}</div>`);
    s.style.left = x+'px'; s.style.top = y+'px'; s.style.color = ['#ffe066','#ff8fc0','#a5f3fc','#fff'][i%4];
    fx.appendChild(s);
    const ang = rand(0, Math.PI*2), d = rand(40, 110);
    s.animate([{transform:'translate(-50%,-50%) scale(.4)',opacity:1},{transform:`translate(${Math.cos(ang)*d-15}px,${Math.sin(ang)*d-15}px) scale(1.2) rotate(${rand(-90,90)}deg)`,opacity:0}],{duration:rand(600,1000),easing:'ease-out'}).finished.then(()=>s.remove());
  }
}
function confetti(n=60){
  const cols = ['#ff4f8b','#ffd84d','#5fd38d','#6fb7ff','#b28dff','#ff9f43','#fff'];
  for (let i=0;i<n;i++){
    const c = el('<div class="confetti"></div>');
    c.style.background = cols[i%cols.length]; c.style.left = rand(0, W)+'px'; c.style.top = '-30px';
    fx.appendChild(c);
    c.animate([{transform:`translate(0,0) rotate(0)`},{transform:`translate(${rand(-120,120)}px,${H+60}px) rotate(${rand(360,1080)}deg)`}],{duration:rand(1800,3200),delay:rand(0,700),easing:'cubic-bezier(.3,.6,.6,1)'}).finished.then(()=>c.remove());
  }
}
function drops(x, y){
  for (let i=0;i<14;i++){
    const d = el('<div class="drop"></div>'); d.style.left = x+'px'; d.style.top = y+'px'; fx.appendChild(d);
    const dx = rand(-110,110), up = rand(60,160);
    d.animate([{transform:'translate(0,0)'},{transform:`translate(${dx/2}px,${-up}px)`},{transform:`translate(${dx}px,20px)`,opacity:0}],{duration:800,easing:'ease-out'}).finished.then(()=>d.remove());
  }
}
const hand = $('#hand');
async function showHand(kind, a, b){
  const ra = srect(a);
  hand.style.display = 'block';
  const hx = ra.cx - 30, hy = ra.cy - 10;
  hand.style.left = hx+'px'; hand.style.top = hy+'px';
  let kf;
  if (kind === 'tap') kf = [{transform:'translate(0,30px) scale(1)'},{transform:'translate(0,0) scale(.85)',offset:.4},{transform:'translate(0,30px) scale(1)'}];
  else if (kind === 'slide') kf = [{transform:`translate(${-ra.w/2+20}px,20px)`,opacity:0},{transform:`translate(${-ra.w/2+20}px,20px)`,opacity:1,offset:.15},{transform:`translate(${ra.w/2-10}px,20px)`,opacity:1,offset:.85},{transform:`translate(${ra.w/2-10}px,20px)`,opacity:0}];
  else if (kind === 'swipe') kf = [{transform:'translate(-60px,20px)',opacity:0},{transform:'translate(-60px,20px)',opacity:1,offset:.15},{transform:'translate(70px,20px)',opacity:1,offset:.8},{transform:'translate(70px,20px)',opacity:0}];
  else if (kind === 'drag'){
    const rb = b ? srect(b) : {cx: ra.cx + 80, cy: ra.cy - 30};
    const dx = rb.cx - ra.cx, dy = rb.cy - ra.cy;
    kf = [{transform:'translate(0,0) scale(1)',opacity:0},{transform:'translate(0,0) scale(.85)',opacity:1,offset:.15},{transform:`translate(${dx}px,${dy}px) scale(.85)`,opacity:1,offset:.8},{transform:`translate(${dx}px,${dy}px)`,opacity:0}];
  }
  const a1 = hand.animate(kf, {duration: kind==='tap' ? 700 : 1500, iterations: kind==='tap' ? 3 : 2, easing:'ease-in-out'});
  await a1.finished.catch(()=>{});

}
async function flyHeart(fromEl){

/* =========================================================
   Letters
   ========================================================= */
const T = w => ({w, tricky:true, id:'word-'+w.toLowerCase()});
const D = (w, spec, extra={}) => Object.assign({w, id:'word-'+w.toLowerCase(), g: spec.split(' ').map(p => { const [t,s] = p.split(':'); return {t, s:'sound-'+s}; })}, extra);
/* Each round picks what the pig and the hen want, so world knowledge
   ("pigs like mud") or a remembered position cannot replace reading.
   ?pig=mud|pond and ?hen=hat|cap|sock fix the choice for testing. */
const QS = new URLSearchParams(location.search);
const pickGoal = (key, opts) => opts.includes(QS.get(key)) ? QS.get(key) : opts[Math.floor(Math.random()*opts.length)];
const PIG_GOAL = pickGoal('pig', ['mud','pond']);
const HEN_GOAL = pickGoal('hen', ['hat','cap','sock']);
const SPELL = {mud:'m:m u:u d:d', pond:'p:p o:o n:n d:d', hat:'h:h a:a t:t', cap:'c:k a:a p:p', sock:'s:s o:o ck:k'};
const LETTERS = [
  {from:'pig', full:'letter1-full-'+PIG_GOAL, help:'letter1-help', intro:'letter1-intro', tokens:[D('Can','C:k a:a n:n'), T('the'), D('pig','p:p i:i g:g'), T('go'), D('in','i:i n:n'), T('the'), D(PIG_GOAL, SPELL[PIG_GOAL],{punct:'?', key:true})]},
  {from:'fox', full:'letter2-full', intro:'letter2-intro', tokens:[D('Send','S:s e:e n:n d:d'), {w:'6', num:true, id:'word-six', key:true}, D('apples','a:a pp:p le:le s:z'), T('to'), T('the'), D('fox','f:f o:o x:ks',{punct:'.'})]},
  {from:'hen', full:'letter3-full-'+HEN_GOAL, help:'letter3-help', intro:'letter3-intro', tokens:[T('The'), D('hen','h:h e:e n:n'), D('is','i:i s:z'), D('sad','s:s a:a d:d',{punct:'.'}), T('I'), T('want'), T('a'), D('red','r:r e:e d:d',{key:true}), D(HEN_GOAL, SPELL[HEN_GOAL],{punct:'.', key:true})]}
];
/* A key word decides the action. Until Emma has acted on it (or has had two
   tries), sliding along it gives the sounds only: she blends the word herself. */
const hideKey = tk => tk.key && tk.g && !state.solved && state.mistakes < 2;

function renderLetter(L){
  $('#seal').innerHTML = ART[L.from]();
  const box = $('#words'); box.innerHTML = '';
  L.tokens.forEach((tk, i) => {
    let inner = '';
    if (tk.g) inner = tk.g.map((g, j) => `<span class="g" data-j="${j}">${g.t}<span class="dot${g.t.length>1?' dash':''}"></span></span>`).join('');
    else inner = `<span class="g">${tk.w}</span>`;
    if (tk.punct) inner += `<span class="p">${tk.punct}</span>`;
    const w = el(`<div class="word${tk.tricky?' tricky':''}${tk.num?' num':''}" data-i="${i}">${inner}</div>`);
    w._tk = tk;
    box.appendChild(w);
    if (tk.g) bindDecodable(w, tk); else bindWhole(w, tk);
  });
}
function markRead(w, tk){
  if (!w.classList.contains('read')){
    w.classList.add('read');
    if (tk.g && !state.blended.includes(tk.id)) state.blended.push(tk.id);
    if (!tk.g && !state.tapped.includes(tk.id)) state.tapped.push(tk.id);
  }
  retrigger(w, 'pop');
  const r = srect(w); sparkle(r.cx, r.cy, 6);
  if (tk.key && state.lock.includes(tk.id)){
    state.lock = state.lock.filter(id => id !== tk.id);
    if (!state.lock.length && state.phase === 'letter'){
      const actor = state.letter === 0 ? $('#pig') : $('#hen');
      const a = srect(actor); sparkle(a.cx, a.cy, 10); retrigger(actor, 'bounce'); sfx.chime();
      setTimeout(() => { if (state.phase === 'letter' && !state.busy && !state.lock.length) instruct(['try-again']); }, 700);
    }
  }
  maybePromptAct();
}
function bindWhole(w, tk){
  onTap(w, () => {
    if (state.phase !== 'letter' || state.busy) return;
    w.classList.add('say'); say(tk.id).then(() => w.classList.remove('say'));
    markRead(w, tk);
  });
}
function bindDecodable(w, tk){
  const gs = () => [...w.querySelectorAll('.g')];
  let st = null;
  const gAt = x => {
    const list = gs();
    for (let j=0;j<list.length;j++){ const r = list[j].getBoundingClientRect(); if (x >= r.left - 4*S && x <= r.right + 4*S) return j; }
    const last = list[list.length-1].getBoundingClientRect();
    if (x > last.right) return list.length - 1;
    return -1;
  };
  const light = j => { gs().forEach((g,k) => g.classList.toggle('on', k === j)); };
  const sound = j => { light(j); sfx.dot(); say(tk.g[j].s); };
  const finish = async () => {
    await wait(260);
    if (hideKey(tk)){
      gs().forEach(g => g.classList.add('on')); sfx.sparkle();
      await wait(700);
      gs().forEach(g => g.classList.remove('on'));
      markRead(w, tk);
      return;
    }
    gs().forEach(g => g.classList.add('on'));
    w.classList.add('say');
    await say(tk.id);
    gs().forEach(g => g.classList.remove('on'));
    w.classList.remove('say');
    markRead(w, tk);
  };
  w.addEventListener('pointerdown', e => {
    if (state.phase !== 'letter' || state.busy) return;
    try { w.setPointerCapture(e.pointerId); } catch(_){}
    const first = !w.classList.contains('dotted');
    w.classList.add('dotted');
    st = {id:e.pointerId, last:-1, next:0, moved:false, x0:e.clientX, done:false, first};
    if (first){ sfx.pop(); return; }
    const j = gAt(e.clientX);
    if (j >= 0){ st.last = j; sound(j); if (j === 0) st.next = 1; }
  });
  w.addEventListener('pointermove', e => {
    if (!st || st.id !== e.pointerId || st.done) return;
    if (Math.abs(e.clientX - st.x0) > 8*S) st.moved = true;
    const j = gAt(e.clientX);
    if (j < 0 || j === st.last) return;
    st.last = j; sound(j);
    if (j === st.next) st.next++;
    if (st.next >= tk.g.length){ st.done = true; finish(); }
  });
  const up = e => {
    if (!st || st.id !== e.pointerId) return;
    const s = st; st = null;
    if (s.done) return;
    if (!s.moved && !s.first){
      w._taps = (w._taps||0) + 1;
      if (w._taps >= 2 && e.type === 'pointerup'){ w._taps = 0; demoBlend(w, tk); return; }
      if (w._taps === 1 && !state.slideTaught){ state.slideTaught = true; showHand('slide', w); }
    } else if (s.moved) w._taps = 0;
    setTimeout(() => { if (!st) light(-1); }, 500);
  };
  w.addEventListener('pointerup', up);
  w.addEventListener('pointercancel', up);
  w._demo = () => demoBlend(w, tk);
}
async function demoBlend(w, tk){
  w.classList.add('dotted');
  const gs = [...w.querySelectorAll('.g')];
  for (let j=0;j<gs.length;j++){
    gs.forEach((g,k) => g.classList.toggle('on', k===j)); sfx.dot();
    if (await say(tk.g[j].s) === 'cut') { gs.forEach(g => g.classList.remove('on')); return 'cut'; }
    await wait(120);
  }
  if (hideKey(tk)){ gs.forEach(g => g.classList.remove('on')); markRead(w, tk); return true; }
  gs.forEach(g => g.classList.add('on')); w.classList.add('say');
  if (await say(tk.id) === 'cut'){ gs.forEach(g => g.classList.remove('on')); w.classList.remove('say'); return 'cut'; }
  gs.forEach(g => g.classList.remove('on')); w.classList.remove('say');
  markRead(w, tk);
  return true;
}
function wordEls(){ return [...document.querySelectorAll('#words .word')]; }
function keyWords(){ return wordEls().filter(w => w._tk.key); }
/* full=false (help bell before the wish is granted): the key words stay
   silent and pulse, so the bell never reads the deciding word for her. */
async function readWholeLetter(full){
  const L = LETTERS[state.letter];
  const helpMode = !full && L.help && !state.solved;
  const ws = wordEls().filter(w => !(helpMode && w._tk.key));
  let alive = true;
  const p = say(helpMode ? L.help : L.full).then(() => { alive = false; });
  await wait(250);
  for (const w of ws){
    if (!alive) break;
    ws.forEach(x => x.classList.remove('say')); w.classList.add('say');
    await wait(w._tk.w.length > 3 ? 520 : 400);
  }
  await p;
  ws.forEach(x => x.classList.remove('say'));
  if (helpMode) pulseWords(keyWords());
}

/* Help bell: fills over ~10 seconds, only then it can be rung */
const bell = $('#bell'), ring = bell.querySelector('.ring');
let bellT0 = 0, bellAnnounced = false;
function bellReset(){ bellT0 = performance.now(); bell.classList.remove('ready'); }
function bellTick(){
  let p = 0;
  if (state.phase === 'letter'){ p = Math.max(0, Math.min(1, (performance.now() - bellT0) / (state.fast ? 300 : 10000))); }
  ring.setAttribute('stroke-dashoffset', (339.3 * (1 - p)).toFixed(1));
  if (p >= 1 && !bell.classList.contains('ready')){
    bell.classList.add('ready'); sfx.ding();
    if (!bellAnnounced && !speaking() && !state.busy){ bellAnnounced = true; instruct(['hint-bell']); }
  }
  requestAnimationFrame(bellTick);
}
onTap(bell, async () => {
  if (state.phase !== 'letter' || state.busy) return;
  if (!bell.classList.contains('ready')){ retrigger(bell, 'nope'); sfx.tick(); return; }
  bellAnnounced = true;
  bell.classList.remove('ready'); retrigger(bell, 'ringing'); sfx.ding();
  bellT0 = performance.now() + 1e9;
  state.bellUsed = (state.bellUsed||0) + 1;
  await wait(500);
  await readWholeLetter(false);
  bellReset();
  maybePromptAct(true);
});
onTap($('#earBtn'), () => { if (instr.length) sayAll(instr); else say('intro'); });

/* After she has read a little, tell her the map is where she acts */
function maybePromptAct(force){
  if (state.phase !== 'letter' || state.actPrompted) return;
  const n = state.blended.length + state.tapped.length;
  if (!force && n < 3) return;
  state.actPrompted = true;
  setTimeout(() => { if (state.phase === 'letter' && !state.busy) actPrompt(); }, 1800);
}
function actPrompt(){
  const i = state.letter;
  if (i === 0){ instruct(['letter1-act']); showHand('drag', $('#pig')); }
  if (i === 1){ if (!state.storeOpen){ instruct(['hint-store']); showHand('tap', $('#store')); } }
  if (i === 2){ if (!state.wardOpen){ instruct(['hint-wardrobe']); showHand('tap', $('#wardrobe')); } }
}

/* Idle hints after about 8 seconds */
setInterval(() => {
  if (state.phase !== 'letter' || state.busy || speaking() || state.fast) return;
  if (Date.now() - lastAct > 8000){ lastAct = Date.now(); giveHint(); }
}, 500);
function giveHint(){
  state.hintsGiven++;
  const i = state.letter, n = state.blended.length + state.tapped.length;
  const firstDec = wordEls().find(w => w._tk.g);
  if (n < 2){ instruct(['hint-read']); if (firstDec) showHand('slide', firstDec); return; }
  if (state.lock.length){ rereadPrompt(); return; }
  if (i === 0){ instruct(['letter1-act']); showHand('drag', $('#pig')); return; }
  if (i === 1){
    if (!state.storeOpen){ instruct(['hint-store']); showHand('tap', $('#store')); }
    else if (state.basket === 0){ instruct(['hint-apples']); const a = document.querySelector('#frame .apple:not(.ghosty)'); if (a) showHand('drag', a, $('#basket')); }
    else { instruct(['hint-send']); showHand('drag', $('#basket'), $('#map')); }
    return;
  }
  if (i === 2){
    if (!state.wardOpen){ instruct(['hint-wardrobe']); showHand('tap', $('#wardrobe')); }
    else { instruct(['hint-dress']); const it = document.querySelector('#wardPanel .item'); if (it) showHand('drag', it, $('#hen')); }
  }
}
function pulseWords(ws){ ws.forEach(w => { w.classList.add('dotted'); retrigger(w, 'pulse'); }); }
/* After a wrong move the animal waits until Emma has slid along the key
   word(s) again. Guessing again without reading does nothing. */
function rereadPrompt(){
  const locked = wordEls().filter(w => state.lock.includes(w._tk.id));
  pulseWords(locked.length ? locked : keyWords());
  if (!speaking()) instruct([state.letter === 0 ? 'hint-reread-last' : 'hint-reread-two']);
  if (locked[0]) showHand('slide', locked[0]);
}
async function afterMistake(hintId){
  state.lock = keyWords().filter(w => w._tk.g).map(w => w._tk.id);
  await wait(300);
  pulseWords(keyWords());
  const heard = await instruct([hintId]);
  if (heard && state.mistakes >= 2 && state.phase === 'letter' && !state.busy){
    await wait(500);
    for (const k of keyWords().filter(w => w._tk.g)){ if (state.phase !== 'letter' || state.busy || await k._demo() === 'cut') break; }
  }
}

/* ---------- Letter 1: the pig ---------- */
async function pigDrop(x, y, g){
  const pig = $('#pig');
  const zone = ['mud','pond','hay'].find(z => inRect($('#'+z), x, y, z === 'mud' ? 20 : 10));
  if (!zone){ await returnGhost(g); sfx.oink(); say('pig-where'); return; }
  state.busy = true;
  const zr = srect($('#'+zone));
  if (zone === PIG_GOAL){
    state.solved = true;
    const tx = zone === 'pond' ? zr.x + zr.w*0.32 : zr.cx; /* keep clear of the duck */
    await glide(g, tx - g.offsetWidth/2, zr.cy - g.offsetHeight/2 - 10, 300);
    const gr = g.getBoundingClientRect(), m = toMap(gr.left + gr.width/2, gr.top + gr.height/2);
    pig.style.left = (m.x - 70)+'px'; pig.style.top = (m.y - 65)+'px';
    pig.style.opacity = ''; g.remove();
    const r = srect(pig);
    if (zone === 'mud'){ sfx.blop(); retrigger(pig, 'roll'); pig.classList.add('muddy'); sparkle(r.cx, r.cy+30, 8, '●'); }
    else { sfx.splash(); drops(r.cx, r.cy + 30); }
    await wait(400); sfx.oink();
    await wait(1200);
    pig.classList.add('happy');
    await say('pig-happy-' + zone);
    await flyHeart(pig);
    await say('heart-farm');
    finishLetter();
    return;
  }
  state.mistakes++;
  const dy = zone === 'pond' ? 20 : zone === 'hay' ? -30 : 0;
  await glide(g, zr.cx - g.offsetWidth/2, zr.cy - g.offsetHeight/2 - 10 + dy, 300);
  if (zone === 'pond'){
    sfx.splash(); drops(zr.cx, zr.cy + 10);
    g.animate([{transform:'translateY(0) scale(1.1)'},{transform:'translateY(30px) scale(1.1)'}],{duration:300,fill:'forwards'});
  } else if (zone === 'hay'){ sfx.rustle(); retrigger($('#hay'), 'wiggle'); }
  else { sfx.blop(); sparkle(zr.cx, zr.cy, 6, '●'); }
  await say('pig-wrong-' + zone);
  await returnGhost(g); sfx.oink();
  state.busy = false;
  await afterMistake('hint-reread-last');
}

    const hat = k === 'hen' ? `<div style="position:absolute;left:52px;top:-38px;width:90px;height:68px">${HEN_ITEM.art()}</div>` : '';
    const size = k === 'queen' ? 'width:150px;height:180px;' : k === 'unicorn' ? 'width:170px;height:150px;' : '';
    const left = k === 'unicorn' ? x - 16 : k === 'queen' ? x - 8 : x;
    html += `<div class="guest bob" style="left:${left}px;animation-delay:${i*.13}s;${size}">${art}${hat}</div>`;
    html += `<div class="cup" data-i="${i}" style="left:${x + (i < 3 ? 104 : i > 3 ? -24 : 120)}px">${ART.goblet()}</div>`;
  });
  html += `<svg id="table" viewBox="0 0 1040 270" preserveAspectRatio="none">
    <rect x="20" y="170" width="26" height="100" fill="#7a4a24"/><rect x="994" y="170" width="26" height="100" fill="#7a4a24"/>
    <rect x="0" y="0" width="1040" height="34" rx="10" fill="#fff7ec" stroke="#e8d2b5" stroke-width="3"/>
    <path d="M0 30 H1040 V150 ${Array.from({length:26},()=>'q-20 26 -40 0').join(' ')} Z" fill="#fff"/>
    <path d="M0 44 H1040" stroke="#ff8fb8" stroke-width="10"/>
    <path d="M0 130 H1040" stroke="#f6c453" stroke-width="6" stroke-dasharray="4 14" stroke-linecap="round"/></svg>`;
  html += `<div class="treat" style="left:500px;bottom:248px">🎂</div><div class="treat" style="left:300px;bottom:256px;font-size:46px">🍎🍎</div><div class="treat" style="left:740px;bottom:256px;font-size:50px">🍰</div>`;
  sc.innerHTML = html;
  const drape = `<svg viewBox="0 0 150 820" preserveAspectRatio="none"><path d="M0 0 H150 Q120 300 140 520 Q60 560 20 820 H0Z" fill="#b0215f"/><path d="M30 0 Q60 300 40 560 M80 0 Q110 260 100 520" stroke="#8e1e5a" stroke-width="8" fill="none"/><path d="M0 0 H150 V40 H0Z" fill="#f6c453"/><circle cx="140" cy="520" r="14" fill="#f6c453"/></svg>`;
  document.querySelectorAll('#feast .drape').forEach(d => d.remove());
  $('#feast').insertAdjacentHTML('afterbegin', `<div class="drape l">${drape}</div><div class="drape r">${drape}</div>`);
  $('#feast').classList.add('show');
  sfx.fanfare();
}
async function clink(){
  const cups = [...document.querySelectorAll('#feastScene .cup')];
  cups.forEach((c, i) => { const dir = i < 3 ? 1 : (i > 3 ? -1 : 0); c.style.transform = `translate(${dir*24}px,-40px) rotate(${dir*20}deg)`; });
  await wait(260); sfx.clink();
  await wait(260);
  cups.forEach(c => { c.style.transform = ''; });
  await wait(300);
}
onTap($('#againBtn'), () => { location.reload(); });

/* =========================================================
   Start
   ========================================================= */
buildMap(); fillFrame(); buildWardrobe(); renderBasket(0);
state.jewels = loadJewels(); showJewels(state.jewels);
requestAnimationFrame(bellTick);
onTap($('#playBtn'), () => {
  if (state.phase !== 'start') return;
  unlockAudio(); pickVoice();
  state.phase = 'intro';
  $('#start').animate([{opacity:1},{opacity:0}],{duration:500,fill:'forwards'}).finished.then(() => { $('#start').style.display = 'none'; });
  runRound();
});

/* =========================================================
   Debug hook for testers: window.__game
   ========================================================= */
window.__game = {
  get state(){ return JSON.parse(JSON.stringify(state)); },
  goals: {pig: PIG_GOAL, hen: HEN_GOAL},
  lines: LINES,
  fast(on=true){ state.fast = on; },
  /* Open the current scroll if it is waiting to be opened */
  open(){ const r = $('#rolled')._open; if (r){ $('#rolled')._open = null; r(); return true; } return false; },
  /* Do the right action for the current letter */
  async solve(){
    if (state.phase !== 'letter' || state.busy) return false;
    if (state.letter === 0){ const pig = $('#pig'); const g = makeGhost(pig); const r = $('#mud').getBoundingClientRect(); await pigDrop(r.left + r.width/2, r.top + r.height/2, g); }
    else if (state.letter === 1){ if (!state.storeOpen) await openStore(); state.basket = 6; renderBasket(); frame.querySelectorAll('.apple').forEach((a,i) => { if (i < 6) a.remove(); }); const g = makeGhost(basket); await sendBasket(g); }
    else if (state.letter === 2){ if (!state.wardOpen) await openWardrobe(); const item = document.querySelector(`#wardPanel .item[data-id="${HEN_ITEM.id}"]`); const g = makeGhost(item); await tryOn(HEN_ITEM, item, g); }
    return true;
  },
  hint(){ giveHint(); }
};
</script>
