<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3b2a55">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<title>Pippa's Word Wand v2</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:none}
body{background:#3b2a55;font-family:"Andika",ui-rounded,system-ui,sans-serif;color:#3a2850}
svg{display:block}
svg.art{overflow:visible}
button{font:inherit;border:0;padding:0;background:none;color:inherit;touch-action:none;-webkit-user-select:none;user-select:none}
.hidden{display:none!important}

#stage{position:absolute;left:50%;top:50%;width:1180px;height:820px;margin:-410px 0 0 -590px;transform-origin:50% 50%;
  overflow:hidden;background:#fffaf0}
#turn{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:#3b2a55;z-index:999}
#turn svg{width:340px;height:340px}
@media (orientation:portrait){ #turn{display:flex} #stage{visibility:hidden} }

/* scene */
#scene{position:absolute;left:0;top:0;width:1180px;height:470px;overflow:hidden;z-index:1}
#bg,#actors{position:absolute;inset:0}
#bg svg{width:100%;height:100%}
#actors{z-index:3}
.act{position:absolute;transform-origin:50% 100%}
.act svg{width:100%;height:100%}
#pippa{position:absolute;left:24px;top:206px;width:160px;height:250px;z-index:5;transform-origin:50% 100%}
#bobbin{position:absolute;left:196px;top:332px;width:112px;height:122px;z-index:6;transform-origin:50% 100%;transition:transform .8s cubic-bezier(.3,1.5,.5,1)}
#bobbin.big{transform:scale(1.25)}
#bobbin .wear{position:absolute;left:30px;top:-18px;width:52px;height:52px}
#basket{position:absolute;left:182px;top:360px;width:150px;height:100px;z-index:5;transform-origin:50% 100%}
.bob-idle{animation:breathe 2.2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.04,.96)}}
.squish{animation:squish .5s ease!important}
@keyframes squish{0%{transform:scale(1)}30%{transform:scale(1.25,.75)}60%{transform:scale(.9,1.15) translateY(-20px)}100%{transform:scale(1)}}
.wobble{animation:wobble .5s ease 3}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.shiver{animation:shiver .18s linear infinite}
@keyframes shiver{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
.hopping{animation:hop .42s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0) scaleY(1)}40%{transform:translateY(-22px) scaleY(1.05)}85%{transform:translateY(0) scaleY(.9)}}
.blink{animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.wand-glow{animation:glowpulse 1.6s ease-in-out infinite;transform-origin:140px 62px}
@keyframes glowpulse{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.3);opacity:1}}
.cat-tail{animation:tail 2s ease-in-out infinite;transform-origin:28px 86px}
@keyframes tail{0%,100%{transform:rotate(0)}50%{transform:rotate(12deg)}}
.goat-head{transform-origin:70px 70px}
.munch .goat-head{animation:munch .32s ease-in-out 5}
@keyframes munch{0%,100%{transform:rotate(0)}50%{transform:rotate(-10deg)}}
.float{animation:float 2.4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

#bubble{position:absolute;width:150px;height:130px;z-index:9;transform-origin:30% 100%;transition:transform .45s cubic-bezier(.3,1.6,.5,1),opacity .3s;pointer-events:none}
#bubble.off{transform:scale(0);opacity:0}
#bubble .pic{position:absolute;left:33px;top:14px;width:84px;height:84px;animation:float 2.4s ease-in-out infinite}

/* top bar */
#replay,#bookBtn{position:absolute;top:14px;width:88px;height:88px;border-radius:50%;z-index:90;background:#fff;
  border:6px solid #f5c542;box-shadow:0 6px 0 #d49a1f,0 8px 18px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center}
#replay{left:16px;top:16px;z-index:120}#bookBtn{right:112px;top:16px}
#replay svg{width:54px;height:54px}#bookBtn svg{width:58px;height:58px}
#replay.talking .w1{animation:wave 1s infinite}#replay.talking .w2{animation:wave 1s .2s infinite}
#replay .w{opacity:.35}
@keyframes wave{0%,100%{opacity:.25}50%{opacity:1}}
.badge{position:absolute;right:-8px;top:-8px;min-width:38px;height:38px;border-radius:19px;background:#ff6f9c;color:#fff;font-size:24px;
  font-weight:700;line-height:38px;text-align:center;padding:0 8px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
#queue{position:absolute;left:330px;top:12px;width:520px;height:80px;z-index:75;display:flex;justify-content:center;gap:18px;pointer-events:none}
#queue.off{display:none}
.qp{position:relative;width:72px;height:72px;border-radius:50%;background:#fff;border:4px solid #e3d3f3;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.qp .qf{position:absolute;inset:0;border-radius:50%;overflow:hidden}
.qp.now{border-color:#f5c542;box-shadow:0 0 0 5px rgba(255,214,70,.5)}
.qp .qf svg{position:absolute;left:4px;top:4px;width:56px;height:56px}
.qp .tk svg{display:block;width:30px;height:30px}
.qp .tk{position:absolute;right:-2px;bottom:-2px;width:30px;height:30px;transform:scale(0);transition:transform .5s cubic-bezier(.3,1.8,.5,1)}
.qp.done .tk{transform:scale(1)}

/* panel, wand, gems */
#panel{position:absolute;left:0;top:466px;width:1180px;height:354px;z-index:10;
  background:radial-gradient(ellipse 900px 300px at 50% 0%,#fffaf0 0%,#f6e8cc 70%,#efd9b2 100%)}
#panel svg.edge{position:absolute;left:0;top:-6px;width:1180px;height:30px}
#wandArt{position:absolute;left:300px;top:596px;width:720px;height:160px;z-index:11;pointer-events:none;transform-origin:45% 50%;transition:opacity .4s}
#wandArt svg{overflow:visible}
#wandArt.off{opacity:0}
#wandArt.wiggle{animation:wiggle .6s ease}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-3deg)}40%{transform:rotate(3deg)}60%{transform:rotate(-2deg)}80%{transform:rotate(2deg)}}
.socket{transition:fill .3s}
.socket.lit{fill:#fff6b0}
.socket.ask{animation:sockpulse 1s ease-in-out infinite}
@keyframes sockpulse{0%,100%{fill:rgba(255,255,255,.8)}50%{fill:#ffe98a}}
.star-glow{animation:glowpulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
#wandArt.full .star-glow{animation:glowbig .9s ease-in-out infinite}
@keyframes glowbig{0%,100%{transform:scale(1.1);opacity:.8}50%{transform:scale(1.5);opacity:1}}
.numsock{display:none}
#wandArt.num .numsock{display:block}
#wandArt.num .socket:not(.numsock){display:none}
#wandArt.num .numsock.ask{animation:sockpulse 1s ease-in-out infinite}
#track{position:absolute;left:356px;top:748px;width:470px;height:68px;z-index:12;pointer-events:none;opacity:0;
  transform:scale(.6);transition:opacity .3s,transform .4s cubic-bezier(.3,1.6,.5,1)}
#track.show{opacity:1;transform:scale(1)}
#track .shim{animation:shim 1.4s linear infinite}
@keyframes shim{from{transform:translateX(-60px)}to{transform:translateX(420px)}}
#wandHit{position:absolute;left:300px;top:600px;width:720px;height:220px;z-index:13}
#gemLayer{position:absolute;inset:0;z-index:20;pointer-events:none}
.home-spot{position:absolute;width:104px;height:104px;opacity:.5;pointer-events:none}
.gem{position:absolute;left:0;top:0;width:104px;height:104px;pointer-events:auto;touch-action:none;
  transition:transform .5s cubic-bezier(.3,1.35,.5,1),opacity .3s;z-index:2;--glow:rgba(255,255,255,.6)}
.gem.dragging{transition:none;z-index:60}
.gem.gone{opacity:0;pointer-events:none}
.gem-in{position:absolute;inset:0;transition:transform .2s;filter:drop-shadow(0 6px 0 rgba(70,40,90,.22)) drop-shadow(0 0 7px var(--glow))}
.gem.dragging .gem-in{transform:scale(1.14) rotate(-4deg)}
.gem .cut,.gem .face{position:absolute;clip-path:polygon(29% 0,71% 0,100% 29%,100% 71%,71% 100%,29% 100%,0 71%,0 29%)}
.gem .cut{inset:0;background:linear-gradient(150deg,var(--light) 0%,var(--rim) 48%,var(--dark) 100%)}
.gem .face{inset:11px;background:radial-gradient(circle at 32% 26%,#fff 0%,var(--face) 72%)}
.gem .shine{position:absolute;left:21px;top:17px;width:26px;height:11px;border-radius:50%;background:rgba(255,255,255,.95);transform:rotate(-28deg)}
.gem .ltr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:66px;font-weight:700;
  color:var(--ink);line-height:1;padding-bottom:8px}
.gem.lit .gem-in{transform:scale(1.2);filter:drop-shadow(0 0 14px #fff6a0) drop-shadow(0 0 26px #ffcf2e)}
.gem.locked .gem-in{filter:drop-shadow(0 0 0 #000) drop-shadow(0 0 10px #ffcf2e)}
.gem.locked .cut{background:linear-gradient(150deg,#fff3b0 0%,#f5c542 48%,#c98d2b 100%)}
.gem.boing .gem-in{animation:boing .45s ease}
.gem.popin .gem-in{animation:popin .55s cubic-bezier(.3,1.7,.5,1) backwards}
.gem.no .gem-in{animation:wobble .4s ease 2}
@keyframes boing{0%{transform:scale(1)}35%{transform:scale(1.18,.86)}65%{transform:scale(.92,1.1)}100%{transform:scale(1)}}
@keyframes popin{0%{transform:scale(0) rotate(-30deg)}100%{transform:scale(1) rotate(0)}}
.ghost{opacity:.6;transition:none!important;z-index:54!important;pointer-events:none!important}
.stone{position:absolute;left:0;top:0;width:76px;height:76px;pointer-events:auto;touch-action:none;transition:transform .45s cubic-bezier(.3,1.35,.5,1),opacity .3s;z-index:2}
.stone .sb{position:absolute;inset:0;border-radius:44% 56% 50% 50%/52% 48% 54% 46%;background:radial-gradient(circle at 35% 30%,#ffffff 0%,#dfe7f2 45%,#a9b7cc 100%);
  box-shadow:0 5px 0 rgba(60,70,100,.3),inset 0 -4px 0 rgba(0,0,0,.08)}
.stone .nm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:700;color:#2f3f74;line-height:1;padding-bottom:4px}
.stone.dragging{transition:none;z-index:60}
.stone.in .sb{background:radial-gradient(circle at 35% 30%,#fffbe0 0%,#ffe27a 50%,#e2a92b 100%)}
.stone.gone{opacity:0;pointer-events:none}

/* note and readers */
#noteBox{position:absolute;left:250px;top:494px;width:680px;height:316px;z-index:14}
.paper{position:absolute;inset:0;border-radius:26px;background:linear-gradient(180deg,#fffdf4,#fbefcf);box-shadow:0 6px 0 #e3c98e,0 10px 26px rgba(0,0,0,.12);border:4px solid #ecd49a}
.reader{position:absolute;touch-action:none}
.reader .lt{position:absolute;top:0;text-align:center;font-weight:700;color:#3f2a6b;line-height:1;transition:color .2s,transform .2s}
.reader .lt.lit{color:#e2456b;transform:translateY(-6px)}
.reader .dt{position:absolute;display:flex;align-items:center;justify-content:center}
.reader .dt i{display:block;width:22px;height:22px;border-radius:50%;background:#8e5bc4;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.reader .dt b{display:block;width:70%;height:10px;border-radius:5px;background:#8e5bc4}
.reader .trk{position:absolute;left:0;border-radius:36px;background:linear-gradient(90deg,#ffd1e3,#ffe999,#bff2dc,#cfe2ff);border:4px solid #b48ad9}
.reader .trk:after{content:"";position:absolute;right:-26px;top:50%;margin-top:-22px;border-left:30px solid #b48ad9;border-top:22px solid transparent;border-bottom:22px solid transparent}
.reader.small .trk:after{right:-16px;margin-top:-14px;border-left-width:18px;border-top-width:14px;border-bottom-width:14px}
.reader.heart .lt{color:#8e5bc4}
.reader .hrt{position:absolute;width:30px;height:28px;left:50%;margin-left:-15px}
.reader.glow{filter:drop-shadow(0 0 12px #ffd84a)}
.reader.grey .lt{color:#b3a6c4}
.reader.grey .dt i{background:#cbbfe0}

/* effects */
#fx{position:absolute;inset:0;z-index:45;pointer-events:none}
.spark{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%)}
.puff{position:absolute;border-radius:50%;background:#ffc2e0}
.drop{position:absolute;width:16px;height:22px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#6cc6f5}
.magicword{position:absolute;left:0;top:0;width:1180px;text-align:center;pointer-events:none}
.magicword span{display:inline-block;padding:0 46px;height:128px;line-height:118px;font-size:96px;font-weight:700;color:#6a2bbf;letter-spacing:4px;
  background:radial-gradient(ellipse at 50% 30%,#fff 0%,#fff8e1 100%);border:7px solid #f5c542;border-radius:64px;
  box-shadow:0 0 0 8px rgba(255,236,150,.55),0 0 40px rgba(255,214,70,.8),0 8px 0 #d49a1f}
.fly{position:absolute;left:0;top:0;z-index:46;pointer-events:none}
.fly svg{width:100%;height:100%}
.dotmark{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:#ff6f9c;border:3px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.2);z-index:8;pointer-events:none}
.glowring{filter:drop-shadow(0 0 10px #ffd84a) drop-shadow(0 0 22px #ffb400)}
#hand{position:absolute;left:0;top:0;width:96px;height:96px;font-size:84px;line-height:96px;text-align:center;z-index:56;
  pointer-events:none;opacity:0;filter:drop-shadow(0 4px 4px rgba(0,0,0,.25))}
.confetti{position:absolute;top:-30px;width:14px;height:9px;border-radius:2px}

/* big round buttons */
#choices{position:absolute;left:0;top:470px;width:1180px;height:350px;z-index:30;display:flex;align-items:center;justify-content:center;gap:60px}
#choices:empty{display:none}
.bigbtn{width:150px;height:150px;border-radius:50%;background:#fff;border:8px solid #f5c542;box-shadow:0 8px 0 #d49a1f,0 10px 22px rgba(0,0,0,.15);
  display:flex;align-items:center;justify-content:center;position:relative;animation:pulse 1.6s ease-in-out infinite}
.bigbtn svg{width:96px;height:96px}
.bigbtn .emo{font-size:84px;line-height:1}
.bigbtn:active{transform:translateY(5px)}
.swatch svg{width:120px;height:130px}
.nametag{position:absolute;left:785px;top:150px;width:300px;margin-left:-150px;text-align:center;z-index:8;pointer-events:none}
.nametag span{display:inline-block;padding:0 40px;height:110px;line-height:100px;font-size:84px;font-weight:700;color:#6a2bbf;background:#fff;border:6px solid #f5c542;border-radius:56px;box-shadow:0 0 0 8px rgba(255,236,150,.55),0 6px 0 #d49a1f}

/* party */
#party{position:absolute;inset:0;z-index:40;overflow:hidden}
#party .bgp{position:absolute;inset:0}
#party .bgp svg{width:100%;height:100%}
#pnote{position:absolute;left:20px;top:104px;width:1140px;height:214px}
#pnote .paper{border-radius:30px}
#pnote .reader{background:rgba(201,167,255,.16);border-radius:22px}
#pnote .reader.heart{background:rgba(255,111,156,.08)}
#queen{position:absolute;left:984px;top:360px;width:170px;height:255px;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite}
#queen.bow{animation:bow 1.4s ease}
@keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
@keyframes bow{0%,100%{transform:rotate(0)}40%,60%{transform:rotate(-9deg) translateX(-10px)}}
.pet{position:absolute;width:140px;height:150px;transform-origin:50% 100%}
.pet .cush{position:absolute;left:0;bottom:0;width:140px;height:46px;border-radius:50%;background:radial-gradient(ellipse at 50% 30%,#ffd6ea,#f39bc4);box-shadow:0 4px 0 #d77aa6}
.pet .pa{position:absolute;left:14px;bottom:18px;width:112px;height:112px}
.pet .on{position:absolute;left:38px;top:-30px;width:64px;height:64px}
.pet.glowring .cush{background:radial-gradient(ellipse at 50% 30%,#fff6c4,#f5c542)}
#ptable{position:absolute;left:40px;top:640px;width:520px;height:132px}
.titem{position:absolute;width:108px;height:108px;touch-action:none;transition:transform .45s cubic-bezier(.3,1.35,.5,1)}
.titem svg{width:100%;height:100%}
.titem.dragging{transition:none;z-index:60}
.titem.sel{filter:drop-shadow(0 0 12px #ffd84a) drop-shadow(0 0 20px #ffb400)}
#ppippa{position:absolute;left:20px;top:356px;width:120px;height:188px}
#pbob{position:absolute;left:150px;top:452px;width:92px;height:100px}

/* night */
#night{position:absolute;inset:0;z-index:60;background:radial-gradient(ellipse at 50% 30%,#3d4a8f 0%,#1d2150 70%,#141638 100%);overflow:hidden}
#night .nb{position:absolute;inset:0}
#night .nb svg{width:100%;height:100%}
#sleepBob{position:absolute;left:470px;top:430px;width:240px;height:220px}
#sunBtn{position:absolute;left:900px;top:600px;width:150px;height:150px}
.zz{position:absolute;font-size:46px;font-weight:700;color:#cfd6ff}

/* sticker book */
#book{position:absolute;inset:0;z-index:110;background:rgba(60,30,90,.45);display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .35s}
#book.show{opacity:1;pointer-events:auto}
.bk{position:relative;width:1100px;height:720px;margin-top:40px;display:flex;border-radius:28px;background:#8e5bc4;padding:16px;
  box-shadow:0 14px 0 #6a3ba0,0 20px 50px rgba(0,0,0,.3);transform:scale(.8);transition:transform .45s cubic-bezier(.3,1.5,.5,1)}
#book.show .bk{transform:scale(1)}
.pg{flex:1;background:#fffaf0;position:relative;overflow:hidden}
.pg.l{border-radius:16px 4px 4px 16px;flex:0 0 330px;box-shadow:inset -18px 0 24px -16px rgba(0,0,0,.25)}
.pg.r{border-radius:4px 16px 16px 4px;box-shadow:inset 18px 0 24px -16px rgba(0,0,0,.25)}
#bkBob{position:absolute;left:95px;top:26px;width:140px;height:152px}
#bkName{position:absolute;left:0;top:180px;width:100%;text-align:center;font-size:50px;font-weight:700;color:#6a2bbf;height:60px}
#bkCrowns{position:absolute;left:20px;top:260px;width:290px;display:flex;align-items:center;justify-content:center;gap:10px}
#bkCrowns .bc{width:84px;height:84px}
#bkCrowns .cn{font-size:64px;font-weight:700;color:#d49a1f}
#bkRare{position:absolute;left:20px;top:380px;width:290px;display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.rare{width:88px;height:88px;border-radius:50%;background:#fff;border:3px dashed #e3d3f3;display:flex;align-items:center;justify-content:center}
.rare svg{width:76px;height:76px}
.rare.got{border:4px solid #fff;box-shadow:0 0 0 4px #c9a7ff,0 0 18px #c9a7ff}
.rare.locked svg{filter:grayscale(1) brightness(0);opacity:.12}
#stickers{position:absolute;left:18px;top:18px;right:18px;bottom:18px;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:206px;gap:12px}
.sticker{position:relative;border-radius:22px;background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.08);border:3px dashed #e3d3f3}
.sticker .pic{position:absolute;left:50%;top:8px;width:84px;height:84px;margin-left:-42px}
.sticker .lbl{position:absolute;left:0;top:104px;width:100%;text-align:center;font-size:44px;font-weight:700;color:#4b2f78;line-height:1}
.sticker.got{border:4px solid #fff;box-shadow:0 0 0 3px #c9b4e6,0 4px 0 rgba(0,0,0,.1)}
.sticker.shiny{box-shadow:0 0 0 5px #f5c542,0 0 18px rgba(255,200,40,.8),0 4px 0 rgba(0,0,0,.1);background:radial-gradient(circle at 30% 20%,#fffbe6,#fff)}
.sticker.locked .pic{filter:grayscale(1) brightness(0);opacity:.1}
.sticker.new{animation:newsticker 1s ease 3}
.sticker.say{animation:boing .5s ease}
@keyframes newsticker{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.1) rotate(-4deg)}}
.flysticker{position:absolute;left:0;top:0;width:112px;height:112px;margin:-56px 0 0 -56px;padding:12px;border-radius:24px;background:#fff;z-index:47;pointer-events:none;
  box-shadow:0 0 0 4px #c9b4e6,0 8px 18px rgba(0,0,0,.2)}
.flysticker svg{width:100%;height:100%}
.flysticker.shiny{background:radial-gradient(circle at 30% 20%,#fffbe6,#fff);box-shadow:0 0 0 6px #f5c542,0 0 26px rgba(255,200,40,.95)}

let UID = 0; const uid = () => 'u' + (++UID);
function starPts(cx, cy, R, r, n = 5){
  const p = []; for (let i = 0; i < n*2; i++){ const a = -Math.PI/2 + i*Math.PI/n, d = i%2 ? r : R;
    p.push((cx + Math.cos(a)*d).toFixed(1) + ',' + (cy + Math.sin(a)*d).toFixed(1)); } return p.join(' ');
}
function octPts(cx, cy, size){ const h = size/2, k = size*0.21;
  return [[cx-h+k,cy-h],[cx+h-k,cy-h],[cx+h,cy-h+k],[cx+h,cy+h-k],[cx+h-k,cy+h],[cx-h+k,cy+h],[cx-h,cy+h-k],[cx-h,cy-h+k]].map(p=>p.join(',')).join(' ');
}

function buildRack(word, cfg){
  const tg = graphemes(word), maxL = Math.max(cfg.L, wordLevel(word));
  const taught = Object.keys(GLEVEL).filter(g => GLEVEL[g] <= maxL && g.length === 1 && g !== 'k');

  const blockSame = g => SAME.forEach(set => { if (set.includes(g)) set.forEach(x => { if (x !== g) bad.add(x); }); });

  if (cfg.dutch){
    tg.forEach(g => DUTCH.forEach(([a, b]) => { if (g === a) bad.add(b); if (g === b) bad.add(a); }));
    const last = tg[tg.length - 1]; if (last === 't') bad.add('d'); if (last === 'd') bad.add('t'); if (last === 'g') bad.add('c');

  /* b and d share a rack only from L3 (plan 2.5). */

  const add = g => { if (rack.length >= cfg.rack || rack.includes(g) || bad.has(g) || !taught.includes(g)) return; rack.push(g); blockSame(g); };

function chooseWord(cands, {L, avoid = [], preferMissed = false, preferTop = false}){

  const fit = pool.filter(w => wordLevel(w) <= L);
  const fresh = fit.filter(w => !used.includes(w));
  let list = fresh.length ? fresh : fit.length ? fit : pool.filter(w => !used.includes(w));
  if (!list.length) list = pool.length ? pool : cands;
  if (preferMissed){ const m = list.filter(w => G.save.missed.includes(w)); if (m.length) return pick(m); }
  if (preferTop){ const top = Math.max(...list.map(wordLevel)); return pick(list.filter(w => wordLevel(w) === top)); }

/* ===== Blend engine: the finger drives the pure sounds, one after the other, never overlapping ===== */
const GAP = 90;
class Blender {
  constructor(gs){ this.gs = gs; this.i = -1; this.chain = Promise.resolve(); this.h = null; this.dead = false; }
  to(i){ while (this.i < i && this.i < this.gs.length - 1){ const g = this.gs[++this.i]; this.chain = this.chain.then(() => this.play(g)); } }
  async play(g){
    this.stopHold(); if (this.dead || G.fast || G.muted) return;
    if (STRETCHY.has(g)){ this.h = A.hold(g); await sleep(260); } else await A.sound(g);
    await sleep(GAP);
  }
  stopHold(){ if (this.h){ try { this.h.stop(); } catch(e){} this.h = null; } }
  async end(){ await this.chain; this.stopHold(); }
  cancel(){ this.dead = true; this.stopHold(); }
}
async function stretched(gs){
  for (const g of gs){
    if (G.fast) continue;
    if (STRETCHY.has(g)){ const h = A.hold(g); await sleep(600); h.stop(); } else await A.sound(g);
    await sleep(60);
  }
}

function makeReader(word, o = {}){
  const size = o.size || 120, gs = o.heart ? [word] : graphemes(word), cw = o.heart ? size*.56*word.length + 12 : Math.max(o.minCell || 0, size*.72), dh = o.dotH || 72, th = o.trackH || 72;
  const el = document.createElement('div'); el.className = 'reader' + (o.cls ? ' ' + o.cls : '');
  const W = cw*gs.length; el.style.width = W + 'px'; el.style.height = (size + dh + th + 10) + 'px';
  if (o.x != null){ el.style.left = o.x + 'px'; el.style.top = o.y + 'px'; }
  let html = '';
  gs.forEach((g, i) => {
    html += `<div class="lt" data-i="${i}" style="left:${i*cw}px;width:${cw}px;font-size:${size}px;height:${size*1.1}px">${o.capital && i === 0 ? cap1(g) : g}</div>`;
    if (!o.heart) html += `<div class="dt" data-i="${i}" style="left:${i*cw}px;top:${size*1.05}px;width:${cw}px;height:${dh}px">${g.length > 1 ? '<b></b>' : '<i></i>'}</div>`;
  });
  if (o.heart) html += `<div class="hrt" style="top:${size*1.15}px">${HEART_SVG}</div>`;
  else html += `<div class="trk" style="top:${size*1.05 + dh}px;width:${W - (o.small ? 10 : 20)}px;height:${th}px"></div>`;
  el.innerHTML = html;
  const R = {el, word, gs, cw, slid:false, tapped:false, onUse:o.onUse || null};
  if (!o.heart && !o.noInput){
    el.addEventListener('pointerdown', e => {
      if (!o.active || !o.active()) return;
      e.preventDefault(); e.stopPropagation(); touched();
      const dt = e.target.closest('.dt');
      if (dt){ const i = +dt.dataset.i; R.tapped = true; litLetter(R, i); sound(gs[i]); if (R.onUse) R.onUse(); return; }
      try { el.setPointerCapture(e.pointerId); } catch(_){}
      const left = rectOf(el).x;
      const bl = new Blender(gs); let max = -1;
      const move = ev => { const x = toStage(ev).x - left; const i = Math.min(gs.length - 1, Math.floor((x - 6)/cw)); if (i > max){ for (let k = max + 1; k <= i; k++) litLetter(R, k); max = i; bl.to(i); } };

      el.addEventListener('pointermove', move); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
      move(e);
    });
  }
  return R;

$('#gemLayer').addEventListener('pointerdown', e => {
  if (gesture) return;
  const ge = e.target.closest('.gem, .stone'); if (!ge) return;
  e.preventDefault(); touched();
  const p = toStage(e);
  if (ge.classList.contains('stone')){
    if (G.mode !== 'stones') return;

    try { ge.setPointerCapture(e.pointerId); } catch(_){}
    gesture = {type:'stone', st, id:e.pointerId, sx:p.x, sy:p.y, ox:p.x - st.x, oy:p.y - st.y, mode:'pending'};
    return;
  }
  const g = G.gems.find(x => x.el === ge); if (!g) return;
  if (G.mode === 'wheel'){ try { ge.setPointerCapture(e.pointerId); } catch(_){} gesture = {type:'wheel', g, id:e.pointerId, sx:p.x, sy:p.y, mode:'pending'}; return; }
  if (G.mode !== 'wish' || g.locked) return;
  try { ge.setPointerCapture(e.pointerId); } catch(_){}

  if (gesture || !['wish','wheel','stones'].includes(G.mode)) return;

  try { e.target.setPointerCapture(e.pointerId); } catch(_){}

addEventListener('pointermove', e => {
  if (!gesture || e.pointerId !== gesture.id) return;
  const p = toStage(e), dx = p.x - gesture.sx, dy = p.y - gesture.sy;
  if (gesture.mode === 'pending' && Math.hypot(dx, dy) > 16){
    const onWand = gesture.type === 'wand' || gesture.type === 'wheel' || (gesture.type === 'gem' && gesture.g.slot >= 0);
    if (canSlide() && onWand && Math.abs(dx) > Math.abs(dy)){ gesture.mode = 'slide'; startSlide(); }
    else if (gesture.type === 'gem'){ gesture.mode = 'drag'; const g = gesture.g; if (g.slot >= 0){ G.slots[g.slot] = null; g.slot = -1; updateWand(); } g.el.classList.add('dragging'); }
    else if (gesture.type === 'stone'){ gesture.mode = 'drag'; const st = gesture.st; if (st.in){ st.in = false; st.el.classList.remove('in'); G.stoneIn = null; updateWand(); } st.el.classList.add('dragging'); }
  }
  if (gesture.mode === 'drag'){ const o = gesture.g || gesture.st; setPos(o, {x:p.x - gesture.ox, y:p.y - gesture.oy}); }
  if (gesture.mode === 'slide') slideMove(p);

function endGesture(e){
  if (!gesture || e.pointerId !== gesture.id) return;
  const gs = gesture; gesture = null;
  if (gs.mode === 'drag'){ if (gs.g){ gs.g.el.classList.remove('dragging'); dropGem(gs.g); } else { gs.st.el.classList.remove('dragging'); dropStone(gs.st); } return; }
  if (gs.mode === 'slide'){ endSlide(); return; }
  if (gs.type === 'gem'){ const g = gs.g; if (g.slot >= 0){ sendHome(g); return; } g.el.classList.add('boing'); setTimeout(() => g.el.classList.remove('boing'), 460); sound(g.g); return; }
  if (gs.type === 'stone'){ if (gs.st.in) stoneHomeGo(gs.st); else placeStone(gs.st); return; }
  if (gs.type === 'wheel'){ wheelTap(gs.g); return; }

function startSlide(){
  A.stop(); clearIdle();
  slide = {next:0, done:false, spark:0, bl:G.mode === 'stones' ? null : new Blender(G.slots.map(g => g.g))};
}
function slideMove(p){
  if (!slide || slide.done) return;
  if (Math.abs(p.x - slide.spark) > 30){ slide.spark = p.x; sparkleBurst(p.x, Math.min(p.y, 800), 3); }
  if (slide.bl){
    const X = SLOT_X();
    while (slide.next < X.length && p.x >= X[slide.next] - 40){
      const i = slide.next++; document.getElementById('sock' + i).classList.add('lit'); G.slots[i].el.classList.add('lit'); slide.bl.to(i);
    }
    if (slide.next === X.length && p.x >= X[X.length - 1] + 50){ slide.done = true; finishSlide(); }
  } else if (p.x >= STAR.x - 60){ slide.done = true; finishSlide(); }
}
function endSlide(){
  if (!slide) return;

  if (slide.bl) slide.bl.cancel();

async function onCount(k){

    if (M.bag + k > 10){ const sp = await flyItem('nut', STAR, {x:252, y:318}, 50); M.placed.push(sp); }

function setupNote(){
  const R = G.R, L = READ[G.save.levels.read].L, s = G.save;
  const roundWords = [R.warm, R.wish, R.scrollWord].filter(Boolean).concat(PETS);
  const ok = w => s.met.includes(w) && SHELF[w] && !roundWords.some(x => x !== w && confusable(w, x)) && SHELF[w].filter(p => !clashes(p, roundWords.filter(x => x !== w))).length >= 2;
  let cands = Object.keys(SHELF).filter(ok);
  const fits = cands.filter(w => wordLevel(w) <= L);
  if (fits.length) cands = fits;
  /* Prefer a word from an earlier round, then any word that was not the last note, then the last note. */
  const notLast = cands.filter(w => w !== s.lastNote);
  const older = notLast.filter(w => ![R.warm, R.wish, R.scrollWord].includes(w));
  cands = older.length ? older : notLast.length ? notLast : cands;
  const word = cands.length ? pick(cands) : ['bun','nut','hat'].find(w => s.met.includes(w)) || roundWords.find(w => SHELF[w]) || 'bun';
  s.lastNote = word; persist(); R.note = word;
  const partners = shuffle(SHELF[word].filter(p => !clashes(p, roundWords.filter(x => x !== word))));
  R.shelf = partners.slice();
  return {word, partners, items:shuffle([word, ...partners.slice(0, 2)]), spare:partners.slice(2), misses:0, els:{}, reader:null};
}

}

/* ===== The Queen's tea party ===== */
function setupParty(){
  const R = G.R, s = G.save;
  let things = R.made.filter(w => DICT.has(w) && w !== 'mat');
  if (R.note && !things.includes(R.note)) things.push(R.note);
  const avoid = things.concat(R.shelf || []);
  const extra = shuffle(Object.keys(s.book).concat(['bun','cup','hat','nut'])).filter(w => !things.includes(w) && !avoid.some(t => confusable(t, w)));
  while (things.length < 3 && extra.length) things.push(extra.shift());
  things = things.slice(0, 4);
  const L = READ[s.levels.read].L;
  const readable = things.filter(w => wordLevel(w) <= L);
  const thing = pick(readable.length ? readable : things), animal = pick(PETS);
  return {things, thing, animal, misses:0, sel:null, readers:[], thingEls:{}, petEls:{}};
}

/* ===== Start ===== */
function refreshStart(){
  const s = G.save;
  $('#play .face').innerHTML = s.bobbin && s.bobbin.name ? `<div style="position:absolute;left:40px;top:34px;width:180px;height:195px">${svgBobbin(s.bobbin.colour, s.today.bedtime)}</div>` : svgPippa('26 18 108 108');
  $('#sBob').classList.toggle('hidden', !(s.bobbin && s.bobbin.name));

async function startPlay(){
  if (G.started) return; G.started = true;
  const s = G.save;
  $('#fade').classList.add('on');
  A.preloadSounds(['s','a','t','p','i','n','m','d','g','o','c','e','u','r','h','b','f','l']).catch(() => {});
  await sleep(D(450));
  $('#start').classList.add('hidden');
  G.flow++;
  if (s.today.bedtime){
    $('#fade').classList.remove('on'); clearScene(); showNight(true); G.mode = 'night'; G.goal = ['goal-newday'];
    run((async () => { await prep(['goal-newday']); await say('goal-newday'); const f = G.flow; await userWait(); guard(f); newDay(); $('#night').classList.add('hidden'); G.R = newRound(1); G.newDay = true; await runFrom('greet'); })());
    return;
  }
  G.R = newRound(Math.min(2, s.today.rounds + 1));
  const intro = !s.bobbin || !s.bobbin.name;
  run(runFrom(intro ? 'gift' : (G.R.n === 1 ? 'greet' : 'warmup')).then(() => {}));
  if (!intro && G.R.n !== 1) $('#fade').classList.remove('on');
}
$('#play').addEventListener('pointerdown', e => { e.preventDefault(); A.unlock(); sfx('chime'); startPlay(); });

document.addEventListener('gesturestart', e => e.preventDefault());

buildStatic();
G.goal = ['goal-play'];

/* ===== Test hooks for playwright: reach every step, every right and wrong path ===== */
function jump(step, opts = {}){
  if (!SESSION.includes(step) && step !== 'start') return 'unknown step: ' + step;
  G.flow++; if (G.pending){ const p = G.pending; G.pending = null; p.rej(CANCEL); }
  A.stop(); clearIdle(); G.idleFn = null; G.early = null; gesture = null; slide = null; pdrag = null;
  $('#book').classList.remove('show'); $('#night').classList.add('hidden'); $('#party').classList.add('hidden'); $('#fade').classList.remove('on');
  clearScene(); G.M = null; G.N = null; G.P = null; G.mode = 'busy';
  if (step === 'start'){ $('#start').classList.remove('hidden'); G.started = false; refreshStart(); G.goal = ['goal-play']; G.mode = 'off'; return 'ok'; }
  $('#start').classList.add('hidden'); G.started = true;
  const s = G.save;
  if (!['gift','colour','naming'].includes(step) && !(s.bobbin && s.bobbin.name)){ s.bobbin = {name:opts.name || 'bop', colour:opts.colour || 'mint'}; persist(); }
  const n = opts.round || (G.R ? G.R.n : 1);
  if (!G.R || opts.round || opts.visitor) G.R = newRound(n);
  if (opts.visitor){ G.R.visitor = opts.visitor; G.R.wish = chooseWord(opts.visitor === 'duck' ? DUCK_THINGS : GOAT_THINGS, {L:3, avoid:[G.R.warm]}); G.R.queue = ['bobbin', opts.visitor, 'sizzle', 'queen']; }
  if (opts.warm) G.R.warm = opts.warm;
  if (opts.wish) G.R.wish = opts.wish;
  if (step === 'party' || step === 'sizzle' || step === 'stickers'){ [G.R.warm, G.R.wish].forEach(w => { if (!G.R.made.includes(w)) G.R.made.push(w); if (!s.met.includes(w)) s.met.push(w); }); }
  if (step === 'stickers' && !G.R.stickers.length) G.R.stickers = [{word:G.R.warm, shiny:true}, {word:G.R.wish, shiny:false}];
  G.force = step;
  run(runFrom(step));
  return 'ok';
}
const waitMode = async (modes, ms = 8000) => { const t = Date.now(); while (!modes.includes(G.mode)){ if (Date.now() - t > ms) return false; await sleep(20); } return true; };
window.__game = {
  get state(){
    return {step:G.step, mode:G.mode, day:G.save.day, round:G.R ? G.R.n : 0, visitor:G.R ? G.R.visitor : null,
      word:G.W ? G.W.word : null, tries:G.W ? G.W.tries : 0, rack:G.gems.filter(g => !g.el.classList.contains('gone')).map(g => g.g), slots:G.slots.map(g => g ? g.g : null),
      maths:G.M ? {kind:G.M.kind, answer:G.M.answer, vis:G.M.vis, hide:G.M.hide, bag:G.M.bag, tries:G.M.tries, hint:G.M.hint} : null,
      note:G.N ? {word:G.N.word, shelf:G.N.items.slice(), misses:G.N.misses} : null,
      party:G.P ? {thing:G.P.thing, animal:G.P.animal, things:G.P.things.slice(), misses:G.P.misses} : null,
      goal:G.goal.slice(), said:G.said.slice(-12), levels:Object.assign({}, G.save.levels), streak:Object.assign({}, G.save.streak),
      round_words:G.R ? {warm:G.R.warm, wish:G.R.wish, scroll:G.R.scrollWord, note:G.R.note, made:G.R.made.slice()} : null,
      bobbin:G.save.bobbin, book:Object.assign({}, G.save.book), rare:G.save.rare, crowns:G.save.crowns, wordsMade:G.save.wordsMade, today:G.save.today,
      missing:(A.missing || []).slice()};
  },
  steps:SESSION.slice(),
  get answer(){
    if (G.mode === 'wish') return G.W.word; if (G.mode === 'stones') return G.M.answer; if (G.mode === 'note') return G.N.word;
    if (G.mode === 'party') return {thing:G.P.thing, animal:G.P.animal}; if (G.mode === 'wheel') return 'bop'; return null;
  },
  set fast(v){ G.fast = !!v; }, get fast(){ return G.fast; },
  mute(v = true){ G.muted = !!v; A.mute(!!v); return G.muted; },
  seed(n){ rnd = mulberry32(n); return 'ok'; },
  save(){ persist(); return JSON.parse(JSON.stringify(G.save)); },
  load(){ G.save = loadSave(); refreshStart(); updateBadge(); return 'ok'; },
  reset(){ try { localStorage.removeItem(SAVE_KEY); } catch(e){} G.save = defaultSave(); G.R = null; jump('start'); updateBadge(); return 'ok'; },
  setLevel(strand, n){ if (!(strand in MAXLV)) return 'strands: ' + Object.keys(MAXLV).join(', '); G.save.levels[strand] = Math.max(0, Math.min(MAXLV[strand], n)); persist(); return G.save.levels; },
  set(path, v){ const k = path.split('.'); let o = G.save; while (k.length > 1) o = o[k.shift()]; o[k[0]] = v; persist(); return 'ok'; },
  jump, play(){ startPlay(); return 'ok'; },
  /* Build a word on the wand (or a name on the naming wheel) and slide to the star. */
  async spell(word){
    if (!await waitMode(['wish','wheel'])) return 'not ready: ' + G.mode;
    const gs = graphemes(word);
    if (G.mode === 'wheel'){ gs.forEach((l, i) => { const g = G.slots[i]; g.g = l; g.el.querySelector('.ltr').textContent = l; }); }
    else {
      if (gs.length !== NSOCK) return 'word needs ' + NSOCK + ' sounds';
      G.slots.forEach(g => { if (g && !g.locked) sendHome(g, true); });
      const used = G.slots.filter(Boolean);
      for (let i = 0; i < gs.length; i++){
        if (G.slots[i] && G.slots[i].locked) continue;
        const g = G.gems.find(x => x.g === gs[i] && !used.includes(x) && !x.locked); if (!g) return 'no gem ' + gs[i];

    return 'ok';
  },
  async number(n){ if (!await waitMode(['stones'])) return 'not ready: ' + G.mode; const st = G.stones.find(x => x.n === n); if (!st) return 'no stone ' + n; placeStone(st); startSlide(); slideMove({x:STAR.x, y:780}); return 'ok'; },
  async give(w){ if (!await waitMode(['note'])) return 'not ready: ' + G.mode; if (!G.N.els[w]) return 'not on shelf: ' + w; G.mode = 'busy'; run(give(w)); return 'ok'; },
  async put(thing, animal){ if (!await waitMode(['party'])) return 'not ready: ' + G.mode; if (!G.P.thingEls[thing]) return 'not on table: ' + thing; G.mode = 'busy'; run(putOn(thing, animal)); return 'ok'; },
  async colour(c = 'pink'){ if (!await waitMode(['colour'])) return 'not ready: ' + G.mode; resolveUser(c); return 'ok'; },
  async like(v = true){ if (!await waitMode(['heart'])) return 'not ready: ' + G.mode; resolveUser(!!v); return 'ok'; },
  async scroll(v = true){ if (!await waitMode(['scroll'])) return 'not ready: ' + G.mode; resolveUser(!!v); return 'ok'; },
  async choose(v){ if (!await waitMode(['choice'])) return 'not ready: ' + G.mode; resolveUser(v === 'wand'); return 'ok'; },
  async closeBook(){ if (!await waitMode(['book'])) return 'not ready: ' + G.mode; closeBook(); return 'ok'; },
  async newDay(){ if (!await waitMode(['night'])) return 'not ready: ' + G.mode; resolveUser(true); return 'ok'; },
  waitFor(modes, ms){ return waitMode([].concat(modes), ms); },
};
