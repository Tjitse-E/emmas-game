<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Fluffle Nursery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#4a2b5f;
  --wood:#6b4632;
}
*{box-sizing:border-box}
html,body{
  margin:0;height:100%;overflow:hidden;background:#5a3a2a;
  overscroll-behavior:none;touch-action:none;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
  font-family:'Andika','Chalkboard SE','Comic Sans MS',sans-serif;
}
#stage{position:absolute;left:0;top:0;width:1180px;height:820px;transform-origin:0 0;overflow:hidden;touch-action:none;background:#e9b77d}
#stage *{touch-action:none}
.abs{position:absolute}
svg{display:block;overflow:visible}

/* ---------- room pieces ---------- */
#room{position:absolute;left:0;top:0;z-index:0}
#pantry{left:16px;top:108px;width:240px;height:396px;z-index:10}
#door{left:268px;top:214px;width:150px;height:296px;z-index:8}
#basketBack,#basketFront{left:262px;top:520px;width:166px;height:112px}
#basketBack{z-index:12}#basketFront{z-index:52;pointer-events:none}
#basketHit{left:250px;top:440px;width:190px;height:200px;z-index:53}
#toybox{left:858px;top:386px;width:150px;height:136px;z-index:20}
#toybox .lid{position:absolute;left:-6px;top:-30px;width:162px;height:46px;transform-origin:4% 90%;transition:transform .45s cubic-bezier(.3,1.6,.5,1),filter .3s}
#toybox.open .lid{transform:translate(-20px,-8px) rotate(-62deg);filter:brightness(.9)}
#toybox.jiggle{animation:jiggle .4s}
#tubBack,#tubFront{left:868px;top:566px;width:296px;height:236px}
#tubBack{z-index:30}#tubFront{z-index:56;pointer-events:none}
#bedBack,#bedFront{left:988px;top:322px;width:188px;height:236px;opacity:0;transform:scale(.2);transform-origin:50% 90%}
#bedBack{z-index:15}#bedFront{z-index:56;pointer-events:none}
.shown{opacity:1!important;transform:scale(1)!important;transition:transform .9s cubic-bezier(.3,1.5,.5,1),opacity .4s}

/* ---------- Pom ---------- */
#pom{position:absolute;left:0;top:0;width:220px;height:230px;transform-origin:110px 128px;z-index:50}
#pom.lifted{z-index:90}
#pomInner{width:100%;height:100%;transform-origin:50% 92%}
#pomInner svg{width:220px;height:230px}
.pomsvg .breathe{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 2.6s ease-in-out infinite}
.f1{fill:var(--fluff,#ffb8a0);transition:fill 1.6s,stroke 1.6s}
.f1s{stroke:var(--fluff,#ffb8a0);transition:stroke 1.6s}
.f2{fill:var(--fluff2,#f59a86);transition:fill 1.6s}
.f2s{stroke:var(--fluff2,#f59a86);transition:stroke 1.6s}
.f3{fill:var(--fluff3,#ffe3d6);transition:fill 1.6s}
.ein{fill:#ffd2de}
.pomsvg .eyesClosed,.pomsvg .mouthO,.pomsvg .hat,.pomsvg .spots,.pomsvg .puffcheeks{display:none}
.pom-closed .eyesOpen{display:none}.pom-closed .eyesClosed{display:inline}
.pom-mouth .mouthSmile{display:none}.pom-mouth .mouthO{display:inline}
.pom-hat .hat{display:inline}
.pom-spots .spots{display:inline}
.pom-spots .paws{display:none}
.pom-puff .puffcheeks{display:inline}
.pomsvg .spot .mini{opacity:0;transform-box:fill-box;transform-origin:50% 50%;transform:scale(.2);transition:transform .35s cubic-bezier(.3,1.8,.5,1),opacity .2s}
.pomsvg .spot.on .mini{opacity:1;transform:scale(1)}
.pom-curled .ear,.pom-curled .feet,.pom-curled .paws{display:none}
.ear{transform-box:fill-box}
.earL{transform-origin:88% 6%}
.earR{transform-origin:12% 6%}
.pom-happy .earL{animation:earL .5s ease-in-out 3}
.pom-happy .earR{animation:earR .5s ease-in-out 3}
.pom-dangle .earL{animation:earL .35s ease-in-out infinite}
.pom-dangle .earR{animation:earR .35s ease-in-out infinite}
.paws ellipse{transform-box:fill-box;transform-origin:50% 50%}
.pom-rub .pawL{animation:rubL .7s ease-in-out infinite}
.pom-rub .pawR{animation:rubR .7s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.975)}}
@keyframes earL{0%,100%{transform:rotate(0)}30%{transform:rotate(16deg)}70%{transform:rotate(-8deg)}}
@keyframes earR{0%,100%{transform:rotate(0)}30%{transform:rotate(-16deg)}70%{transform:rotate(8deg)}}
@keyframes rubL{0%,100%{transform:translate(0,0)}50%{transform:translate(26px,8px)}}
@keyframes rubR{0%,100%{transform:translate(0,0)}50%{transform:translate(-26px,8px)}}

.a-tickle{animation:tickle .7s ease}
.a-sniff{animation:sniff .7s ease}
.a-munch{animation:munch .9s ease}
.a-spin{animation:spin 1s ease}
.a-shake{animation:shakeNo .9s ease}
.a-shiver{animation:shiver 1s linear}
.a-dance{animation:dance 2.2s ease}
.a-wobble{animation:wobble .8s ease}
.a-hop{animation:hop .5s ease}
.a-squish{animation:squish .45s ease}
.a-puff{animation:puff 1.2s ease}
@keyframes tickle{0%{transform:scale(1)}20%{transform:scale(1.14,.86)}40%{transform:scale(.92,1.1) rotate(-6deg)}60%{transform:scale(1.06,.95) rotate(5deg)}80%{transform:rotate(-2deg)}100%{transform:scale(1)}}
@keyframes sniff{0%,100%{transform:none}20%{transform:translateX(-8px) rotate(-7deg)}40%{transform:translateX(-4px) rotate(-3deg)}60%{transform:translateX(-9px) rotate(-8deg)}80%{transform:translateX(-3px)}}
@keyframes munch{0%,100%{transform:none}15%,45%,75%{transform:scale(1.04,.93)}30%,60%,90%{transform:scale(.98,1.04)}}
@keyframes spin{0%{transform:translateY(0) rotateY(0)}40%{transform:translateY(-70px) rotateY(200deg)}80%{transform:translateY(0) rotateY(360deg)}90%{transform:scale(1.08,.92)}100%{transform:none}}
@keyframes shakeNo{0%,100%{transform:none}15%{transform:rotate(-12deg)}35%{transform:rotate(12deg)}55%{transform:rotate(-10deg)}75%{transform:rotate(8deg)}}
@keyframes shiver{0%,100%{transform:none}10%,30%,50%,70%,90%{transform:rotate(-9deg) scale(1.03)}20%,40%,60%,80%{transform:rotate(9deg) scale(1.03)}}
@keyframes dance{0%,100%{transform:none}12%{transform:translateY(-50px) rotate(-14deg)}25%{transform:translateY(0) rotate(0) scale(1.1,.9)}37%{transform:translateY(-50px) rotate(14deg)}50%{transform:translateY(0) scale(1.1,.9)}62%{transform:translateY(-70px) rotate(-360deg)}75%{transform:translateY(0) rotate(-360deg) scale(1.1,.9)}87%{transform:translateY(-30px) rotate(-360deg)}}
@keyframes wobble{0%,100%{transform:none}20%{transform:rotate(-12deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(5deg)}}
@keyframes hop{0%,100%{transform:none}50%{transform:translateY(-36px)}}
@keyframes squish{0%,100%{transform:none}40%{transform:scale(1.16,.84)}70%{transform:scale(.94,1.06)}}
@keyframes puff{0%,100%{transform:none}20%,80%{transform:scale(1.12,1.04)}}
@keyframes jiggle{0%,100%{transform:none}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}

/* ---------- items ---------- */
.src{position:absolute;width:108px;height:108px;margin:-54px 0 0 -54px;z-index:22}
.src svg,.item svg{width:100%;height:100%}
.src.toy{transform:scale(0);opacity:0;pointer-events:none;transition:transform .5s cubic-bezier(.3,1.7,.5,1),opacity .2s;z-index:26}
.src.toy.out{transform:scale(1);opacity:1;pointer-events:auto}
.src.away{opacity:0!important;pointer-events:none}
.src.wiggle{animation:wobble .5s}
.item{position:absolute;width:108px;height:108px;margin:-54px 0 0 -54px;z-index:80;pointer-events:none;filter:drop-shadow(0 10px 8px rgba(60,30,20,.3))}
.item.drag{transform:scale(1.15)}
.item.fly{transition:left .55s cubic-bezier(.4,1.4,.5,1),top .55s cubic-bezier(.4,1.4,.5,1),transform .4s}
.item.eat{transition:left .25s,top .25s,transform .3s ease-in,opacity .3s;transform:scale(.1);opacity:0}

/* ---------- bubble ---------- */
#bubble{position:absolute;top:84px;z-index:60;transform-origin:50% 120%;transform:scale(0);opacity:0;transition:transform .5s cubic-bezier(.3,1.5,.5,1),opacity .25s;pointer-events:none}
#bubble.on{transform:scale(1);opacity:1;pointer-events:auto}
.cloud{position:relative;background:#fffdf8;border-radius:80px;padding:12px 34px 22px;box-shadow:0 10px 0 rgba(120,70,120,.12),0 18px 40px rgba(80,40,60,.18)}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fffdf8;border-radius:50%;z-index:-1}
.cloud::before{width:150px;height:110px;left:40px;top:-34px}
.cloud::after{width:180px;height:120px;right:50px;top:-40px}
.bump{position:absolute;background:#fffdf8;border-radius:50%}
.tail{position:absolute;background:#fffdf8;border-radius:50%;box-shadow:0 6px 14px rgba(80,40,60,.15)}
.word{display:flex;align-items:flex-start;justify-content:flex-start;gap:2px;position:relative;padding:0 14px}
.col{width:106px;display:flex;flex-direction:column;align-items:center}
.letter{font-size:108px;line-height:118px;height:118px;color:var(--ink);font-weight:700;transition:transform .2s,color .2s}
.letter.lit{color:#e0457b;transform:translateY(-10px) scale(1.12)}
.num{color:#6c4bd6;font-size:118px;width:100px;text-align:center;border-radius:28px;background:#efe7ff}
.num.lit{color:#fff;background:#8f6bff}
.numgap{width:24px}
.dot{width:88px;height:88px;border-radius:50%;margin-top:4px;position:relative;box-shadow:inset 0 -7px 0 rgba(0,0,0,.15),0 4px 0 rgba(0,0,0,.08);transition:transform .15s}
.dot::after{content:"";position:absolute;left:20px;top:15px;width:26px;height:18px;border-radius:50%;background:rgba(255,255,255,.65)}
.dot.lit{transform:scale(1.22);box-shadow:0 0 0 10px rgba(255,220,120,.6),inset 0 -7px 0 rgba(0,0,0,.15)}
.dot.pulse{animation:dotpulse .55s ease-in-out 4}
.dotspacer{height:92px}
@keyframes dotpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25);box-shadow:0 0 0 12px rgba(255,200,90,.55)}}
.track{position:relative;height:102px;margin-top:10px}
.trackline{position:absolute;left:30px;right:40px;top:40px;height:20px;border-radius:10px;background:repeating-linear-gradient(90deg,#f1d9ff 0 26px,#e2c2fb 26px 40px)}
.arrowhead{position:absolute;right:0;top:24px;width:0;height:0;border-top:26px solid transparent;border-bottom:26px solid transparent;border-left:46px solid #c79af0}
.knob{position:absolute;left:0;top:4px;width:94px;height:94px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c9,#ffc93c 60%,#f0a400);box-shadow:0 6px 0 #c98400,0 10px 16px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center}
.knob svg{width:52px;height:52px}
.track.pulse .knob{animation:dotpulse .55s ease-in-out 3}
.word.burst .letter{animation:hop .45s ease}

/* ---------- HUD ---------- */
#speaker{left:18px;top:14px;width:96px;height:96px;border-radius:50%;background:#fff7ec;box-shadow:0 6px 0 #d9a868,0 10px 20px rgba(0,0,0,.2);z-index:97;display:flex;align-items:center;justify-content:center}
#speaker.talking{animation:talk .8s ease-in-out infinite}
@keyframes talk{0%,100%{box-shadow:0 6px 0 #d9a868,0 0 0 0 rgba(255,170,90,.6)}50%{box-shadow:0 6px 0 #d9a868,0 0 0 14px rgba(255,170,90,0)}}
#heart{left:1046px;top:10px;width:120px;height:106px;z-index:62}
#heart.pop{animation:squish .5s ease}
#heart .hfill{transition:transform .8s cubic-bezier(.3,1.4,.5,1)}
#heart.full{filter:drop-shadow(0 0 16px #ff8fb8)}

#hand{position:absolute;width:96px;height:96px;font-size:84px;line-height:96px;text-align:center;z-index:96;pointer-events:none;opacity:0;filter:drop-shadow(0 6px 6px rgba(0,0,0,.3));transition:opacity .3s}
#hand.on{opacity:1}
#hand.tap{animation:handtap .8s ease-in-out infinite}
@keyframes handtap{0%,100%{transform:translateY(0)}50%{transform:translateY(22px) scale(.92)}}

.soap{position:absolute;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;z-index:75;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.98) 0 11%,rgba(255,255,255,0) 12%),radial-gradient(circle at 50% 50%,rgba(200,235,255,.25) 0 50%,rgba(140,190,255,.55) 68%,rgba(255,150,220,.75) 86%,rgba(255,255,255,.95) 100%);
  border:3px solid rgba(255,255,255,.9);box-shadow:inset -10px -12px 20px rgba(180,120,255,.45),0 6px 16px rgba(120,80,160,.25);animation:floaty 2.4s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.soap span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:64px;line-height:1;color:#6c4bd6;font-weight:700;text-shadow:0 0 6px #fff,0 0 2px #fff;pointer-events:none}
.soap.next{box-shadow:inset -10px -12px 20px rgba(180,120,255,.45),0 0 0 10px rgba(255,214,102,.75),0 0 34px rgba(255,214,102,.9)}
.num.pulse{animation:dotpulse .55s ease-in-out 4}

#plate{left:230px;top:660px;width:220px;height:120px;z-index:55;opacity:0;transform:scale(.2);transform-origin:50% 80%;pointer-events:none;
  transition:left .45s cubic-bezier(.4,1.3,.5,1),top .45s cubic-bezier(.4,1.3,.5,1),transform .6s cubic-bezier(.3,1.5,.5,1),opacity .3s}
#plate.on{opacity:1;transform:none;pointer-events:auto}
#plate.lifted{transform:scale(1.08);filter:drop-shadow(0 14px 10px rgba(60,30,20,.3))}
#plate > svg{position:absolute;left:0;bottom:0;width:220px;height:70px;pointer-events:none}
.pbun{position:absolute;width:66px;height:66px;margin:-33px 0 0 -33px;pointer-events:none}
.pbun svg{width:100%;height:100%}

#fx{position:absolute;left:0;top:0;width:1180px;height:820px;pointer-events:none;z-index:88;overflow:visible}
.fx{position:absolute;pointer-events:none;font-weight:700;-webkit-text-stroke:0}
.fx.num{text-shadow:0 0 0 #fff,3px 3px 0 #fff,-3px -3px 0 #fff,3px -3px 0 #fff,-3px 3px 0 #fff}
#night{left:0;top:0;width:1180px;height:820px;background:radial-gradient(circle at 1080px 450px,rgba(40,30,90,.05),rgba(25,20,70,.68) 60%);opacity:0;transition:opacity 2s;z-index:58;pointer-events:none}
#night.on{opacity:1}
.twinkle{position:absolute;color:#fff6c2;font-size:30px;z-index:59;pointer-events:none;animation:tw 1.6s ease-in-out infinite;text-shadow:0 0 10px #fff3a0}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.1)}}
.zzz{position:absolute;font-size:44px;color:#fff;z-index:89;font-weight:700;pointer-events:none;text-shadow:0 2px 6px rgba(60,40,120,.6)}

/* ---------- overlays ---------- */
.overlay{position:absolute;left:0;top:0;width:1180px;height:820px;z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity .5s}
.overlay.hidden{opacity:0;pointer-events:none}
#start{background:radial-gradient(circle at 50% 45%,rgba(255,236,214,.55),rgba(90,50,70,.6));-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
.title{font-size:64px;color:#fff;text-shadow:0 4px 0 #c0577f,0 8px 20px rgba(0,0,0,.25);margin-bottom:18px;letter-spacing:1px}
.bigbtn{width:220px;height:220px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a6,#ffb52e 60%,#f08a00);box-shadow:0 12px 0 #c46a00,0 22px 40px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;animation:breathe2 1.6s ease-in-out infinite}
.bigbtn svg{width:100px;height:100px;pointer-events:none}
@keyframes breathe2{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
#end{background:radial-gradient(circle at 50% 40%,rgba(80,60,160,.82),rgba(25,18,60,.93))}
.endrow{display:flex;gap:26px;align-items:center;margin:10px 0}
.card{width:150px;height:150px;border-radius:36px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;position:relative}
.card.got{background:rgba(255,240,200,.95);box-shadow:0 0 0 6px #ffd76a,0 0 40px rgba(255,220,120,.6)}
.card.locked > *{filter:brightness(0);opacity:.35}
.card .tick{position:absolute;right:-10px;top:-10px;width:52px;height:52px;border-radius:50%;background:#5fcf7a;color:#fff;font-size:34px;line-height:52px;text-align:center;box-shadow:0 4px 0 #3a9a52}
.arrowR{font-size:54px;color:#ffe9a6}
.card .emo{font-size:80px}
#again{width:140px;height:140px;margin-top:22px}
#again svg{width:70px;height:70px}
#rotate{position:fixed;left:50%;top:6vh;width:140px;height:140px;margin-left:-70px;display:none;pointer-events:none;opacity:.85}
#rotate svg{width:100%;height:100%;animation:rot 2.6s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){#rotate{display:block}}
</style>
</head>
<body>
<div id="rotate"><svg viewBox="0 0 100 100"><rect x="28" y="12" width="44" height="76" rx="8" fill="#fff7ec" stroke="#f0a95a" stroke-width="5"/><circle cx="50" cy="80" r="3.5" fill="#f0a95a"/><path d="M84 40a34 34 0 0 0-14-24" stroke="#ffd166" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M64 10l8 6-9 4z" fill="#ffd166"/></svg></div>
<div id="stage">

  <!-- ===== Room background ===== -->
  <svg id="room" width="1180" height="820" viewBox="0 0 1180 820">
    <defs>
      <radialGradient id="wallG" cx="50%" cy="38%" r="70%">
        <stop offset="0" stop-color="#fbd29a"/><stop offset=".6" stop-color="#eeb676"/><stop offset="1" stop-color="#c98a52"/>
      </radialGradient>
      <linearGradient id="floorG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#c88552"/><stop offset="1" stop-color="#a5643c"/>
      </linearGradient>
      <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#8fd3ff"/><stop offset="1" stop-color="#d9f2ff"/>
      </linearGradient>
      <linearGradient id="nightG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#1d1850"/><stop offset="1" stop-color="#4a3a8a"/>
      </linearGradient>
      <clipPath id="winClip"><circle cx="560" cy="226" r="86"/></clipPath>
    </defs>
    <rect width="1180" height="820" fill="url(#wallG)"/>
    <!-- planks -->
    <g stroke="#d49a5e" stroke-width="3" opacity=".55">
      <path d="M80 0V520M170 0V520M260 0V520M350 0V520M440 0V520M530 0V520M620 0V520M710 0V520M800 0V520M890 0V520M980 0V520M1070 0V520"/>
    </g>
    <g fill="#c88a50" opacity=".35"><circle cx="126" cy="60" r="5"/><circle cx="398" cy="88" r="4"/><circle cx="752" cy="70" r="5"/><circle cx="1030" cy="98" r="4"/></g>
    <!-- curved ceiling beam -->
    <path d="M0 0H1180V40C900 10 280 10 0 40Z" fill="#8a5636"/>
    <path d="M0 40C280 10 900 10 1180 40V52C900 22 280 22 0 52Z" fill="#6f4229"/>
    <!-- window -->
    <circle cx="560" cy="226" r="104" fill="#8a5636"/>
    <circle cx="560" cy="226" r="92" fill="#6f4229"/>
    <g clip-path="url(#winClip)">
      <rect x="470" y="136" width="180" height="180" fill="url(#skyG)"/>
      <g id="nightSky" opacity="0" style="transition:opacity 2s">
        <rect x="470" y="136" width="180" height="180" fill="url(#nightG)"/>
        <circle cx="600" cy="186" r="22" fill="#fff6c9"/><circle cx="610" cy="180" r="20" fill="url(#nightG)"/>
        <g fill="#fff"><circle cx="512" cy="180" r="2.5"/><circle cx="540" cy="160" r="2"/><circle cx="530" cy="230" r="2.5"/><circle cx="590" cy="250" r="2"/><circle cx="620" cy="226" r="2.5"/></g>
      </g>
      <g id="daySky">
        <ellipse cx="520" cy="190" rx="34" ry="14" fill="#fff"/><ellipse cx="540" cy="182" rx="22" ry="14" fill="#fff"/>
        <path d="M470 316C500 268 540 262 560 276C590 250 630 262 650 300V316Z" fill="#7cc46a"/>
      </g>
      <path d="M470 150C520 170 520 200 500 230" stroke="#6a4a2a" stroke-width="10" fill="none"/>
      <g fill="#5fb85a"><ellipse cx="496" cy="166" rx="18" ry="10" transform="rotate(30 496 166)"/><ellipse cx="514" cy="196" rx="16" ry="9" transform="rotate(-20 514 196)"/><ellipse cx="490" cy="214" rx="14" ry="8"/></g>
    </g>
    <path d="M560 122V330M456 226H664" stroke="#8a5636" stroke-width="10"/>
    <circle cx="560" cy="226" r="92" fill="none" stroke="#a96b43" stroke-width="6"/>

<script>
'use strict';
/* =========================================================

   ========================================================= */
const LINES = {
  "intro-basket": "Look! Something is in the basket. Tap it!",
  "intro-pom": "It is a baby Fluffle! This is Pom. Pom cannot talk yet. Pom shows you what it wants in a bubble.",

  "word-bun": "bun",
  "word-hat": "hat",
  "word-tub": "tub",
  "word-buns": "buns",
  "num-1": "one",
  "num-2": "two",
  "num-3": "three",
  "num-4": "four",
  "num-5": "five",
  "num-6": "six",
  "sound-b": "[pure sound /b/ as in bun, short, no 'uh' after it]",
  "sound-u": "[pure sound /ʌ/ as in up]",
  "sound-n": "[pure sound /n/ as in nut, held: nnn]",
  "sound-h": "[pure sound /h/ as in hat, a breath with no 'uh']",
  "sound-a": "[pure sound /æ/ as in ant, not 'ah']",
  "sound-t": "[pure sound /t/ as in tub, whispered, no 'uh']",
  "sound-s": "[pure sound /s/ as in sun, held: sss]"

/* Placeholder only: browser voices cannot say pure sounds. These spellings get close. The real clips are generated or
   recorded from the descriptions in LINES and checked by ear (no 'uh' after b and t, short a as in ant). */
const TTS_PHONEME = { "sound-b":"buh", "sound-u":"uh", "sound-n":"nnn", "sound-h":"huh", "sound-a":"ah", "sound-t":"tuh", "sound-s":"sss" };

/* =========================================================
   Voice: say(id) tries audio/<id>.mp3, falls back to en-GB speechSynthesis
   ========================================================= */
const voiceEl = new Audio();
voiceEl.preload = 'auto';
const missingAudio = new Set();
let pending = null;          // {resolve, timer}
let chain = Promise.resolve();
let gen = 0;
let FAST = false;
let gbVoice = null;

function pickVoice(){
  if(!window.speechSynthesis) return;
  const vs = speechSynthesis.getVoices();
  const gb = vs.filter(v => /en[-_]GB/i.test(v.lang));
  gbVoice = gb.find(v => /Serena|Kate|Stephanie|Martha|Fiona|Libby|Sonia|Female/i.test(v.name)) || gb[0] || vs.find(v => /^en/i.test(v.lang)) || null;
}
if(window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

function stopVoice(){
  try{ voiceEl.pause(); }catch(e){}
  try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){}
  if(pending){ const p = pending; pending = null; clearTimeout(p.timer); p.resolve(); }
  setTalking(false);
}
function setTalking(on){ const s = document.getElementById('speaker'); if(s) s.classList.toggle('talking', !!on); }

function playLine(id){
  return new Promise(resolve => {
    const text = LINES[id];
    if(!text){ resolve(); return; }
    const me = { resolve: null, timer: null };
    let finished = false;
    const done = () => {
      if(finished) return; finished = true;
      clearTimeout(me.timer);
      if(pending === me){ pending = null; setTalking(false); }
      lastAct = Date.now();
      resolve();
    };
    me.resolve = done;
    pending = me; setTalking(true);
    G.lastLine = id;
    if(FAST){ me.timer = setTimeout(done, 40); return; }
    let fell = false;
    const tts = () => {
      if(fell || finished) return; fell = true;
      missingAudio.add(id);
      const say = TTS_PHONEME[id] || text;
      const est = 1600 + say.length * 95;
      clearTimeout(me.timer);
      me.timer = setTimeout(done, est);
      if(!window.speechSynthesis){ return; }
      try{
        const u = new SpeechSynthesisUtterance(say);
        u.lang = 'en-GB'; u.rate = 0.9; u.pitch = 1.1;
        if(gbVoice) u.voice = gbVoice;
        u.onend = done; u.onerror = done;
        speechSynthesis.speak(u);
      }catch(e){ done(); }
    };
    if(missingAudio.has(id)){ tts(); return; }
    me.timer = setTimeout(done, 15000);
    voiceEl.onended = () => { if(pending === me) done(); };
    voiceEl.onerror = () => { if(pending === me) tts(); };
    try{
      voiceEl.src = 'audio/' + id + '.mp3';
      const p = voiceEl.play();
      if(p && p.catch) p.catch(() => { if(pending === me) tts(); });
    }catch(e){ tts(); }
  });
}
/* say(id): interrupt whatever is speaking and say this line. */
function say(id){ gen++; stopVoice(); chain = playLine(id); return chain; }
/* sayNext(id): say this after the current speech, unless something interrupts. */
function sayNext(id){ const g = gen; chain = chain.then(() => g === gen ? playLine(id) : undefined); return chain; }

/* =========================================================
   Sound effects (WebAudio, generated)
   ========================================================= */
let AC = null;
function ac(){ if(!AC){ const C = window.AudioContext || window.webkitAudioContext; if(C) AC = new C(); } return AC; }
function tone(f, dur, o = {}){
  const c = ac(); if(!c) return;
  const t = c.currentTime + (o.delay || 0);
  const osc = c.createOscillator(), g = c.createGain();
  osc.type = o.type || 'sine';
  osc.frequency.setValueAtTime(f, t);
  if(o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur);
  const v = o.vol == null ? 0.18 : o.vol;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(v, t + Math.min(0.03, dur / 3));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(g); g.connect(c.destination);
  osc.start(t); osc.stop(t + dur + 0.05);
}
function noise(dur, o = {}){
  const c = ac(); if(!c) return;
  const t = c.currentTime + (o.delay || 0);
  const b = c.createBuffer(1, Math.max(1, c.sampleRate * dur | 0), c.sampleRate);
  const d = b.getChannelData(0); for(let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const s = c.createBufferSource(); s.buffer = b;
  const f = c.createBiquadFilter(); f.type = o.ft || 'lowpass'; f.frequency.value = o.freq || 1200;
  const g = c.createGain(); const v = o.vol || 0.15;
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
}
const SFX = {
  squeak(){ tone(900, .14, {to:1700, vol:.16}); tone(1500, .12, {to:2300, vol:.1, delay:.12}); },
  giggle(){ for(let i = 0; i < 5; i++) tone(1100 + Math.random()*500, .09, {to:1700 + i*120, vol:.12, delay:i*.1}); },

const DOT_COLS = ['#ff7aa8', '#ffb03b', '#4cc9b0', '#8f7bff'];
const KNOB = 94;   // knob size in px, keep in sync with .knob in CSS
const bubble = $('bubble'), wordEl = $('word'), track = $('track'), knob = $('knob');
let slide = { x: 0, max: 0, centres: [], next: 0, gen: 0, auto: false };

function buildBubble(need){
  wordEl.innerHTML = '';

    const c = document.createElement('div'); c.className = 'col';
    c.innerHTML = `<div class="letter num" data-act="num" data-n="${need.num}">${need.num}</div><div class="dotspacer"></div>`;
    wordEl.appendChild(c);
    const g = document.createElement('div'); g.className = 'numgap'; wordEl.appendChild(g);
  }

    const c = document.createElement('div'); c.className = 'col lettercol';
    c.innerHTML = `<div class="letter">${l}</div><div class="dot" data-act="dot" data-i="${i}" style="background:${DOT_COLS[i % 4]}"></div>`;
    wordEl.appendChild(c);

  const cols = [...wordEl.querySelectorAll('.lettercol')];
  const pad = parseFloat(getComputedStyle($('cloud')).paddingLeft);

  const left = first - 10, width = (last - first) + 40;

}
function showBubble(){ bubble.classList.add('on'); SFX.sparkle(); }
function hideBubble(){ bubble.classList.remove('on'); }
function letterEls(){ return [...wordEl.querySelectorAll('.lettercol')]; }
function lightLetter(i, on = true){
  const c = letterEls()[i]; if(!c) return;
  c.querySelector('.letter').classList.toggle('lit', on);
  c.querySelector('.dot').classList.toggle('lit', on);
}
function tapDot(i){
  const l = G.need.letters[i];
  lightLetter(i, true); setTimeout(() => lightLetter(i, false), 600);
  say('sound-' + l); log('dot:' + l);
}
function pulseDots(){
  wordEl.querySelectorAll('.num').forEach(d => { d.classList.remove('pulse'); void d.offsetWidth; d.classList.add('pulse'); setTimeout(() => d.classList.remove('pulse'), 2600); });
  wordEl.querySelectorAll('.dot').forEach((d, i) => { d.classList.remove('pulse'); void d.offsetWidth; d.style.animationDelay = (i * .12) + 's'; d.classList.add('pulse'); setTimeout(() => d.classList.remove('pulse'), 2600); });

}
function setKnob(x){

  const centre = slide.x + KNOB / 2;
  while(slide.next < slide.centres.length && centre >= slide.centres[slide.next] - 6){
    const i = slide.next, l = G.need.letters[i];

}
function slideStart(){ slide.next = 0; letterEls().forEach((_, i) => lightLetter(i, false)); knob.style.transition = 'none'; }
function slideEnd(){
  const reached = slide.next >= slide.centres.length && slide.x >= slide.max - 30;

    const support = G.needMistakes >= 2;

/* =========================================================
   Pointer handling (stage level, pointer capture)
   ========================================================= */
let drag = null;
stage.addEventListener('pointerdown', onDown);
stage.addEventListener('pointermove', onMove);
stage.addEventListener('pointerup', onUp);
stage.addEventListener('pointercancel', onUp);
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('touchmove', e => e.preventDefault(), { passive:false });
document.addEventListener('dblclick', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());

function onDown(e){
  lastAct = Date.now();
  if(drag) return;
  const t = e.target.closest('[data-act]'); if(!t) return;
  const act = t.dataset.act, p = toStage(e);
  if(G.stage === 'start' || G.stage === 'end') return;   // play / again handled on pointerup
  hideHand();
  switch(act){
    case 'speaker': replay(); break;
    case 'basket': if(G.stage === 'intro-wait') hatch(); break;
    case 'toybox': openToybox(); break;
    case 'dot': if(G.need && bubble.classList.contains('on')) tapDot(+t.dataset.i); break;
    case 'num': { t.classList.add('lit'); setTimeout(() => t.classList.remove('lit'), 600); say('num-' + t.dataset.n); log('num'); break; }
    case 'soap': popSoap(t); break;
    case 'knob':
      if(!G.need || slide.auto) return;
      drag = { type:'knob', id:e.pointerId, sx:p.x, k0:0, moved:false };
      slideStart();
      break;
    case 'source': {
      const kind = t.dataset.kind, s = SOURCES[kind];
      if(s.toy && !G.boxOpen) return;
      const el = makeItem(kind, p.x, p.y - 20);
      el.classList.add('drag');
      if(s.toy) t.classList.add('away');
      drag = { type:'item', id:e.pointerId, el, kind, sx:p.x, sy:p.y, moved:false, src:t };
      SFX.tick();
      break;
    }
    case 'plate':
      if(!(G.stage === 'need' && G.need.type === 'count') || G.busy) return;
      drag = { type:'plate', id:e.pointerId, sx:p.x, sy:p.y, ox:plateAt.x - p.x, oy:plateAt.y - p.y, moved:false };
      plateEl.style.transition = 'transform .2s'; plateEl.classList.add('lifted');
      break;
    case 'pom':
      if(G.stage === 'intro-wait'){ hatch(); return; }
      if(!['need','between','bedtime'].includes(G.stage) || G.busy) return;
      drag = { type:'pom', id:e.pointerId, sx:p.x, sy:p.y, ox:POM.x - p.x, oy:POM.y - p.y, moved:false };
      break;
    default: return;
  }
  if(drag){ try{ stage.setPointerCapture(e.pointerId); }catch(err){} }
}
function onMove(e){
  if(!drag || e.pointerId !== drag.id) return;
  const p = toStage(e);
  if(Math.hypot(p.x - drag.sx, p.y - (drag.sy ?? p.y)) > 10) drag.moved = true;
  if(drag.type === 'knob'){ setKnob(drag.k0 + (p.x - drag.sx)); }
  else if(drag.type === 'item'){ moveItem(drag.el, p.x, p.y - 20); }
  else if(drag.type === 'plate'){ setPlate(p.x + drag.ox, p.y + drag.oy); }
  else if(drag.type === 'pom' && drag.moved){
    if(!drag.lifted){ drag.lifted = true; pomEl.classList.add('lifted'); pomState('pom-dangle', true); SFX.squeak(); }
    setPom(p.x + drag.ox, p.y + drag.oy);
  }
}
function onUp(e){
  const t = e.target.closest ? e.target.closest('[data-act]') : null;
  if(!drag){
    // play / again need a "user activation" event for iOS audio, so they fire on pointerup
    if(t && t.dataset.act === 'play' && G.stage === 'start') begin();
    if(t && t.dataset.act === 'again' && G.stage === 'end') location.reload();
    return;
  }
  if(e.pointerId !== drag.id) return;
  const d = drag; drag = null;
  try{ stage.releasePointerCapture(e.pointerId); }catch(err){}
  lastAct = Date.now();
  if(d.type === 'knob'){
    if(!d.moved && slide.x < 12){ autoSlide(); return; }
    slideEnd(); return;
  }
  if(d.type === 'item'){ dropItem(d.el, d.kind, d.moved, d.src); return; }
  if(d.type === 'plate'){
    plateEl.classList.remove('lifted'); plateEl.style.transition = '';
    if(d.moved && overPom(plateAt.x, plateAt.y - 30)){ feedPlate(); return; }
    if(!d.moved){ plateEl.animate([{ transform:'rotate(0)' }, { transform:'rotate(-4deg)' }, { transform:'rotate(4deg)' }, { transform:'rotate(0)' }], { duration: 400 }); }
    plateHome(); return;
  }
  if(d.type === 'pom'){
    pomEl.classList.remove('lifted'); pomState('pom-dangle', false);
    if(!d.lifted){ tickle(); return; }
    dropPom();
  }
}

async function bounceHome(){

/* ---------- plate (counting need) ---------- */

    b.animate([{ left: TUB.x + 'px', top: (TUB.y - 20) + 'px', transform:'scale(.2)' }, { left: x + 'px', top: y + 'px', transform:'scale(1)' }], { duration: FAST ? 50 : 900, easing:'cubic-bezier(.2,.8,.3,1.2)' });
    b.style.left = x + 'px'; b.style.top = y + 'px';
    tone(500 + i * 90, .15, { to: 900 + i * 90, vol: .08 });
  }, i * 220));
  G.busy = false;
  await say('bath-pop');
}
function popSoap(b){
  if(G.stage !== 'bath' || b.dataset.popped) return;
  if(+b.dataset.n !== G.popped + 1){
    // wrong number: the bubble wobbles and bounces, it does not pop
    G.bathWrong++; log('soap-wrong:' + b.dataset.n);
    tone(300, .18, { to: 240, type:'triangle', vol: .1 });
    b.animate([{ transform:'scale(1)' }, { transform:'scale(1.15,.85)' }, { transform:'scale(.9,1.1)' }, { transform:'scale(1)' }], { duration: 420 });
    if(G.bathWrong >= 2) glowNextSoap();
    return;
  }
  b.dataset.popped = '1'; G.popped++; G.bathWrong = 0;
  stage.querySelectorAll('.soap.next').forEach(s => s.classList.remove('next'));
  const n = G.popped, x = parseFloat(b.style.left), y = parseFloat(b.style.top);
  SFX.pop(); SFX.squeak(); sparkle(x, y, 8, 80);
  b.getAnimations().forEach(a => a.cancel());
  const a = b.animate([{ transform:'scale(1)', opacity:1 }, { transform:'scale(1.5)', opacity:0 }], { duration: 220 });
  a.onfinish = () => b.remove();
  b.style.opacity = '0';
  // a number appears where the bubble was
  particle(x, y, String(n), '#7b4fd0', 72, 0, -60, 1300);
  pomDo('hop');
  if(n === 1) say('num-1'); else sayNext('num-' + n);
  log('pop:' + n);
  if(n === 6) finishBath();
}
function glowNextSoap(){
  const b = stage.querySelector(`.soap[data-n="${G.popped + 1}"]`);
  if(b) b.classList.add('next');
  return b;
}
async function finishBath(){
  G.stage = 'bath-out'; G.busy = true;
  await chain; await wait(300);
  const x0 = POM.x, y0 = POM.y, s0 = POM.s;
  SFX.boing();
  await tween(700, t => setPom(lerp(x0, HOME.x, easeInOut(t)), lerp(y0, HOME.y, easeInOut(t)) - Math.sin(Math.PI * t) * 140, lerp(s0, 1, t)));
  pomDo('shiver'); SFX.shake(); fluffPuffs(POM.x, POM.y, 18); drops(POM.x, POM.y, 10);
  await wait(1000);
  happyEars(); sparkle(POM.x, POM.y - 40, 10);
  setHeart(G.heart + 1);
  await say('yum-tub');
  await wait(500);
  G.busy = false;
  nextNeed();
}

/* ---------- flow ---------- */
async function begin(){
  log('play');
  // unlock audio on iOS inside the user gesture
  try{ const c = ac(); if(c && c.state === 'suspended') c.resume(); const b = c.createBuffer(1, 1, 22050), s = c.createBufferSource(); s.buffer = b; s.connect(c.destination); s.start(0); }catch(e){}
  try{ if(window.speechSynthesis){ const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } }catch(e){}
  try{ voiceEl.muted = true; const p = voiceEl.play(); if(p && p.catch) p.catch(() => {}); voiceEl.pause(); voiceEl.muted = false; }catch(e){}
  $('start').classList.add('hidden');
  G.stage = 'intro';
  setPom(BASKET.x, BASKET.y - 6, .55);
  pomState('pom-curled', true); pomState('pom-closed', true);
  await wait(600);
  G.stage = 'intro-wait'; G.prompt = 'intro-basket';
  await say('intro-basket');
  if(G.stage === 'intro-wait') handTap(BASKET.x, BASKET.y - 10);
}
async function hatch(){
  G.stage = 'intro-hatch'; hideHand(); log('hatch');
  pomDo('wobble'); SFX.tick();
  await wait(800);
  pomState('pom-closed', false); pomState('pom-curled', false);
  pomDo('squish'); SFX.squeak(); sparkle(POM.x, POM.y - 20, 12); happyEars();
  const intro = say('intro-pom');
  await wait(1800);
  // hop to the rug
  const x0 = POM.x, y0 = POM.y, s0 = POM.s;
  SFX.boing();
  await tween(900, t => setPom(lerp(x0, HOME.x, easeInOut(t)), lerp(y0, HOME.y, easeInOut(t)) - Math.sin(Math.PI * t) * 170, lerp(s0, 1, t)));
  pomDo('squish'); hearts(POM.x, POM.y - 80, 4);
  await intro;
  await wait(400);
  nextNeed();
}
function nextNeed(){
  G.needIndex++;
  if(G.needIndex >= NEEDS.length){ reward(); return; }
  startNeed(G.needIndex);
}
async function startNeed(i){
  const n = NEEDS[i];
  G.need = n; G.slid = false; G.needMistakes = 0; G.stage = 'need'; G.prompt = n.prompt;
  log('need:' + n.id);
  buildBubble(n);
  if(n.type === 'count'){ emptySpots(); G.plate = []; showPlate(true); SFX.boing(); }
  showBubble();
  if(n.type === 'pom'){ pomDo('hop'); } else { pomState('pom-rub', true); setTimeout(() => pomState('pom-rub', false), 2800); }
  SFX.squeak();
  await say(n.prompt);
  if(G.stage === 'need' && G.need === n && !G.slid) pulseDots();
}
async function reward(){
  if(G.stage === 'reward') return;
  G.stage = 'reward'; G.busy = true; hideBubble(); hideHand(); log('reward');
  pomState('pom-spots', false); showPlate(false);
  SFX.music(); confetti();
  // grow + turn lilac
  pomEl.style.setProperty('--fluff', '#c9a8f2'); pomEl.style.setProperty('--fluff2', '#a986de'); pomEl.style.setProperty('--fluff3', '#efe4ff');
  const g0 = G.grow;
  tween(1400, t => { G.grow = lerp(g0, 1.25, easeOut(t)); setPom(POM.x, POM.y); });
  pomDo('dance'); happyEars(); sparkle(POM.x, POM.y - 40, 20, 180);
  await wait(2300);
  // the bed sparkles in
  $('bedBack').classList.add('shown'); $('bedFront').classList.add('shown');
  SFX.sparkle(); sparkle(BED.x, BED.y, 24, 150); setTimeout(() => SFX.sparkle(), 300);
  await say('grow');
  G.yawning = true; pomState('pom-closed', true); pomState('pom-mouth', true); SFX.yawn(); pomDo('squish');
  await wait(1300);
  pomState('pom-mouth', false); pomState('pom-closed', false); G.yawning = false;
  G.stage = 'bedtime'; G.prompt = 'sleepy'; G.busy = false;
  await say('sleepy');
  if(G.stage === 'bedtime') handDrag(POM.x, POM.y, BED.x, BED.y);
}
async function goToBed(){
  G.stage = 'sleeping'; G.busy = true; hideHand(); log('bed');
  const x0 = POM.x, y0 = POM.y, s0 = POM.s;
  await tween(500, t => setPom(lerp(x0, BED.x, easeOut(t)), lerp(y0, BED.y, easeOut(t)), lerp(s0, .6, t)));
  pomDo('squish'); pomState('pom-closed', true); SFX.purr();
  $('night').classList.add('on'); $('nightSky').setAttribute('opacity', '1');
  const stars = [[120, 80], [300, 150], [450, 120], [700, 130], [880, 90], [1000, 200], [180, 300], [800, 300], [420, 400], [1120, 250]];
  stars.forEach(([x, y], i) => { const s = document.createElement('div'); s.className = 'twinkle'; s.textContent = '★'; s.style.left = x + 'px'; s.style.top = y + 'px'; s.style.animationDelay = (i * .17) + 's'; stage.appendChild(s); });
  let z = 0;
  const zt = setInterval(() => { if(z++ > 8){ clearInterval(zt); return; } particle(BED.x + 10, BED.y - 60, 'z', '#ffffff', 40 + (z % 3) * 8, rnd(-10, 30), -140, 1800); if(z % 2) SFX.snore(); }, 700);
  await say('bedtime');
  await wait(2600);
  showEnd();
}
function showEnd(){
  G.stage = 'end'; log('end');
  const mini = (vars, cls = '') => `<div class="card ${cls}"><div style="width:120px;height:126px;${vars}">${pomSVG().replace('class="pomsvg"', 'class="pomsvg" width="120" height="126"')}</div>${cls === 'got' ? '<div class="tick">✓</div>' : ''}</div>`;
  $('growRow').innerHTML =
    mini('--fluff:#ffb8a0;--fluff2:#f59a86;--fluff3:#ffe3d6', 'got') + '<div class="arrowR">➜</div>' +
    mini('--fluff:#c9a8f2;--fluff2:#a986de;--fluff3:#efe4ff', 'got') + '<div class="arrowR">➜</div>' +
    mini('', 'locked');
  $('itemRow').innerHTML =
    `<div class="card got"><svg viewBox="0 0 188 236" width="110" height="138">${$('bedBack').innerHTML}${$('bedFront').innerHTML}</svg><div class="tick">✓</div></div>` +
    `<div class="card locked"><span class="emo">🎠</span></div><div class="card locked"><span class="emo">🎵</span></div><div class="card locked"><span class="emo">🚪</span></div>`;
  $('end').classList.remove('hidden');
  SFX.music(); confetti();
  say('end');
}

/* ---------- hints ---------- */
function hint(){
  switch(G.stage){
    case 'intro-wait': say('intro-basket'); handTap(BASKET.x, BASKET.y - 10); break;
    case 'need': {
      const n = G.need;
      if(!G.slid){
        say('hint-slide'); pulseDots();
        const r = track.getBoundingClientRect(), x1 = (r.left - OFFX) / SCALE + KNOB / 2, y = (r.top - OFFY) / SCALE + 4 + KNOB / 2;
        handDrag(x1, y, x1 + slide.max, y);
      } else if(n.type === 'count'){
        if(G.plate.length){ say('hint-plate'); handDrag(PLATE.x, PLATE.y - 30, POM.x, POM.y); }
        else { say('plate'); handDrag(SOURCES.bun.x, SOURCES.bun.y, PLATE.x, PLATE.y - 30); }
      }
      else if(n.where === 'shelf'){ say('hint-shelf'); handTap(SOURCES.bun.x + 60, SOURCES.bun.y + 60); }
      else if(n.where === 'toybox'){ say('hint-toybox'); handTap(930, 440); }
      else { say('take-pom'); pulseDots(); handDrag(POM.x, POM.y, POM.x + 30, POM.y - 170); }   // shows how to lift Pom, not where to go
      break;
    }
    case 'bath': { say('hint-pop'); if(G.bathWrong >= 2){ const b = glowNextSoap(); if(b) handTap(parseFloat(b.style.left), parseFloat(b.style.top)); } break; }
    case 'bedtime': say('sleepy'); handDrag(POM.x, POM.y, BED.x, BED.y); break;
    default: if(G.lastLine && !G.lastLine.startsWith('sound-') && !G.lastLine.startsWith('num-') && !G.lastLine.startsWith('word-')) say(G.lastLine);
  }
}
function replay(){ log('replay'); hint(); lastAct = Date.now(); }
setInterval(() => {
  if(pending || G.busy || drag) return;
  if(!['intro-wait','need','bath','bedtime'].includes(G.stage)) return;
  if(Date.now() - lastAct < 8000) return;
  lastAct = Date.now();
  log('idle-hint'); hint();
}, 500);

setPom(POM.x, POM.y, POM.s);
pomState('pom-curled', true); pomState('pom-closed', true);

/* =========================================================
   Debug hook for testers
   ========================================================= */
window.__game = {
  get state(){ return { stage: G.stage, need: G.need && G.need.id, slid: G.slid, plate: G.plate.length, needMistakes: G.needMistakes, bathWrong: G.bathWrong, heart: G.heart, tummy: G.tummy, popped: G.popped, hat: G.hat, grow: G.grow, mistakes: G.mistakes, busy: G.busy, lastLine: G.lastLine }; },
  log: G.log,
  fast(on = true){ FAST = !!on; },
  say,
  pom: () => ({ ...POM }),
  sources: () => JSON.parse(JSON.stringify(SOURCES)),
  targets: { HOME, TUB, BED, BASKET }
};
</script>
