<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Fluffle Nursery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#4a2b5f;--glow:#ffd76a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#3b2619;overscroll-behavior:none;touch-action:none;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  font-family:'Andika','Chalkboard SE','Comic Sans MS',sans-serif;-webkit-text-size-adjust:100%}
#stage{position:absolute;left:0;top:0;width:1180px;height:820px;transform-origin:0 0;overflow:hidden;touch-action:none;background:#e9b77d}
#stage *{touch-action:none}
.abs{position:absolute}
svg{display:block;overflow:visible}
.hide{display:none!important}

/* glow and dim: one target glows, the rest is dimmed */
.glow{animation:glow 1.4s ease-in-out infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 6px rgba(255,215,106,.7)) drop-shadow(0 0 2px #fff)}50%{filter:drop-shadow(0 0 22px rgba(255,200,60,1)) drop-shadow(0 0 6px #fff)}}
.dim{opacity:.55;filter:saturate(.55) brightness(.92);pointer-events:none}

/* room props */
#room{position:absolute;left:0;top:0;z-index:0}
#gdoor{left:796px;top:246px;width:128px;height:268px;z-index:6}
#cupboard{left:20px;top:108px;width:390px;height:392px;z-index:10;transition:opacity .3s,filter .3s}
#cupboard .door{position:absolute;top:22px;width:173px;height:350px;transition:transform .55s cubic-bezier(.3,1.3,.5,1);z-index:3}
#cupboard .dl{left:22px;transform-origin:0 50%}
#cupboard .dr{left:195px;transform-origin:100% 50%}
#cupboard.open .dl{transform:translateX(-26px) scaleX(.13)}
#cupboard.open .dr{transform:translateX(26px) scaleX(.13)}
#cupboard .lock{position:absolute;left:162px;top:168px;width:66px;height:74px;z-index:4;transition:transform .5s cubic-bezier(.3,1.6,.5,1),opacity .4s}
#cupboard.open .lock{transform:translate(40px,-120px) rotate(40deg) scale(.6);opacity:0}
#shelf{position:absolute;left:0;top:0;width:390px;height:392px;z-index:2}
.slot{position:absolute;width:104px;height:104px;margin:-52px 0 0 -52px;transition:left .35s,top .35s,opacity .4s,transform .4s}
.slot svg{width:100%;height:100%}
.slot.small{width:86px;height:86px;margin:-43px 0 0 -43px}
.slot.gone{opacity:0;pointer-events:none;transform:scale(.3)}
.slot.away{opacity:0;pointer-events:none}
.slot.wig{animation:wobble .5s}

#cot{left:964px;top:292px;width:200px;height:250px;z-index:15}
#cotFront{left:964px;top:292px;width:200px;height:250px;z-index:56;pointer-events:none}
#nameSign{left:1004px;top:262px;width:120px;height:56px;z-index:49;border-radius:14px;background:#a8693f;border:4px solid #6f4229;color:#fff8e8;font-size:36px;line-height:46px;text-align:center;font-weight:700;opacity:0;transform:translateY(-200px);transition:transform .8s cubic-bezier(.3,1.5,.5,1),opacity .3s;pointer-events:none}
#nameSign.on{opacity:1;transform:none}
#tubBack,#tubFront{left:868px;top:566px;width:296px;height:236px}
#tubBack{z-index:30}#tubFront{z-index:56;pointer-events:none}
#tubHit{left:868px;top:600px;width:296px;height:200px;z-index:31}

#bowl{left:24px;top:600px;width:250px;height:170px;z-index:40}
#bowl svg.b{position:absolute;left:0;top:60px;width:250px;height:110px;pointer-events:none}
.berry{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#ffc1d4 0 14%,#e0457b 42%,#a01d50 100%);box-shadow:0 3px 0 rgba(90,10,40,.25);
  transition:left .3s cubic-bezier(.3,1.4,.5,1),top .3s cubic-bezier(.3,1.4,.5,1),transform .3s,opacity .3s}
.berry::before{content:"";position:absolute;left:18px;top:-6px;width:16px;height:10px;border-radius:50% 50% 0 0;background:#5fb85a}
.berry.hit::after{content:"";position:absolute;left:-10px;top:-10px;width:72px;height:72px}
#plate{left:250px;top:660px;width:250px;height:140px;z-index:55;transition:left .4s cubic-bezier(.4,1.3,.5,1),top .4s cubic-bezier(.4,1.3,.5,1),transform .3s}
#plate.lifted{transform:scale(1.06);filter:drop-shadow(0 14px 10px rgba(60,30,20,.3));transition:transform .2s}
#plate > svg{position:absolute;left:0;top:50px;width:250px;height:90px;pointer-events:none}
#plate .berry{width:44px;height:44px;margin:-22px 0 0 -22px}
#plate .berry::before{left:15px;width:14px;height:8px;top:-5px}
#plate .berry::after{content:"";position:absolute;left:-14px;top:-14px;width:72px;height:72px}
#plate .tf{position:absolute;left:30px;top:52px;width:190px;height:64px;display:none;pointer-events:none}
#plate.frame .tf{display:block}

/* The tummy window is part of the baby (fur rim and a fur flap to its tummy), so it never reads as a wish bubble. */
#tummy{transform-origin:0 50%;position:absolute;width:250px;height:114px;margin:-57px 0 0 -125px;border-radius:46px;background:#fff8f0;border:8px solid var(--fluff2,#79cfa9);
  box-shadow:0 0 0 6px var(--fluff,#a8e8cc),0 10px 20px rgba(80,30,10,.25);z-index:53;padding:8px 0 0;pointer-events:none;transform:scale(0);transition:transform .45s cubic-bezier(.3,1.5,.5,1)}
#tummy.on{transform:scale(1)}
#tummy::before{content:"";position:absolute;left:-84px;top:40px;width:92px;height:46px;background:var(--fluff,#a8e8cc);border-radius:23px 0 0 23px;transform:rotate(-16deg);transform-origin:100% 50%;z-index:-1}
#tummy .tf{display:grid;grid-template-columns:repeat(5,38px);grid-gap:8px 8px;justify-content:center}
.sp{width:38px;height:38px;border-radius:50%;border:3px dashed #d08a6a;position:relative}
.sp .bb{position:absolute;left:-2px;top:-2px;width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#ffc1d4 0 14%,#e0457b 42%,#a01d50 100%)}
.sp .bb.ghost{opacity:.45;outline:3px dashed #fff;outline-offset:-6px}
.sp.blink{animation:blink .5s ease-in-out 6}
.sp.pulse{animation:dotpulse .5s ease-in-out 1}
@keyframes blink{0%,100%{background:transparent}50%{background:#ffd76a}}
#tummy .cover{position:absolute;inset:0;border-radius:34px;background:radial-gradient(circle at 30% 30%,var(--fluff3,#e4fbf1),var(--fluff,#a8e8cc));display:none;align-items:center;justify-content:center;font-size:56px;font-weight:700;color:#4a2b5f}
#tummy.covered .cover{display:flex}
#tummy .cover span{border:4px dashed #4a2b5f;border-radius:20px;padding:0 16px;line-height:64px;background:rgba(255,255,255,.5)}
#sign{left:722px;top:376px;width:150px;height:170px;z-index:52}
#sign .num{position:absolute;left:4px;top:24px;width:90px;text-align:center;font-size:72px;font-weight:700;color:#4a2b5f}
#sign .bi{position:absolute;left:52px;top:96px}

#jug{left:730px;top:440px;width:130px;height:250px;z-index:70}
#jug .body{position:absolute;left:10px;top:30px;width:110px;height:210px;border-radius:14px 14px 30px 30px;border:6px solid rgba(255,255,255,.95);background:rgba(220,240,255,.55);overflow:hidden;box-shadow:0 8px 18px rgba(40,60,90,.25)}
#jug .water{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(#7fd0ff,#3fa6e8);transition:height .5s ease}
#jug .ln{position:absolute;left:0;width:30px;height:4px;background:#5a7fa8;border-radius:2px}
#jug .ln .d{position:absolute;left:36px;top:-9px;width:20px;height:20px;border-radius:50%;background:#ffb03b;display:none;box-shadow:0 2px 0 rgba(0,0,0,.2)}
#jug .ln .d.five{background:#8f6bff}
#jug.dots .ln .d{display:block}
#jug .ln.blink{animation:lnblink .45s ease-in-out 6}
@keyframes lnblink{0%,100%{background:#5a7fa8}50%{background:#ff6f9c;box-shadow:0 0 10px #ff6f9c}}
#jug .star{position:absolute;right:-30px;width:46px;height:46px;margin-top:-23px}
#jug .handle{position:absolute;left:-8px;top:70px;width:34px;height:90px;border:8px solid rgba(255,255,255,.95);border-right:none;border-radius:30px 0 0 30px}
#jug .spill{position:absolute;left:4px;top:12px;width:122px;height:30px;border-radius:15px 15px 8px 8px;background:linear-gradient(#bfe8ff,#3fa6e8);opacity:0;transition:opacity .25s;pointer-events:none}
#jug.over .spill{opacity:1;animation:spillw .45s ease-in-out infinite alternate}
@keyframes spillw{from{transform:scaleY(.8) translateY(5px)}to{transform:scaleY(1.2) translateY(-4px)}}
#jug.lifted{filter:drop-shadow(0 14px 12px rgba(40,40,80,.35))}
.soap{position:absolute;width:104px;height:104px;margin:-52px 0 0 -52px;border-radius:50%;z-index:75;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.98) 0 10%,rgba(255,255,255,0) 11%),radial-gradient(circle at 50% 50%,rgba(240,248,255,.93) 0 55%,rgba(170,210,255,.85) 72%,rgba(255,170,225,.85) 88%,rgba(255,255,255,.95) 100%);
  border:3px solid rgba(255,255,255,.95);box-shadow:inset -8px -10px 18px rgba(180,120,255,.4),0 6px 14px rgba(120,80,160,.25);transition:opacity .35s,transform .35s}
.soap .in{position:absolute;inset:0;animation:floaty 2.4s ease-in-out infinite;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.soap .n{font-size:50px;line-height:50px;color:#5b36c4;font-weight:700;text-shadow:0 0 6px #fff,0 0 3px #fff}
.soap .dd{display:grid;grid-template-columns:repeat(5,9px);gap:3px;margin-top:2px}
.soap .dd i{width:9px;height:9px;border-radius:50%;background:#ff7aa8;display:block}
.soap .dd i.e{background:transparent;box-shadow:inset 0 0 0 1.5px #c9a6ff}
.soap.used{opacity:0;transform:scale(.2);pointer-events:none}
.soap.glowp{box-shadow:0 0 0 9px rgba(255,214,102,.8),0 0 30px rgba(255,214,102,.9)}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

#tbasket{left:226px;top:640px;width:180px;height:130px;z-index:45}
#tbasket .lid{position:absolute;left:4px;top:4px;width:172px;height:40px;transform-origin:6% 90%;transition:transform .5s cubic-bezier(.3,1.6,.5,1),opacity .4s .15s}
#tbasket.open .lid{transform:translate(-20px,-80px) rotate(-24deg);opacity:0}
#tbasket .lk{position:absolute;left:70px;top:18px;width:40px;height:46px;transition:transform .5s,opacity .4s}
#tbasket.open .lk{transform:translateY(-90px) rotate(30deg);opacity:0}
.toy{position:absolute;width:96px;height:96px;margin:-48px 0 0 -48px;z-index:46;transition:left .45s cubic-bezier(.3,1.4,.5,1),top .45s cubic-bezier(.3,1.4,.5,1),transform .4s,opacity .3s}
.toy svg{width:100%;height:100%}
.toy.in{transform:scale(.2);opacity:0;pointer-events:none}
.toy.away{opacity:0;pointer-events:none}

.carry{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;z-index:92;pointer-events:none;filter:drop-shadow(0 12px 8px rgba(60,30,20,.3));transform:scale(1.12)}
.carry svg{width:100%;height:100%}
.carry.fly{transition:left .5s cubic-bezier(.4,1.3,.5,1),top .5s cubic-bezier(.4,1.3,.5,1),transform .4s,opacity .4s}

/* fluffles */
.fluff{position:absolute;left:0;top:0;width:220px;height:230px;transform-origin:110px 128px;z-index:50}
.fluff.lifted{z-index:91}
.fluff .inner{width:100%;height:100%;transform-origin:50% 92%}
.fluff svg.fs{width:220px;height:230px}
.f1{fill:var(--fluff,#a8e8cc)}.f1s{stroke:var(--fluff,#a8e8cc)}
.f2{fill:var(--fluff2,#79cfa9)}.f2s{stroke:var(--fluff2,#79cfa9)}
.f3{fill:var(--fluff3,#e4fbf1)}
.fp{fill:var(--pat,#ffffff)}
.ein{fill:#ffd2de}
.fs .breathe{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 2.6s ease-in-out infinite}
.fs .eyesClosed,.fs .mouthO,.fs .puffcheeks,.fs .tailg,.fs .pattern,.fs .crown,.fs .mud path{display:none}
.fs.closed .eyesOpen{display:none}.fs.closed .eyesClosed{display:inline}
.fs.mouth .mouthSmile{display:none}.fs.mouth .mouthO{display:inline}
.fs.puff .puffcheeks{display:inline}
.fs.st2 .tailg,.fs.st3 .tailg{display:inline}
.fs.st3 .pattern,.fs.st3 .crown{display:inline}
.fs .crown .gm{display:none}.fs .crown .gm.on{display:inline}
.fs.m1 .mud .m1,.fs.m2 .mud .m2,.fs.m3 .mud .m3{display:inline}
.fs.curled .feet,.fs.curled .paws,.fs.curled .tailg{display:none}
.fs .earfold{transform-box:fill-box}
.fs .earfoldL{transform-origin:88% 6%}.fs .earfoldR{transform-origin:12% 6%}
.fs.st0 .earfold{transform:scale(.55)}.fs.st1 .earfold{transform:scale(.8)}
.fs.curled .earfold{transform:scale(.4)}
.fs .ear{transform-box:fill-box}
.fs .earL{transform-origin:88% 6%}.fs .earR{transform-origin:12% 6%}
.fs.happy .earL{animation:earL .5s ease-in-out 3}.fs.happy .earR{animation:earR .5s ease-in-out 3}
.fs.dangle .earL{animation:earL .35s ease-in-out infinite}.fs.dangle .earR{animation:earR .35s ease-in-out infinite}
.fs .paws ellipse{transform-box:fill-box;transform-origin:50% 50%}
.fs.rub .pawL{animation:rubL .7s ease-in-out infinite}.fs.rub .pawR{animation:rubR .7s ease-in-out infinite}
.fs.point .pawR{animation:pointR .6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.975)}}
@keyframes earL{0%,100%{transform:rotate(0)}30%{transform:rotate(16deg)}70%{transform:rotate(-8deg)}}
@keyframes earR{0%,100%{transform:rotate(0)}30%{transform:rotate(-16deg)}70%{transform:rotate(8deg)}}
@keyframes rubL{0%,100%{transform:translate(0,0)}50%{transform:translate(26px,8px)}}
@keyframes rubR{0%,100%{transform:translate(0,0)}50%{transform:translate(-26px,8px)}}
@keyframes pointR{0%,100%{transform:translate(0,0)}50%{transform:translate(10px,-40px)}}
.a-tickle{animation:tickle .7s ease}.a-sniff{animation:sniff .7s ease}.a-munch{animation:munch .9s ease}
.a-spin{animation:spin 1s ease}.a-shake{animation:shakeNo .9s ease}.a-shiver{animation:shiver 1s linear}
.a-dance{animation:dance 2.2s ease}.a-wobble{animation:wobble .8s ease}.a-hop{animation:hop .5s ease}
.a-squish{animation:squish .45s ease}.a-roll{animation:roll .8s linear}.a-big{animation:bigpuff 1.6s ease}
@keyframes tickle{0%{transform:scale(1)}20%{transform:scale(1.14,.86)}40%{transform:scale(.92,1.1) rotate(-6deg)}60%{transform:scale(1.06,.95) rotate(5deg)}80%{transform:rotate(-2deg)}100%{transform:scale(1)}}
@keyframes sniff{0%,100%{transform:none}20%{transform:translateX(-8px) rotate(-7deg)}40%{transform:translateX(-4px) rotate(-3deg)}60%{transform:translateX(-9px) rotate(-8deg)}80%{transform:translateX(-3px)}}
@keyframes munch{0%,100%{transform:none}15%,45%,75%{transform:scale(1.04,.93)}30%,60%,90%{transform:scale(.98,1.04)}}
@keyframes spin{0%{transform:translateY(0) rotateY(0)}40%{transform:translateY(-70px) rotateY(200deg)}80%{transform:translateY(0) rotateY(360deg)}90%{transform:scale(1.08,.92)}100%{transform:none}}
@keyframes shakeNo{0%,100%{transform:none}15%{transform:rotate(-12deg)}35%{transform:rotate(12deg)}55%{transform:rotate(-10deg)}75%{transform:rotate(8deg)}}
@keyframes shiver{0%,100%{transform:none}10%,30%,50%,70%,90%{transform:rotate(-9deg) scale(1.03)}20%,40%,60%,80%{transform:rotate(9deg) scale(1.03)}}
@keyframes dance{0%,100%{transform:none}12%{transform:translateY(-50px) rotate(-14deg)}25%{transform:translateY(0) scale(1.1,.9)}37%{transform:translateY(-50px) rotate(14deg)}50%{transform:translateY(0) scale(1.1,.9)}62%{transform:translateY(-70px) rotate(-360deg)}75%{transform:translateY(0) rotate(-360deg) scale(1.1,.9)}87%{transform:translateY(-30px) rotate(-360deg)}}
@keyframes wobble{0%,100%{transform:none}20%{transform:rotate(-12deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(5deg)}}
@keyframes hop{0%,100%{transform:none}50%{transform:translateY(-36px)}}
@keyframes squish{0%,100%{transform:none}40%{transform:scale(1.16,.84)}70%{transform:scale(.94,1.06)}}
@keyframes roll{to{transform:rotate(360deg)}}
@keyframes bigpuff{0%,100%{transform:none}30%,70%{transform:scale(1.9)}}
@keyframes dotpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25);box-shadow:0 0 0 12px rgba(255,200,90,.55)}}

/* thought bubble */
#bubble{position:absolute;top:70px;left:440px;z-index:60;transform-origin:30% 120%;transform:scale(0);opacity:0;transition:transform .5s cubic-bezier(.3,1.5,.5,1),opacity .25s;pointer-events:none}
#bubble.on{transform:scale(1);opacity:1;pointer-events:auto}
.cloud{position:relative;background:#fffdf8;border-radius:70px;padding:8px 0 16px;box-shadow:0 10px 0 rgba(120,70,120,.12),0 18px 40px rgba(80,40,60,.18);transition:background .6s,box-shadow .6s}
#bubble.gold .cloud{background:linear-gradient(135deg,#fff6c9,#ffe07a 50%,#fff3b0);box-shadow:0 0 0 6px #ffd24a,0 0 40px rgba(255,200,60,.9)}
.word{display:flex;align-items:flex-start;padding:0 50px 0 76px}
.col{display:flex;flex-direction:column;align-items:center;width:96px}
.col.dg{width:150px}
.letter{font-size:104px;line-height:116px;height:116px;color:var(--ink);font-weight:700;transition:transform .2s,color .2s;pointer-events:none}
.letter.lit{color:#e0457b;transform:translateY(-10px) scale(1.1)}
.mk{margin-top:2px;height:80px;width:80px;border-radius:50%;position:relative;box-shadow:inset 0 -7px 0 rgba(0,0,0,.15),0 4px 0 rgba(0,0,0,.08);transition:transform .15s}
.mk.bar{width:132px;border-radius:40px}
.mk::after{content:"";position:absolute;left:18px;top:14px;width:24px;height:16px;border-radius:50%;background:rgba(255,255,255,.6)}
.mk.lit{transform:scale(1.18);box-shadow:0 0 0 10px rgba(255,220,120,.6),inset 0 -7px 0 rgba(0,0,0,.15)}
.mk.done{box-shadow:0 0 0 6px #7fe0a8,inset 0 -7px 0 rgba(0,0,0,.15)}
.mk.pulse,.letter.pulse{animation:dotpulse .55s ease-in-out 1}
.numc{font-size:130px;line-height:140px;color:#6c4bd6;font-weight:700;width:170px;text-align:center;border-radius:30px;background:#efe7ff;margin:6px 0}
.numc.pulse{animation:dotpulse .55s ease-in-out 3}
.ndots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:200px;transition:opacity 1.2s}
.ndots i{width:26px;height:26px;border-radius:50%;background:#ff7aa8;display:block}
.ndots.fade{opacity:0}
.track{position:relative;height:96px;margin-top:8px}
.trackline{position:absolute;left:30px;right:24px;top:38px;height:20px;border-radius:10px;background:repeating-linear-gradient(90deg,#f1d9ff 0 26px,#e2c2fb 26px 40px)}
.trackend{position:absolute;right:0;top:22px;width:0;height:0;border-top:26px solid transparent;border-bottom:26px solid transparent;border-left:40px solid #c79af0}
.knob{position:absolute;left:0;top:3px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c9,#ffc93c 60%,#f0a400);box-shadow:0 6px 0 #c98400,0 10px 16px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;z-index:2}
.knob svg{width:50px;height:50px;pointer-events:none}
.knob.anim{transition:transform .45s cubic-bezier(.3,1.5,.5,1)}
.btail{position:absolute;background:#fffdf8;border-radius:50%;box-shadow:0 6px 14px rgba(80,40,60,.15)}
#bubble.gold .btail{background:#ffe07a}

/* naming board */
#board{left:270px;top:78px;width:640px;height:486px;z-index:65;transform:scale(0);opacity:0;transition:transform .5s cubic-bezier(.3,1.4,.5,1),opacity .3s;transform-origin:50% 100%}
#board.on{transform:none;opacity:1}
#board .bg{position:absolute;inset:0;border-radius:40px;background:#a8693f;border:8px solid #6f4229;box-shadow:0 14px 30px rgba(60,30,10,.35)}
#board .bg::after{content:"";position:absolute;inset:14px;border-radius:28px;background:#f6dcb4}
.nbox{position:absolute;top:30px;width:124px;height:132px;margin-left:-62px;border-radius:24px;background:#fffaf0;border:5px dashed #c99a6a;z-index:2}
.nbox.act{border-color:#ffb300;border-style:solid}
.tray{position:absolute;top:286px;width:162px;height:166px;margin-left:-81px;border-radius:24px;z-index:2;transition:opacity .3s,filter .3s}
.tray.t0,.tray.t2{background:#cfe6ff}.tray.t1{background:#ffd6e8}
.tray.off{opacity:.45;filter:saturate(.4)}

let SCALE = 1, OFFX = 0, OFFY = 0;
function fit(){
  const w = window.innerWidth, h = window.innerHeight;

let SL = null;
function knobX(s, x, anim){ s.knob.classList.toggle('anim', !!anim); s.knob.style.transform = `translateX(${x}px)`; }
function sliderOn(cfg){
  SL = Object.assign({ x: 0, want: 0, next: 0, busy: false, holding: false, finished: false, auto: false }, cfg);
  SL.max = SL.track.offsetWidth - KN; SL.knob.innerHTML = STAR; knobX(SL, 0); return SL;
}
function sliderOff(){ SL = null; }
function slApply(){
  const s = SL; if(!s) return; const n = s.gs.length;
  if(!s.busy && s.next < n && s.want + KN / 2 >= s.centres[s.next] - 8) slPlay(s.next);
  let lim = s.max; if(s.busy && s.next < n) lim = Math.min(lim, s.centres[s.next] - KN / 2 - 2);
  s.x = Math.max(0, Math.min(s.want, lim)); knobX(s, s.x);
}
function slPlay(i){
  const s = SL; s.busy = true; s.next = i + 1; s.light(i, true);
  Promise.resolve(snd(s.gs[i])).then(() => wait(FAST ? 0 : s.gap)).then(() => {
    s.light(i, false); if(SL !== s) return;
    s.busy = false; slApply(); slCheck();
  });
}
function slCheck(){ const s = SL; if(!s || s.finished) return; if(!s.holding && !s.busy && s.next >= s.gs.length && s.x >= s.max - 40){ s.finished = true; logEv('slid'); s.done(); } }
function slRelease(){
  const s = SL; if(!s) return; s.holding = false;
  if(s.next >= s.gs.length && s.x >= s.max - 40){ slCheck(); return; }
  // A quick swipe past the middle keeps going on its own: the star still waits for every sound.
  if(s.want >= s.max * 0.5){ slAuto(true); return; }
  s.want = 0; s.x = 0; s.next = 0; knobX(s, 0, true);
}
async function slAuto(cont){
  const s = SL; if(!s || s.auto || s.finished) return; s.auto = true; s.holding = true;
  if(cont) s.want = s.max;
  else { s.next = 0; s.want = 0; await tween(s.gs.length * 700 + 300, t => { if(SL === s){ s.want = t * s.max; slApply(); } }); }
  // wait for the queued sounds, then let go
  while(SL === s && s.next < s.gs.length){ await wait(60); s.want = s.max; slApply(); }
  s.auto = false; if(SL === s){ s.want = s.max; slApply(); slRelease(); }
}
function slReset(){ const s = SL; if(!s) return; s.finished = false; s.next = 0; s.want = 0; s.x = 0; knobX(s, 0, true); }

/* ---------------- word choice ---------------- */
const lvGroup = (lv) => 2 + Math.floor(lv / 4), lvSub = (lv) => lv % 4;
function shared(a, b){ const x = W[a].g.slice(); let n = 0; W[b].g.forEach(g => { const i = x.indexOf(g); if(i >= 0){ n++; x.splice(i, 1); } }); return n; }
function oneDiff(a, b){ const A1 = W[a].g, B1 = W[b].g; if(a === b || A1.length !== B1.length) return false; let d = 0; A1.forEach((g, i) => { if(g !== B1[i]) d++; }); return d === 1; }
const clash = (a, b) => NEVER_TOGETHER.some(([x, y]) => (a === x && b === y) || (a === y && b === x));
function pickWord(group){
  const recent = SAVE.recent.slice(-6);
  let c = Object.keys(W).filter(w => W[w].lv === group && !W[w].filler && !recent.includes(w));
  if(!c.length) c = Object.keys(W).filter(w => W[w].lv <= group && !W[w].filler && !recent.includes(w));
  if(!c.length) c = Object.keys(W).filter(w => W[w].lv <= group && !W[w].filler);
  const w = pick(c); SAVE.recent.push(w); SAVE.recent = SAVE.recent.slice(-10); saveGame(); return w;
}
// Position (0 first, 1 vowel, 2 final) of the one sound in which two words differ.
const diffPos = (a, b) => W[a].g.findIndex((g, i) => g !== W[b].g[i]);
// Plan 2.4: Dutch-interference pairs (a/e, u/o, final d/t, final g/k) stay out of the shelf up to L2.
const DUTCH = [['a','e'],['u','o'],['d','t'],['g','k'],['g','ck']];
function dutchPair(a, b){ const i = diffPos(a, b), x = W[a].g[i], y = W[b].g[i]; return DUTCH.some(([p, q]) => (x === p && y === q) || (x === q && y === p)) && (i === 1 || i === W[a].g.length - 1); }
function buildShelf(target, group, n){
  const pool = Object.keys(W).filter(w => w !== target && W[w].lv <= group);
  const ok = (w, list) => !list.some(x => clash(x, w));
  const out = [target];
  const near = shuffle(Object.keys(W).filter(w => w !== target && oneDiff(w, target) && !(group <= 2 && dutchPair(w, target))));
  // One partner per position first (final ones are rarest, so they go first), so the first sound alone never decides.
  [2, 0, 1].forEach(pos => { const w = near.find(x => diffPos(x, target) === pos && !out.includes(x) && ok(x, out)); if(w) out.push(w); });
  near.forEach(w => { if(out.length < 4 && !out.includes(w) && ok(w, out)) out.push(w); });
  const partners = out.slice(1);
  // Fillers that start or end like the target come first, so the first sound alone is not enough
  // for targets with few one-sound partners (duck, rat, sun).
  const tg = W[target].g, edge = (w) => (W[w].g[0] === tg[0] ? 2 : 0) + (W[w].g[W[w].g.length - 1] === tg[tg.length - 1] ? 1 : 0);
  shuffle(pool.filter(w => !out.includes(w) && shared(w, target) <= 1)).sort((a, b) => edge(b) - edge(a)).forEach(w => { if(out.length < n && ok(w, out)) out.push(w); });
  return { items: out, partners };
}

  $('duskSky').setAttribute('opacity', mode === 'dusk' ? '1' : '0'); $('nightSky').setAttribute('opacity', mode === 'night' ? '1' : '0');
  $('gdoor').style.filter = mode === 'night' ? 'brightness(.45) saturate(.6)' : mode === 'dusk' ? 'brightness(.85)' : '';
  if(mode !== 'night') document.querySelectorAll('.twinkle,.zz').forEach(e => e.remove());
}
function runStep(name){
  RUN++; const r = RUN; clearScene(); G.step = name; G.phase = null; G.goal = []; G.how = []; G.hint = null; logEv('step:' + name);
  Promise.resolve().then(() => STEPS[name](r)).catch(e => { if(e !== ABORT) console.error(e); });
}
function next(){ G.si++; if(G.si >= G.steps.length){ G.steps = buildDay(); G.si = 0; } runStep(G.steps[G.si]); }
function startDay(){ G.hearts = []; G.missRow = 0; G.wish1First = false; G.findSaid = false; G.todayStickers = []; drawHearts(); G.steps = buildDay(); G.si = -1; }

const board = $('board'), nboxes = [...board.querySelectorAll('.nbox')], trays = [...board.querySelectorAll('.tray')], ntrack = $('ntrack'), heartBtn = $('heartBtn');
const BOX_X = [110, 270, 430];
function buildBoard(){
  trays.forEach((t, ti) => { t.innerHTML = ''; TRAYS[ti].forEach((g, gi) => { const d = document.createElement('div'); d.className = 'gem ' + (ti === 1 ? 'p' : 'b'); d.textContent = g; d.dataset.act = 'gem'; d.dataset.t = ti; d.dataset.g = g; d.style.left = (4 + (gi % 2) * 80) + 'px'; d.style.top = (4 + Math.floor(gi / 2) * 80) + 'px'; t.appendChild(d); }); });
  nboxes.forEach(b => b.innerHTML = '');
}
function allowedNames(){ const used = usedNames(); return NAMES.filter(n => !used.includes(n)); }
function refreshBoard(){
  const N = G.naming, ok = allowedNames(), s = N.slots;
  N.active = s.findIndex(x => !x); if(N.active < 0) N.active = 3;
  nboxes.forEach((b, i) => { b.classList.toggle('act', i === N.active && N.phase === 'build'); b.innerHTML = s[i] ? `<div class="gem big ${i === 1 ? 'p' : 'b'}" data-act="placed" data-i="${i}" style="left:5px;top:9px">${s[i]}</div>` : ''; });
  trays.forEach((t, ti) => {
    t.classList.toggle('off', ti !== N.active || N.phase !== 'build');
    [...t.children].forEach(gm => {
      const g = gm.dataset.g; let no = false;
      if(ti === 1 && s[0]) no = !ok.some(n => n[0] === s[0] && n[1] === g);
      if(ti === 2 && s[0] && s[1]) no = !ok.includes(s[0] + s[1] + g);
      if(ti === 0) no = !ok.some(n => n[0] === g);
      gm.classList.toggle('no', no);
    });
  });
  heartBtn.classList.toggle('off', N.phase !== 'heart');
  ntrack.classList.toggle('off', !['slide','demo','said'].includes(N.phase));
  if(N.phase === 'build'){ ntrack.querySelector('.knob').style.transform = 'translateX(0)'; ntrack.querySelector('.knob').innerHTML = STAR; if(G.step === 'naming') focus([trays[N.active]].filter(Boolean)); }
}
function boardSlider(done){
  sliderOn({ track: ntrack, knob: ntrack.querySelector('.knob'), centres: BOX_X.map(x => x - 30), gs: G.naming.slots.slice(), gap: 500,

}

async function wishStep(r, kind){
  setSky(kind === 'bedtime' ? 'dusk' : 'day'); babyHome();
  const bed = kind === 'bedtime';
  const golden = kind === 'wish2' && G.wish1First;
  const lv = bed ? 1 : guardLv(SAVE.levels.blend);
  const group = golden ? Math.min(5, lvGroup(lv) + 1) : lvGroup(lv), sub = golden ? 0 : lvSub(lv);
  let word, items, partners;
  if(bed){ const set = pick(TOY_SETS); word = pick(set.filter(w => TOY_TARGETS.includes(w))); items = set; partners = set.filter(w => w !== word); }
  else { word = pickWord(group); const s = buildShelf(word, group, sub >= 2 ? 8 : 6); items = s.items; partners = s.partners; }
  G.wish = { kind, word, g: W[word].g, golden, bed, group, sub, gap: sub === 0 ? 500 : 300, dots: sub === 3, items, partners, wrongs: 0, helped: false, tapped: new Set() };
  logEv(`wish:${kind}:${word}:L${group}${'abcd'[sub]}${golden ? ':golden' : ''}`);
  const cs = buildBubble(G.wish.g, { golden, noSlider: G.wish.dots });
  if(bed){ tbasket.classList.remove('hide', 'open'); fillToys(items); }
  else { fillShelf(items); closeCupboard(); }
  showBubble(); fdo(BABY, 'hop'); fcls(BABY, 'point', true); sparkle(BABY.x, BABY.y - 80, 10);
  if(bed){ G.sleeping = false; fcls(BABY, 'mouth', true); fcls(BABY, 'closed', true); say('flf-yawn'); await Wt(r, 1100); fcls(BABY, 'mouth', false); fcls(BABY, 'closed', false); }
  else { say('flf-wish'); await Wt(r, 1300); }
  fcls(BABY, 'point', false);
  readPhase(cs);
  const goal = bed ? ['sleepy','read-bubble'] : golden ? ['golden','read-bubble'] : ['wish-goal','read-bubble'];
  G.goal = goal; await S(r, goal);
  if(!SAVE.seen['how' + (G.wish.dots ? 'd' : 's')]){ SAVE.seen['how' + (G.wish.dots ? 'd' : 's')] = true; saveGame(); await S(r, G.how); if(G.phase === 'read' && G.hint) G.hint(); }
}
function readPhase(cs){
  const w = G.wish; G.phase = 'read'; w.tapped = new Set();
  wordEl.querySelectorAll('.mk').forEach(m => m.classList.remove('done'));
  const goal = w.bed ? ['sleepy','read-bubble'] : w.golden ? ['golden','read-bubble'] : ['wish-goal','read-bubble'];
  if(w.dots){
    sliderOff();
    moment({ goal, how: ['dots-how'], focus: [...wordEl.querySelectorAll('.mk')], hint: () => { const m = stageRect(wordEl.querySelector('.mk')); handTap(m.cx, m.cy); } });
  } else {
    sliderOn({ track: btrack, knob: btrack.querySelector('.knob'), centres: cs || w.centres, gs: w.g, gap: w.gap, light: bubbleLight, done: () => flow(opened) });
    w.centres = SL.centres;
    moment({ goal, how: ['wish-how'], focus: [SL.knob], hint: knobHint });
  }
}
function tapDot(i){
  const w = G.wish; if(!w || !['read','pick'].includes(G.phase) || G.busy) return;

}
async function opened(r){

async function wishRight(r, el, carry){

  if(w.bed){ const t = document.createElement('div'); t.className = 'toy'; t.innerHTML = art(w.word); t.style.cssText = `left:${BABY.x + 70}px;top:${BABY.y + 52}px;width:70px;height:70px;z-index:51`; t.id = 'hugToy'; stage.appendChild(t); el.classList.add('away'); }

/* ---------------- pointer input ---------------- */
let drag = null;
stage.addEventListener('pointerdown', onDown);

function carryEl(html, x, y){ const c = document.createElement('div'); c.className = 'carry'; c.innerHTML = html; c.style.left = x + 'px'; c.style.top = y + 'px'; stage.appendChild(c); return c; }
const ACTS = {
  replay(){ replay(); },
  book(){ if(drag || G.busy) return; openBook('things'); },
  bookclose(){ closeBook(); },
  tab(t){ showPage(t.dataset.p); },
  sticker(t){ say('word-' + t.dataset.w); },
  treef(t){ say('name-' + t.dataset.name + '-hello'); },
  basket(){ tapBasket(); },
  moon(){ tapMoon(); },
  cot(){ if(G.phase === 'wake') flow(wake); },
  num(t){ t.classList.remove('pulse'); void t.offsetWidth; t.classList.add('pulse'); if(G.feed) say('num-' + G.feed.need); },
  dot(t){ tapDot(+t.dataset.i); },
  knob(t, p){
    if(!SL || SL.finished || SL.auto || SL.knob !== t || G.busy) return;
    G.acted = true; hideHand(); SL.holding = true; const s = SL, off = p.x - s.x;
    return { move(q){ if(SL === s){ s.want = q.x - off; slApply(); } }, up(q, d){ if(SL !== s) return; if(!d.moved){ s.holding = false; slAuto(); } else slRelease(); } };
  },
  gem(t, p){
    const N = G.naming; if(!N || N.phase !== 'build' || t.classList.contains('no')) return;
    const ti = +t.dataset.t, g = t.dataset.g;
    if(ti !== N.active){ t.animate([{ transform: 'rotate(0)' }, { transform: 'rotate(-10deg)' }, { transform: 'rotate(10deg)' }, { transform: 'none' }], { duration: 350 }); return; }
    G.acted = true; hideHand(); t.classList.add('lit'); snd(g).then(() => t.classList.remove('lit'));
    const c = document.createElement('div'); c.className = 'gem carry ' + (ti === 1 ? 'p' : 'b'); c.textContent = g; c.style.left = (p.x - 37) + 'px'; c.style.top = (p.y - 37) + 'px'; stage.appendChild(c); c.style.display = 'none';
    return {
      move(q, d){ if(d.moved) c.style.display = 'flex'; c.style.left = (q.x - 37) + 'px'; c.style.top = (q.y - 37) + 'px'; },
      up(q, d){ c.remove(); if(!d.moved) return; const b = stageRect(nboxes[ti]); if(Math.abs(q.x - b.cx) < 110 && q.y < b.y + b.h + 90) placeGem(ti, g); else sfx('whoosh'); }
    };
  },
  placed(t){ popGem(+t.dataset.i); },
  nheart(){ if(G.naming && G.naming.phase === 'heart') flow(confirmName); },
  item(t, p){
    const w = G.wish; if(!w || G.busy) return;
    if(G.phase !== 'pick'){ return; }
    G.acted = true; hideHand();
    const c = carryEl(art(t.dataset.w), p.x, p.y - 20); c.style.display = 'none';
    return {
      move(q, d){ if(d.moved){ if(c.style.display === 'none'){ c.style.display = ''; t.classList.add('away'); if(!SAVE.seen.carry){ SAVE.seen.carry = true; saveGame(); say('give'); } } } c.style.left = q.x + 'px'; c.style.top = (q.y - 20) + 'px'; },
      up(q, d){
        if(!d.moved){ c.remove(); t.classList.remove('wig'); void t.offsetWidth; t.classList.add('wig'); return; }
        if(overBaby(q.x, q.y - 20) && judge(t, t.dataset.w, c)) return;
        const r = stageRect(t); c.classList.add('fly'); c.style.left = r.cx + 'px'; c.style.top = r.cy + 'px'; c.style.transform = 'scale(1)'; sfx('whoosh');
        setTimeout(() => { c.remove(); t.classList.remove('away'); }, 520);
      }
    };
  },
  berry(t, p){
    if(!G.feed || G.phase !== 'plate' || G.busy) return;
    G.acted = true; hideHand();
    const c = carryEl('', p.x, p.y); c.classList.add('berry'); c.style.width = '52px'; c.style.height = '52px'; c.style.margin = '-26px 0 0 -26px'; c.style.display = 'none';
    return {
      move(q, d){ if(d.moved){ c.style.display = ''; t.style.opacity = '0'; } c.style.left = q.x + 'px'; c.style.top = q.y + 'px'; },
      up(q, d){ c.remove(); t.style.opacity = ''; const pl = stageRect($('plate')); if(!d.moved || (q.x > pl.x - 30 && q.x < pl.x + pl.w + 30 && q.y > pl.y - 60 && q.y < pl.y + pl.h + 30)) berryToPlate(t); }
    };
  },
  pberry(t, p){
    const pd = ACTS.plate($('plate'), p); if(!pd) return;
    return { move: pd.move, up(q, d){ if(!d.moved){ pd.up(q, d); berryOff(t); return; } pd.up(q, d); } };
  },
  plate(t, p){
    if(!G.feed || G.phase !== 'plate' || G.busy) return;
    const pl = $('plate'), x0 = parseFloat(pl.style.left), y0 = parseFloat(pl.style.top);
    return {
      move(q, d){ if(!d.moved) return; G.acted = true; pl.classList.add('lifted'); pl.style.transition = 'none'; pl.style.left = (x0 + q.x - d.sx) + 'px'; pl.style.top = (y0 + q.y - d.sy) + 'px'; },
      up(q, d){ pl.classList.remove('lifted'); pl.style.transition = ''; if(!d.moved) return; const r = stageRect(pl); if(overBaby(r.cx, r.cy - 20)) flow(handOver); else plateHome(); }
    };
  },
  soap(t, p){
    if(G.phase === 'free'){ popSoap(t); return; }
    const b = G.bath; if(!b || G.phase !== 'pour' || G.busy || t.classList.contains('used')) return;
    G.acted = true; hideHand(); const x0 = t._home[0], y0 = t._home[1];
    return {
      move(q){ t.style.transition = 'none'; t.style.left = q.x + 'px'; t.style.top = q.y + 'px'; t.style.zIndex = 93; },
      up(q, d){ t.style.transition = ''; t.style.zIndex = ''; const j = stageRect($('jug')); if(d.moved && q.x > j.x - 50 && q.x < j.x + j.w + 50 && q.y > j.y - 70 && q.y < j.y + j.h){ t.style.left = (j.cx) + 'px'; t.style.top = (j.y + 20) + 'px'; flow(r => pourSoap(r, t)); } else { t.style.left = x0 + 'px'; t.style.top = y0 + 'px'; } }
    };
  },
  jug(t, p){
    if(G.phase !== 'jugfull' || G.busy) return;
    G.acted = true; hideHand(); const x0 = parseFloat(t.style.left), y0 = parseFloat(t.style.top);
    return {
      move(q, d){ t.classList.add('lifted'); t.style.left = (x0 + q.x - d.sx) + 'px'; t.style.top = (y0 + q.y - d.sy) + 'px'; },
      up(q, d){ t.classList.remove('lifted'); const r = stageRect(t); if(d.moved && Math.hypot(r.cx - BABY.x, r.cy - BABY.y) < 200) flow(pourJug); else { t.style.left = '730px'; t.style.top = '440px'; } }
    };
  },
  tub(){ },
  baby(t, p){
    const canLift = (G.step === 'bath' && G.phase === 'totub') || (G.step === 'bedtime' && G.phase === 'tobed');
    if(G.phase === 'wake'){ flow(wake); return; }
    if(!canLift || G.busy){ return { up(q, d){ if(!d.moved) tickle(); } }; }
    const ox = BABY.x - p.x, oy = BABY.y - p.y;
    return {
      move(q, d){ if(!d.moved) return; if(!d.lifted){ d.lifted = true; G.acted = true; hideHand(); BABY.el.classList.add('lifted'); fcls(BABY, 'dangle', true); } place(BABY, q.x + ox, q.y + oy); },
      up(q, d){
        BABY.el.classList.remove('lifted'); fcls(BABY, 'dangle', false);
        if(!d.lifted){ tickle(); return; }
        if(G.phase === 'totub' && BABY.x > TUB.box[0] && BABY.y > TUB.box[1] - 40){ flow(intoTub); return; }
        if(G.phase === 'tobed' && BABY.x > COT.box[0] && BABY.x < COT.box[2] && BABY.y > COT.box[1] && BABY.y < COT.box[3]){ flow(goToBed); return; }
        flow(async () => { await hopTo(BABY, HOME.x, HOME.y, 1, 500, 40); });
      }
    };
  }
};
function tickle(){ if(G.sleeping || G.busy && G.step !== 'bath') return; fdo(BABY, 'tickle'); happy(BABY); hearts(BABY.x, BABY.y - 80, 3); babbleTickle(); logEv('tickle'); }
function onDown(e){
  lastAct = Date.now();
  if(drag || !G.started) return;
  const t = e.target.closest('[data-act]'); if(!t) return;
  const act = t.dataset.act; if(!act || !ACTS[act]) return;
  if(bookOpen && !['bookclose','tab','sticker','treef'].includes(act)) return;
  const p = toStage(e);
  const d = ACTS[act](t, p, e);
  if(d){ drag = Object.assign(d, { id: e.pointerId, sx: p.x, sy: p.y, moved: false }); try{ stage.setPointerCapture(e.pointerId); }catch(err){} }
}
function onMove(e){ if(!drag || e.pointerId !== drag.id) return; const p = toStage(e); if(!drag.moved && Math.hypot(p.x - drag.sx, p.y - drag.sy) > 12) drag.moved = true; if(drag.move) drag.move(p, drag); }
function onUp(e){ if(!drag || e.pointerId !== drag.id) return; const d = drag; drag = null; try{ stage.releasePointerCapture(e.pointerId); }catch(err){} lastAct = Date.now(); if(d.up) d.up(toStage(e), d); }

/* ---------------- replay and idle hints ---------------- */
function replay(){
  logEv('replay'); lastAct = Date.now();
  if(!G.started) return;
  // Goal plus how: Emma cannot read, so the replay always says what to do with her hands as well.
  const how = [].concat(G.how || []).filter(id => !G.goal.includes(id));
  say(G.goal.concat(how)); document.querySelectorAll('.glow').forEach(g => { g.classList.remove('glow'); void g.getBoundingClientRect(); g.classList.add('glow'); });
}
setInterval(() => {
  if(!G.started || FAST || bookOpen || drag || G.busy || !G.hint) return;
  if(A.speaking){ lastAct = Date.now(); return; }
  // After she has acted the hint waits longer, so it helps when she is stuck but does not nag.
  // It is never spoken while berries are on the plate or water is in the jug (design: no count help mid-answer).
  if(G.acted && ((G.feed && G.step === 'feed' && G.feed.plate.length) || (G.bath && G.step === 'bath' && G.bath.pour.length))) return;
  if(Date.now() - lastAct < (G.acted ? Math.max(G.idleMs, 20000) : G.idleMs)) return;
  lastAct = Date.now(); logEv('idle-hint'); say(G.how); G.hint();
  G.idleMs = Math.min(G.idleMs * 2, 60000); // each repeat waits twice as long, so the hint never nags
}, 500);

/* ---------------- start ---------------- */
let PRELOAD = null;
function preloadAll(){
  if(PRELOAD) return PRELOAD;
  const gs = new Set(); Object.values(W).forEach(w => w.g.forEach(g => gs.add(g))); TRAYS.flat().forEach(g => gs.add(g));
  PRELOAD = fetch('audio/lines.json').then(r => r.json()).then(j => j.lines.map(l => l.id)).catch(() => [])
    .then(ids => Promise.all([A.preload(ids), A.preloadSounds([...gs])])).catch(e => console.warn('[fluffle] preload', e));
  return PRELOAD;
}
const playBtn = $('playBtn');
playBtn.addEventListener('pointerup', async () => {
  if(G.started || playBtn.classList.contains('wait')) return;
  A.unlock();
  playBtn.classList.add('wait');
  await Promise.race([preloadAll(), wait(4500)]);
  begin();
});
function begin(){
  G.started = true; $('start').classList.add('hidden'); logEv('play');
  const resumed = SAVE.cur && SAVE.cur.name;
  startDay();
  if(resumed){ $('nameSign').textContent = cap1(SAVE.cur.name); $('nameSign').classList.add('on'); setStage(BABY, SAVE.cur.stage || 0); }
  if(resumed && SAVE.cur.day === 1) G.si = G.steps.indexOf('wish1') - 1;
  flow(async (r) => {
    if(!G.welcomed){ G.welcomed = true; await say('welcome'); }
    if(r !== RUN) return;
    next();
  });
}
// start screen: a sleepy baby Fluffle
(function(){ const s = $('startFluff'); s.innerHTML = '<div class="fluff" style="position:relative"><div class="inner"></div></div>'; const f = makeFluff(s.firstChild); setKind(f, 'mint'); setStage(f, 1); f.el.style.transform = 'none'; })();
loadGame();
drawHearts(); setKind(BABY, (SAVE.cur && SAVE.cur.kind) || 'mint');

/* ---------------- test hook ---------------- */
function ensureBaby(day){
  if(!SAVE.cur) newBaby();
  if(!SAVE.cur.name) SAVE.cur.name = allowedNames().includes('mip') ? 'mip' : allowedNames()[0];
  if(day) SAVE.cur.day = day;
  SAVE.cur.stage = Math.max(0, Math.min(3, SAVE.cur.day - 2));
  setKind(BABY, SAVE.cur.kind); setStage(BABY, Math.min(3, SAVE.cur.stage)); $('nameSign').textContent = cap1(SAVE.cur.name); $('nameSign').classList.add('on');
}
function gotoStep(step){
  if(!ALL_STEPS.includes(step)) throw new Error('unknown step ' + step);
  if(!G.started){ G.started = true; G.welcomed = true; $('start').classList.add('hidden'); }
  closeBook(); G.sleeping = false; BABY.el.style.opacity = '1';
  if(step === 'arrival' || step === 'pomdemo' || step === 'naming'){ if(!SAVE.cur || SAVE.cur.name) newBaby(); SAVE.cur.day = 1; if(step === 'naming') SAVE.seen.pomdemo = true; if(step === 'pomdemo') SAVE.seen.pomdemo = false; }
  else if(step === 'morning') ensureBaby(Math.max(2, Math.min(3, (SAVE.cur && SAVE.cur.name && SAVE.cur.day) || 2)));
  else if(step === 'grown') ensureBaby(4);
  else ensureBaby();
  startDay();
  if(!G.steps.includes(step)) G.steps.splice(1, 0, step);
  G.si = G.steps.indexOf(step) - 1; next();
  return step;
}
function correctAction(){
  const s = G.step, ph = G.phase;
  if(s === 'arrival' && ph === 'tap'){ tapBasket(); return 'basket'; }
  if(s === 'naming' && G.naming){
    const N = G.naming;
    if(N.phase === 'build'){ const ok = allowedNames(); const n = ok.find(x => x.startsWith(N.slots.filter(Boolean).join(''))) || ok[0]; placeGem(N.active, n[N.active]); return 'gem'; }
    if(N.phase === 'slide' && SL){ SL.finished = true; SL.done(); return 'slide'; }
    if(N.phase === 'heart'){ flow(confirmName); return 'heart'; }
  }
  if((s === 'wish1' || s === 'wish2' || s === 'bedtime') && G.wish){
    if(ph === 'read'){ if(SL){ SL.finished = true; } G.phase = 'read'; flow(opened); return 'read'; }
    if(ph === 'pick'){ const el = itemEl(G.wish.word); const c = carryEl(art(G.wish.word), BABY.x, BABY.y); el.classList.add('away'); judge(el, G.wish.word, c); return 'give:' + G.wish.word; }
    if(ph === 'tobed'){ flow(goToBed); return 'bed'; }
  }
  if(s === 'feed' && G.feed && ph === 'plate'){
    const f = G.feed; while(f.plate.length > f.need) berryOff(f.plate[f.plate.length - 1]);
    while(f.plate.length < f.need){ const b = $('bowl').querySelector('.berry') || addHeapBerry(); berryToPlate(b); }
    flow(handOver); return 'plate:' + f.need;
  }
  if(s === 'bath' && G.bath){
    if(ph === 'totub'){ flow(intoTub); return 'tub'; }
    if(ph === 'pour'){ const live = [...$('soaps').children].filter(e => !e.classList.contains('used')); const t = G.bath.target - (G.bath.pour[0] ? +G.bath.pour[0].dataset.n : 0);
      const a = G.bath.pour[0] ? live.find(e => +e.dataset.n === t) : live.find(e => live.some(o => o !== e && +o.dataset.n + +e.dataset.n === G.bath.target));
      if(a) flow(r => pourSoap(r, a)); return 'pour:' + (a && a.dataset.n); }
    if(ph === 'jugfull'){ flow(pourJug); return 'jug'; }
  }
  if(s === 'night' && ph === 'moon'){ tapMoon(); return 'moon'; }
  if((s === 'morning' || s === 'grown') && ph === 'wake'){ flow(wake); return 'wake'; }
  return 'nothing to do (step ' + s + ', phase ' + ph + ')';
}
function wrongAction(){
  const s = G.step, ph = G.phase;
  if((s === 'wish1' || s === 'wish2' || s === 'bedtime') && ph === 'pick'){ const el = (G.wish.bed ? [...toysEl.children] : [...shelf.children]).find(e => e.dataset.w !== G.wish.word && !e.classList.contains('gone')); const c = carryEl(art(el.dataset.w), BABY.x, BABY.y); el.classList.add('away'); judge(el, el.dataset.w, c); return 'give:' + el.dataset.w; }
  if(s === 'feed' && ph === 'plate'){ const f = G.feed; while(f.plate.length < f.need + 1){ const b = $('bowl').querySelector('.berry') || addHeapBerry(); berryToPlate(b); } flow(handOver); return 'plate:' + (f.need + 1); }
  if(s === 'bath' && ph === 'pour'){ const live = [...$('soaps').children].filter(e => !e.classList.contains('used')); for(const a of live) for(const b of live) if(a !== b && +a.dataset.n + +b.dataset.n !== G.bath.target){ flow(async r => { await pourSoap(r, a); await pourSoap(r, b); }); return 'pour:' + a.dataset.n + '+' + b.dataset.n; } }
  return 'no wrong action here';
}
window.__game = {
  get state(){ return { step: G.step, phase: G.phase, day: SAVE.cur && SAVE.cur.day, baby: SAVE.cur && { ...SAVE.cur }, steps: G.steps.slice(), hearts: G.hearts.slice(), levels: { ...SAVE.levels }, streak: { ...SAVE.streak },
    wish: G.wish && { kind: G.wish.kind, word: G.wish.word, golden: G.wish.golden, level: 'L' + G.wish.group + 'abcd'[G.wish.sub], items: G.wish.items, wrongs: G.wish.wrongs, helped: G.wish.helped },
    feed: G.feed && { level: 'F' + (G.feed.lv + 1), need: G.feed.need, full: G.feed.full, onPlate: G.feed.plate.length, wrongs: G.feed.wrongs },
    bath: G.bath && { level: 'B' + (G.bath.lv + 1), target: G.bath.target, splats: G.bath.splats, wrongs: G.bath.wrongs, soaps: [...$('soaps').children].map(e => +e.dataset.n) },
    naming: G.naming && { slots: G.naming.slots.slice(), phase: G.naming.phase }, busy: G.busy, lastSaid: G.lastSaid, tree: SAVE.tree.map(t => t.name), missingAudio: (A.missing || []).slice() }; },
  log: G.log,
  steps: ALL_STEPS.slice(),
  goto: gotoStep,
  setLevel(strand, n){ if(!(strand in SAVE.levels)) throw new Error('strand is blend, count or bonds'); SAVE.levels[strand] = Math.max(0, Math.min(MAXLV[strand], n)); SAVE.streak[strand] = 0; saveGame(); return { ...SAVE.levels }; },
  setDay(n){ if(n > 1) ensureBaby(Math.min(4, n)); return gotoStep(n >= 4 ? 'grown' : n <= 1 ? 'arrival' : 'morning'); },
  fast(on = true){ FAST = !!on; return FAST; },
  mute(on = true){ MUTED = !!on; A.mute(MUTED); return MUTED; },
  reset(){ clearSave(); RUN++; location.reload(); },
  save: saveGame, load: loadGame,
  answer: correctAction, wrong: wrongAction,
  arrival: () => gotoStep('arrival'), pomdemo: () => gotoStep('pomdemo'), naming: () => gotoStep('naming'), wish1: () => gotoStep('wish1'), feed: () => gotoStep('feed'),
  wish2: () => gotoStep('wish2'), bath: () => gotoStep('bath'), bedtime: () => gotoStep('bedtime'), night: () => gotoStep('night'), morning: () => gotoStep('morning'), grown: () => gotoStep('grown'),
  play(){ if(!G.started){ A.unlock(); begin(); } return true; }
};
