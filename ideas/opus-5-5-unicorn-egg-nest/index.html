<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Unicorn Egg Nest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --night1:#11163d; --night2:#26296b; --moss:#2f6b4f; --moss2:#1d4a37;
  --pink:#ff8fc7; --pink2:#ff5fae; --blue:#5cb8ff; --blue2:#2f8be6;
  --cream:#fff6dd; --gold:#ffd25e;
}
*{box-sizing:border-box}
html,body{
  margin:0;height:100%;overflow:hidden;
  background:linear-gradient(#0f1438 0%,#23276a 48%,#1b4a39 52%,#10291f 100%);
  overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
  font-family:'Andika','Chalkboard SE','Comic Sans MS',system-ui,sans-serif;
  color:#3a2346;
}
/* body is the clipping box for the stage and its letterbox bands, so the page never scrolls */
body{position:fixed;inset:0;overflow:clip}
/* The stage keeps a fixed 1180x820 layout and is scaled to fit. On taller or shorter screens the scene
   colours continue past its top and bottom edges (box-shadow bands), so there is no hard seam. */
#stage{position:absolute;left:0;top:0;width:1180px;height:820px;transform-origin:0 0;overflow:visible;
  box-shadow:0 -1620px 0 800px #11163d,0 1620px 0 800px #1d4a37;
  background:
    radial-gradient(ellipse 420px 260px at 590px 470px, rgba(140,255,190,.18), transparent 70%),
    linear-gradient(#11163d 0%,#26296b 46%,#2b4d6e 62%,#2f6b4f 63%,#1d4a37 100%);}
.layer{position:absolute;inset:0;pointer-events:none}
button{font:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-appearance:none;appearance:none}
.hidden{display:none!important}

/* sky */
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
.firefly{position:absolute;width:10px;height:10px;border-radius:50%;background:#fff7a8;
  box-shadow:0 0 10px 4px rgba(255,240,120,.8),0 0 26px 10px rgba(255,220,90,.35);
  animation:flyA 9s ease-in-out infinite, blink 2.6s ease-in-out infinite}
@keyframes flyA{0%,100%{transform:translate(0,0)}25%{transform:translate(30px,-24px)}50%{transform:translate(-10px,-46px)}75%{transform:translate(-34px,-10px)}}
@keyframes blink{0%,100%{opacity:.2}45%,60%{opacity:1}}
#shootingStar{position:absolute;left:-200px;top:60px;width:180px;height:6px;border-radius:6px;
  background:linear-gradient(90deg,transparent,#fff 80%,#fffbd0);filter:drop-shadow(0 0 8px #fff);opacity:0}

/* top bar */
#speaker{position:absolute;left:372px;top:18px;width:96px;height:96px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff 0,#ffe7f4 40%,#ffb6dc 100%);
  box-shadow:0 6px 0 #d878ad,0 0 30px rgba(255,180,230,.55);z-index:92;display:grid;place-items:center}
#speaker:active{transform:translateY(4px);box-shadow:0 2px 0 #d878ad}
#speaker svg{width:58px;height:58px}
#speaker.talking svg .wave{animation:wave 0.9s ease-in-out infinite}
@keyframes wave{0%,100%{opacity:.35}50%{opacity:1}}
#progress{position:absolute;left:900px;top:26px;display:flex;gap:16px;z-index:5}
#progress .pe{width:56px;height:70px;transition:transform .4s}
#progress .pe.done{transform:scale(1.15)}

/* basket */
#basket{position:absolute;left:14px;top:176px;width:310px;height:630px}
/* meadow */
#meadow{position:absolute;left:846px;top:0;width:334px;height:820px}
#meadow::after{content:"";position:absolute;left:0;right:-800px;top:calc(100% - 2px);height:1600px;background:#489261}
.mbaby{position:absolute;width:160px;height:200px}
.mbaby .walker{position:absolute;inset:0;animation:walk 9s ease-in-out infinite}
.mbaby .flipper{width:150px;height:140px;animation:flip 9s step-end infinite}
.mbaby .hopper{width:150px;height:140px;animation:hop .55s ease-in-out infinite alternate}
@keyframes walk{0%,100%{transform:translateX(-14px)}45%,50%{transform:translateX(26px)}95%{transform:translateX(-14px)}}
@keyframes flip{0%{transform:scaleX(1)}47%{transform:scaleX(-1)}97%{transform:scaleX(1)}}
@keyframes hop{from{transform:translateY(0)}to{transform:translateY(-10px)}}
.tag{position:absolute;left:50%;transform:translateX(-50%);background:linear-gradient(#fffaf0,#ffe8c7);
  border:4px solid #e5a65a;border-radius:18px;padding:0 16px;font-weight:700;color:#5b2d6e;white-space:nowrap;
  box-shadow:0 5px 0 #c98a46}
.mbaby .tag{top:142px;font-size:30px;line-height:40px}

/* nest + egg */
#nestBack,#nestFront{position:absolute;left:380px;top:290px;width:420px;height:170px}
#egg{position:absolute;left:495px;top:104px;width:190px;height:240px;transform-origin:50% 92%;
  animation:eggIdle 3.2s ease-in-out infinite;filter:drop-shadow(0 0 22px rgba(255,255,255,.25))}
#egg svg{width:100%;height:100%;overflow:visible}
@keyframes eggIdle{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg) translateY(-3px)}}
#egg.wiggle{animation:wiggle .7s ease-in-out 2}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
#egg.shiver{animation:shiver .09s linear 12}
@keyframes shiver{0%,100%{transform:translateX(-3px)}50%{transform:translateX(3px)}}
#egg.wobble{animation:wobble .32s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(-10deg) scale(1.02)}50%{transform:rotate(10deg) scale(1.05)}}
#egg.dropin{animation:dropin .9s cubic-bezier(.3,1.4,.5,1) 1}
@keyframes dropin{0%{transform:translateY(-420px) scale(.6);opacity:0}60%{opacity:1}100%{transform:translateY(0) scale(1)}}
#egg .cheek{transition:fill .3s, transform .3s;transform-box:fill-box;transform-origin:center}
#egg.hot .cheek{fill:#ff3f6c;transform:scale(1.5)}
#egg.hot{filter:drop-shadow(0 0 26px rgba(255,90,90,.75))}
.frost{opacity:0;transition:opacity .4s}
#egg.cold .frost{opacity:.6}
#egg.cold{filter:drop-shadow(0 0 26px rgba(140,200,255,.8))}
.crack{opacity:0;transition:opacity .15s}
#egg.c1 .crack.k1,#egg.c2 .crack.k1,#egg.c2 .crack.k2,#egg.c3 .crack{opacity:1}
.eyes-open{opacity:0}
#egg.hot .eyes-shut{opacity:0} #egg.hot .eyes-open{opacity:1}
#egg.burst{animation:burst .45s ease-in forwards}
@keyframes burst{to{transform:scale(1.35);opacity:0;filter:brightness(3)}}

#tenframe{position:absolute;left:420px;top:452px;width:340px;height:132px;border-radius:30px;
  background:linear-gradient(#6b4a2a,#4a311b);border:5px solid #7fa55a;
  box-shadow:inset 0 0 0 4px rgba(0,0,0,.15),0 8px 0 #2d4a22,0 0 30px rgba(120,255,170,.15);
  display:grid;grid-template-columns:repeat(5,50px);grid-template-rows:50px 50px;gap:12px;
  justify-content:center;align-content:center}
#tenframe::before{content:"";position:absolute;left:-10px;right:-10px;top:-14px;height:24px;border-radius:20px;
  background:radial-gradient(circle at 10% 50%,#8fd16d 0 10px,transparent 11px),radial-gradient(circle at 30% 40%,#7cc25e 0 12px,transparent 13px),radial-gradient(circle at 55% 55%,#8fd16d 0 11px,transparent 12px),radial-gradient(circle at 78% 45%,#7cc25e 0 12px,transparent 13px),radial-gradient(circle at 94% 55%,#8fd16d 0 10px,transparent 11px)}
.spot{width:50px;height:50px;border-radius:50%;background:#1b1f45;border:3px solid #39407a;
  box-shadow:inset 0 4px 10px rgba(0,0,0,.6);transition:background .25s, box-shadow .25s, border-color .25s}
.spot.lit{background:radial-gradient(circle at 38% 32%,#fffbe6 0,var(--tint) 55%,var(--tintd) 100%);
  border-color:#fff3c4;box-shadow:0 0 18px 6px var(--glow)}
.spot.moon{background:radial-gradient(circle at 38% 32%,#ffffff 0,#cfdcff 55%,#8fa3e0 100%);border-color:#eef3ff;
  box-shadow:0 0 18px 6px rgba(190,210,255,.7)}
.spot.pop{animation:spotPop .4s cubic-bezier(.3,1.8,.5,1)}
@keyframes spotPop{0%{transform:scale(.4)}100%{transform:scale(1)}}
.spot.want{animation:want 1s ease-in-out 3}
@keyframes want{50%{border-color:#fff;box-shadow:0 0 0 6px rgba(255,255,255,.45)}}
.spot.shimmer{animation:shimmer .5s ease-in-out infinite alternate}
@keyframes shimmer{to{filter:brightness(1.5);transform:scale(1.1)}}

.slot{position:absolute;width:112px;height:112px;border-radius:50%;
  border:5px dashed rgba(255,230,160,.55);background:radial-gradient(circle,rgba(255,210,120,.18),rgba(255,210,120,.03) 70%);
  animation:slotBreath 2.4s ease-in-out infinite}
@keyframes slotBreath{50%{border-color:rgba(255,240,190,.9)}}

/* stones */
.stone{position:absolute;width:104px;height:104px;border-radius:46% 50% 44% 52%;touch-action:none;z-index:20;
  background:radial-gradient(circle at 30% 24%,var(--tintl) 0,var(--tint) 40%,var(--tintd) 100%);
  box-shadow:0 0 26px 8px var(--glow),inset -6px -8px 0 rgba(0,0,0,.12);
  transition:left .7s cubic-bezier(.4,1.3,.5,1),top .7s cubic-bezier(.4,1.3,.5,1),opacity .5s,transform .3s;
  animation:stoneGlow 2.2s ease-in-out infinite}
@keyframes stoneGlow{50%{box-shadow:0 0 36px 12px var(--glow),inset -6px -8px 0 rgba(0,0,0,.12)}}
.stone.dragging{transition:none;transform:scale(1.12);z-index:80}
.stone.rolling{animation:roll .8s ease-out}
@keyframes roll{from{transform:rotate(0)}to{transform:rotate(-360deg)}}
.stone .pips{position:absolute;left:15px;top:15px;width:74px;height:74px;display:grid;
  grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);place-items:center}
.pip{width:20px;height:20px;border-radius:50%;background:#fffdf4;box-shadow:0 0 0 3px rgba(110,45,10,.6),0 0 10px 3px rgba(255,255,220,.8);transition:all .25s}
.pip.spent{background:rgba(90,45,15,.4);box-shadow:0 0 0 3px rgba(110,45,10,.25)}
.stone.gone{opacity:0;transform:scale(.3)}
#stage.busy .stone{pointer-events:none}

/* hatchling */
#hatchling{position:absolute;left:460px;top:120px;width:260px;height:250px;z-index:30;pointer-events:none}
#hatchling svg{width:100%;height:100%;overflow:visible}
.pop-in{animation:popIn .8s cubic-bezier(.3,1.7,.5,1)}
@keyframes popIn{0%{transform:scale(0) translateY(60px)}100%{transform:scale(1)}}
.uni{width:100%;height:100%;display:block;overflow:visible}
.uni .u-head{transform-box:view-box;transform-origin:150px 115px;transition:transform .5s}
.uni.look-up .u-head{transform:rotate(-12deg)}
.uni .u-eye{transform-box:fill-box;transform-origin:center;animation:eyeBlink 4.5s infinite}
@keyframes eyeBlink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.happy{animation:happy .5s ease-in-out 3}
@keyframes happy{50%{transform:translateY(-30px) rotate(-4deg)}}

/* fx */
#fx{z-index:90}
.spark{position:absolute;font-size:28px;line-height:1;will-change:transform,opacity}
.puff{position:absolute;border-radius:50%;background:rgba(255,255,255,.85);filter:blur(2px)}
.confetti{position:absolute;width:14px;height:20px;border-radius:4px}
.shard{position:absolute;width:70px;height:60px}
#hand{position:absolute;left:0;top:0;width:90px;height:90px;font-size:80px;line-height:90px;text-align:center;z-index:95;
  pointer-events:none;opacity:0;filter:drop-shadow(0 6px 6px rgba(0,0,0,.4))}
.ghost{position:absolute;left:0;top:0;opacity:.65;z-index:94;pointer-events:none}

/* overlays */
.overlay{position:absolute;inset:0;z-index:70}
/* Overlay backdrops are ::before layers that reach 1600px past the stage, so letterbox bands match. */
.overlay::before{content:"";position:absolute;left:-800px;right:-800px;top:-1600px;bottom:-1600px;z-index:-1;pointer-events:none}
#start{z-index:100;display:grid;place-items:center}
#start::before{background:radial-gradient(circle 742px at 1390px 1969px,rgba(60,50,140,.35),rgba(10,12,40,.85))}
#playBtn{position:absolute;left:470px;top:300px;width:240px;height:240px;border-radius:50%;
  background:radial-gradient(circle at 35% 28%,#fff 0,#ffc8e6 30%,#ff7fbf 75%,#e7559e 100%);
  box-shadow:0 12px 0 #b93e7c,0 0 70px 20px rgba(255,140,210,.55);display:grid;place-items:center;
  animation:playPulse 1.6s ease-in-out infinite}
#playBtn svg{width:120px;height:120px;margin-left:18px}
@keyframes playPulse{50%{transform:scale(1.07)}}
#startEgg{position:absolute;left:160px;top:300px;width:200px;height:250px;animation:eggIdle 3s ease-in-out infinite}
#startUni{position:absolute;left:800px;top:330px;width:260px;height:240px}
#startTitle{position:absolute;left:0;right:0;top:120px;text-align:center;font-size:58px;font-weight:700;color:#fff3fb;
  text-shadow:0 4px 0 #b4458a,0 0 30px rgba(255,150,220,.6);letter-spacing:1px}

#naming::before{background:rgba(12,14,45,.62)}
#nbaby{position:absolute;left:60px;top:200px;width:380px;height:350px}
#nbaby svg{width:100%;height:100%;overflow:visible}
#board{position:absolute;left:480px;top:70px;width:680px;height:450px;border-radius:44px;
  background:linear-gradient(#fff5fb,#ffe0ef);border:8px solid #ffffff;box-shadow:0 14px 0 #c86aa0,0 0 60px rgba(255,170,220,.45)}
#board::after{content:"✦  ☾  ✦";position:absolute;top:-34px;left:50%;transform:translateX(-50%);font-size:34px;color:#ffe48a;
  text-shadow:0 0 12px #fff2b0}
.nslot{position:absolute;top:44px;width:150px;height:150px;border-radius:34px;display:grid;place-items:center;
  font-size:118px;font-weight:700;line-height:1;transition:transform .25s}
.nslot.c{background:#d8ecff;border:7px dashed #5cb8ff;color:#1d5fa8}
.nslot.v{background:#ffe0f0;border:7px dashed #ff7fbf;color:#b8236f}
.nslot.filled{border-style:solid}
.nslot.c.filled{background:linear-gradient(#e9f5ff,#b9ddff)}
.nslot.v.filled{background:linear-gradient(#fff0f8,#ffc3e2)}
.nslot.bump{animation:bump .4s}
.nslot.no{animation:no .45s}
.nslot.say{transform:scale(1.15)}
@keyframes bump{50%{transform:scale(1.18)}}
@keyframes no{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
#blend{position:absolute;left:40px;top:224px;width:600px;height:190px;touch-action:none}
#blend .dot{position:absolute;top:8px;width:30px;height:30px;border-radius:50%;background:#e0c2d6;transition:all .2s}
#blend .dot.on{background:#ff5fae;box-shadow:0 0 14px 4px rgba(255,95,174,.6);transform:scale(1.3)}
#blend .track{position:absolute;left:10px;right:70px;top:84px;height:30px;border-radius:15px;background:#f3c6df}
#blend .head{position:absolute;right:16px;top:64px;width:0;height:0;border-left:66px solid #f3c6df;border-top:35px solid transparent;border-bottom:35px solid transparent}
#blend.ready .track{background:#ff8fc7;box-shadow:0 0 18px rgba(255,120,190,.7)}
#blend.ready .head{border-left-color:#ff8fc7}
#blend .knob{position:absolute;left:-14px;top:50px;width:100px;height:100px;font-size:86px;line-height:100px;text-align:center;
  filter:drop-shadow(0 4px 4px rgba(150,60,110,.45));opacity:.35;transition:opacity .3s}
#blend.ready .knob{opacity:1;animation:knob 1.2s ease-in-out infinite}
#blend.ready.sliding .knob{animation:none}
@keyframes knob{50%{transform:scale(1.15) rotate(12deg)}}
#tray{position:absolute;left:62px;top:604px;width:1056px;height:120px;display:flex;gap:8px;align-items:center;justify-content:center}
#tray .gap{width:16px;flex:0 0 16px}
.gem{width:96px;height:104px;flex:0 0 96px;border-radius:26px;display:grid;place-items:center;font-size:72px;font-weight:700;line-height:1;
  touch-action:none;position:relative;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.gem.c{background:linear-gradient(145deg,#a8dbff 0,#4aa8f5 50%,#2a78d0 100%);box-shadow:0 7px 0 #1f5fa8,inset 0 4px 0 rgba(255,255,255,.5)}
.gem.v{background:linear-gradient(145deg,#ffc6e6 0,#ff79bd 50%,#e0479a 100%);box-shadow:0 7px 0 #b02e74,inset 0 4px 0 rgba(255,255,255,.5)}
.gem::after{content:"";position:absolute;left:12px;top:10px;width:22px;height:12px;border-radius:50%;background:rgba(255,255,255,.65);transform:rotate(-25deg)}
.gem.tap{animation:bump .35s}
.gem.flying{position:absolute;z-index:85;pointer-events:none}

#finale::before{background:linear-gradient(#141a4a 1600px,#2c2f7a 1928px,#3f6f8f 2051px,#5aa36f 2059px,#3d8556 2420px)}
#fnest{position:absolute;left:40px;top:430px;width:300px;height:190px}
#horseshoe{position:absolute;left:120px;top:300px;width:150px;height:150px;opacity:0}
.fbaby{position:absolute;width:250px;height:330px;transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.fbaby .unibox{position:absolute;left:10px;top:0;width:230px;height:210px}
.fbaby .unibox svg{width:100%;height:100%;overflow:visible}
.fbaby .unibox{transition:transform .45s cubic-bezier(.3,1.5,.5,1)}
.fbaby.hiding .unibox{transform:translateY(118px)}
.fbaby .bush{position:absolute;left:-6px;top:116px;width:262px;height:116px;transform-origin:50% 100%;transition:transform .5s,opacity .5s}
.fbaby.hiding .bush{animation:rustle 3.4s ease-in-out infinite}
.fbaby.peek .bush{animation:rustle .5s ease-in-out}
.fbaby.found .bush{transform:scale(.3);opacity:0}
@keyframes rustle{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(-2.5deg)}95%{transform:rotate(2.5deg)}}
.fbaby .ftag{position:absolute;left:5px;top:214px;width:240px;height:110px;border-radius:26px;touch-action:none;
  background:linear-gradient(#fffaf0,#ffe6c0);border:5px solid #e5a65a;box-shadow:0 7px 0 #c98a46}
.ftag .fl{position:absolute;top:2px;width:56px;text-align:center;font-size:58px;font-weight:700;color:#5b2d6e;transition:transform .2s,color .2s}
.ftag .fl.say{transform:scale(1.25);color:#e0479a}
.ftag .fd{position:absolute;top:70px;width:16px;height:16px;border-radius:50%;background:#ff5fae;opacity:0;transition:opacity .2s}
.ftag.dots .fd{opacity:1}
.ftag .farrow{position:absolute;left:30px;right:30px;top:92px;height:6px;border-radius:3px;background:#ffb3d6;opacity:0}
.ftag.dots .farrow{opacity:1}
.fbaby.front{transform:translateY(60px) scale(1.28);z-index:10}
.trick-buck .unibox svg{animation:buck .35s ease-in-out 4 alternate;transform-origin:80% 95%}
@keyframes buck{to{transform:rotate(16deg)}}
.trick-spin .unibox{animation:spin 1.1s cubic-bezier(.4,0,.3,1)}
@keyframes spin{0%{transform:translateY(0) rotate(0)}40%{transform:translateY(-120px) rotate(180deg)}80%{transform:translateY(0) rotate(360deg)}100%{transform:rotate(360deg)}}
.trick-sneeze .unibox{animation:sneeze .5s ease-in-out}
@keyframes sneeze{30%{transform:rotate(-8deg) translateY(-8px)}70%{transform:rotate(6deg)}}
.rainbow{position:absolute;width:300px;height:150px;pointer-events:none}
#againBtn{position:absolute;left:44px;top:686px;width:116px;height:116px;border-radius:50%;
  background:radial-gradient(circle at 35% 28%,#fff 0,#fff2b8 35%,#ffcf4d 80%);box-shadow:0 8px 0 #c98f12,0 0 40px rgba(255,220,100,.6);
  display:grid;place-items:center;z-index:5}
#againBtn svg{width:76px;height:76px}
#againBtn.pulse{animation:playPulse 1.6s ease-in-out infinite}
</style>
</head>
<body>
<div id="stage">
  <svg class="layer" id="bg" viewBox="0 0 1180 820" preserveAspectRatio="none"></svg>
  <div class="layer" id="sky"></div>
  <div id="shootingStar"></div>

  <div id="meadow"></div>
  <svg id="basket" viewBox="0 0 310 630"></svg>

  <svg id="nestBack" viewBox="0 0 420 170"></svg>
  <div id="egg"></div>
  <svg id="nestFront" viewBox="0 0 420 170"></svg>
  <div id="tenframe"></div>
  <div id="slots"></div>
  <div id="hatchling" class="hidden"></div>
  <div id="stones"></div>

  <div id="progress"></div>
  <button id="speaker" class="hidden" aria-label="Say it again">
    <svg viewBox="0 0 64 64"><path d="M10 24h10l14-12v40L20 40H10z" fill="#c2468a" stroke="#c2468a" stroke-width="3" stroke-linejoin="round"/>
      <path class="wave" d="M42 22c5 5 5 15 0 20" stroke="#c2468a" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path class="wave" d="M49 15c9 9 9 25 0 34" stroke="#c2468a" stroke-width="5" fill="none" stroke-linecap="round" style="animation-delay:.2s"/></svg>
  </button>

  <div id="naming" class="overlay hidden">
    <div id="nbaby"></div>
    <div id="board">
      <div class="nslot c" data-i="0" style="left:70px"></div>
      <div class="nslot v" data-i="1" style="left:257px"></div>
      <div class="nslot c" data-i="2" style="left:444px"></div>
      <div id="blend">

const hand = $('#hand');
async function ghostMove(from, to, carryHTML, carrySize, dur = 1300){
  G.demo = true;
  let ghost = null;
  if (carryHTML){ ghost = el('div', 'ghost', stage, carryHTML); ghost.style.width = carrySize + 'px'; ghost.style.height = carrySize + 'px'; }
  const tr = (p, ox, oy) => `translate(${p.x - ox}px,${p.y - oy}px)`;
  hand.style.opacity = 1;
  const hs = [{ transform: tr(from, 34, 4) }, { transform: tr(from, 34, 4), offset: .15 }, { transform: tr(to, 34, 4), offset: .85 }, { transform: tr(to, 34, 4) }];
  const ps = [];
  ps.push(anim(hand, hs, { duration: dur * DBG.speed, easing: 'ease-in-out', fill: 'forwards' }));
  if (ghost){ const gs = carrySize / 2; ps.push(anim(ghost, [{ transform: tr(from, gs, gs) }, { transform: tr(from, gs, gs), offset: .15 }, { transform: tr(to, gs, gs), offset: .85 }, { transform: tr(to, gs, gs) }], { duration: dur * DBG.speed, easing: 'ease-in-out', fill: 'forwards' })); }

const EGGS = [

const TINTS = ['#ffb340', '#ff8f6b', '#ff7fb0', '#ffd24a', '#ff9f45', '#f78bd0', '#ffc061'];
const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };

const NEST_ZONE = { x: 370, y: 90, w: 440, h: 650 };
function slotCentre(i){ return { x: 590 + (i - (G.slots - 1) / 2) * 124, y: 656 }; }
function stoneHomes(n){
  const rows = Math.ceil(n / 2), out = [], y0 = 500 - (rows - 1) * 64;
  for (let i = 0; i < n; i++){
    const r = Math.floor(i / 2), last = i === n - 1 && n % 2 === 1;
    out.push({ x: last ? 169 : (i % 2 ? 234 : 104), y: y0 + r * 128 });

/* ten-frame */
const spots = [];
function buildTenFrame(){ const tf = $('#tenframe'); tf.innerHTML = ''; spots.length = 0; for (let i = 0; i < 10; i++) spots.push(el('div', 'spot', tf)); }
function glowTotal(){ return G.moon + G.nest.reduce((a, s) => a + s.lit, 0); }
function renderSpots(){
  const want = [];
  for (let i = 0; i < G.moon; i++) want.push({ k: 'moon' });
  G.nest.forEach(s => { for (let k = 0; k < s.lit; k++) want.push({ k: 'lit', s }); });
  spots.forEach((sp, i) => {
    const w = want[i], was = sp.dataset.k || '';
    const now = w ? w.k + (w.s ? w.s.id : '') : '';
    if (now === was) return;
    sp.dataset.k = now;
    sp.classList.remove('lit', 'moon', 'pop');
    if (w){
      sp.classList.add(w.k);
      if (w.s){ sp.style.setProperty('--tint', w.s.tint); sp.style.setProperty('--tintd', shade(w.s.tint, -0.3)); sp.style.setProperty('--glow', rgba(w.s.tint, 0.75)); }
      void sp.offsetWidth; sp.classList.add('pop');
    }
  });
}

/* stones */
let stoneId = 0;
function makeStone(v, i, home){
  const s = { v, id: ++stoneId, tint: TINTS[i % TINTS.length], home, inNest: false, slot: -1, lit: 0 };
  s.el = el('div', 'stone', $('#stones'));
  s.el.dataset.v = v;
  s.el.style.setProperty('--tint', s.tint); s.el.style.setProperty('--tintl', shade(s.tint, 0.35)); s.el.style.setProperty('--tintd', shade(s.tint, -0.35)); s.el.style.setProperty('--glow', rgba(s.tint, 0.55));
  const pips = el('div', 'pips', s.el);
  s.pips = [];
  for (let c = 0; c < 9; c++){ const cell = el('div', '', pips); if (PIPS[v].includes(c)) s.pips.push(el('div', 'pip', cell)); }
  setPos(s, home);
  dragStone(s);
  return s;
}
function dragStone(s){
  s.el.addEventListener('pointerdown', e => {
    if (G.phase !== 'egg' || G.busy || G.dragging) return;
    e.preventDefault(); G.lastAct = Date.now();
    G.dragging = s;
    try { s.el.setPointerCapture(e.pointerId); } catch (err) {}
    const p0 = toStage(e), l0 = parseFloat(s.el.style.left), t0 = parseFloat(s.el.style.top);
    let moved = false;
    const move = ev => {
      const p = toStage(ev);
      if (!moved && Math.hypot(p.x - p0.x, p.y - p0.y) > 8){ moved = true; s.el.classList.add('dragging'); SFX.pluck(); }
      if (moved){ s.el.style.left = (l0 + p.x - p0.x) + 'px'; s.el.style.top = (t0 + p.y - p0.y) + 'px'; }
    };
    const up = ev => {
      s.el.removeEventListener('pointermove', move); s.el.removeEventListener('pointerup', up); s.el.removeEventListener('pointercancel', up);
      s.el.classList.remove('dragging'); G.dragging = null; G.lastAct = Date.now();
      if (!moved){ onStoneTap(s); return; }
      const c = { x: parseFloat(s.el.style.left) + 52, y: parseFloat(s.el.style.top) + 52 };
      onStoneDrop(s, c);
    };
    s.el.addEventListener('pointermove', move); s.el.addEventListener('pointerup', up); s.el.addEventListener('pointercancel', up);
  });
}
function inNestZone(p){ const z = NEST_ZONE; return p.x > z.x && p.x < z.x + z.w && p.y > z.y && p.y < z.y + z.h; }
function freeSlot(){ for (let i = 0; i < G.slots; i++) if (!G.nest.some(s => s.slot === i)) return i; return -1; }
function onStoneDrop(s, c){
  if (!s.inNest && inNestZone(c) && freeSlot() >= 0 && !G.busy) return placeStone(s);
  if (s.inNest){ setPos(s, slotCentre(s.slot)); return; }
  setPos(s, s.home);
}
function onStoneTap(s){
  if (s.inNest && !G.busy){ // take a stone back out of the nest
    takeOut([s]); return;
  }
  // tapping a basket stone: little bounce and its dots twinkle
  anim(s.el, [{ transform: 'scale(1)' }, { transform: 'scale(1.15)' }, { transform: 'scale(1)' }], { duration: 300 });
  SFX.pluck();
}
function takeOut(list){
  list.forEach(s => {
    G.nest = G.nest.filter(x => x !== s); s.inNest = false; s.slot = -1; s.lit = 0;
    s.pips.forEach(p => p.classList.remove('spent'));
    s.el.classList.remove('rolling'); void s.el.offsetWidth; s.el.classList.add('rolling');
    setPos(s, s.home);
  });
  renderSpots(); SFX.roll();
  return sleep(850);
}
function setBusy(b){ G.busy = b; stage.classList.toggle('busy', b); }

async function placeStone(s){
  setBusy(true); stopSpeech(); G.lastAct = Date.now();
  const slot = freeSlot();
  s.inNest = true; s.slot = slot; s.lit = 0;
  const before = glowTotal();
  G.nest.push(s);
  setPos(s, slotCentre(slot));
  await sleep(450);
  const egg = $('#egg');
  for (let k = 1; k <= s.v; k++){
    s.lit = k; s.pips[k - 1].classList.add('spent');
    const n = before + k;
    if (n <= 10){ renderSpots(); chime(n); sparkle(spotCentre(n - 1).x, spotCentre(n - 1).y, 4, ['✦']); await say('num-' + n); await sleep(80); }
    else { // overflow: the extra glow fizzes out of the frame
      SFX.sizzle(); egg.classList.add('hot'); overflowSpark(s.tint); await sleep(420);
    }
  }
  await resolveEgg(before + s.v, s);
}
function spotCentre(i){ const r = 452 + 5, col = i % 5, row = Math.floor(i / 5); return { x: 420 + 5 + 21 + col * 62 + 25 - 5, y: r + 6 + row * 62 + 25 }; }
function overflowSpark(tint){
  const d = el('div', 'puff', fx); d.style.width = d.style.height = '44px'; d.style.background = tint; d.style.boxShadow = `0 0 20px 8px ${rgba(tint, .7)}`;
  d.style.left = rnd(700, 760) + 'px'; d.style.top = '470px';
  anim(d, [{ transform: 'scale(.3)', opacity: 1 }, { transform: `translate(${rnd(20, 80)}px,-140px) scale(.9)`, opacity: 0 }], { duration: 900 }).then(() => d.remove());
  steam(2);
}
async function tooHot(){
  const egg = $('#egg'); egg.classList.add('hot'); SFX.steam(); steam(8);
  await say('too-hot'); await sleep(400);
}
async function stillCold(){
  const egg = $('#egg'); egg.className = ''; void egg.offsetWidth; egg.classList.add('cold', 'shiver'); SFX.shiver(); snow(12);
  await say('still-cold'); await sleep(300);
}
function clearEggMood(){ const egg = $('#egg'); egg.classList.remove('hot', 'cold', 'shiver', 'wiggle'); }
function bestStone(){
  const basket = G.stones.filter(s => !s.inNest && !s.used);
  const total = glowTotal();
  if (G.mode === 'free'){
    const need = 10 - total;
    return basket.find(s => s.v === need) || basket.filter(s => s.v < need && solvableAfter(s)).sort((a, b) => b.v - a.v)[0] || basket.find(s => s.v < need) || basket[0];
  }
  if (G.mode === 'one') return basket.find(s => s.v === 10 - G.moon);
  if (G.nest.length === 1) return basket.find(s => s.v === 10 - G.nest[0].v) || null;
  return basket.find(s => s.v === 4) || basket[0];
}
function canMake(target, vals){ // subset sum
  if (target === 0) return true; if (target < 0 || !vals.length) return false;
  return canMake(target - vals[0], vals.slice(1)) || canMake(target, vals.slice(1));
}
function solvable(){ const rest = G.stones.filter(s => !s.inNest && !s.used).map(s => s.v); return canMake(10 - glowTotal(), rest); }
function solvableAfter(s){ const rest = G.stones.filter(x => !x.inNest && !x.used && x !== s).map(x => x.v); return canMake(10 - glowTotal() - s.v, rest); }

async function resolveEgg(total, s){
  if (total === 10) return hatch();
  if (G.mode === 'free'){
    if (total > 10){
      await tooHot();
      await takeOut([s]); clearEggMood();
      G.mistakes++;
      await unstick();
      await say('hint-smaller');
      if (G.mistakes >= 2) await hintEgg(true);
    } else {
      await say('glows-' + total);
    }
  } else if (G.mode === 'one'){
    await say('glows-' + total);
    await stillCold();
    await takeOut([s]); clearEggMood();
    G.mistakes++;
    await hintEgg(demoEarned());
  } else { // pair
    if (G.nest.length < 2){ await say('glows-' + total); }
    else {
      if (total > 10) await tooHot(); else { await say('glows-' + total); await stillCold(); }
      puffAt(590, 656);
      await takeOut(G.nest.slice()); clearEggMood();
      G.mistakes++;
      await say('try-again');
      await hintEgg(demoEarned());
    }
  }
  setBusy(false); G.lastAct = Date.now();
}
async function demoStone(s, slotIdx){
  if (!s) return;
  const to = slotCentre(slotIdx != null ? slotIdx : Math.max(0, freeSlot()));
  const html = s.el.outerHTML.replace('class="stone', 'class="stone ghosted');
  await ghostMove(s.home, to, `<div style="position:relative;width:104px;height:104px">${html.replace(/style="[^"]*"/, `style="left:0;top:0;--tint:${s.tint};--tintl:${shade(s.tint, .35)};--tintd:${shade(s.tint, -0.35)};--glow:${rgba(s.tint, .55)}"`)}</div>`, 104);
  anim(s.el, [{ transform: 'scale(1)' }, { transform: 'scale(1.2)' }, { transform: 'scale(1)' }], { duration: 500, iterations: 2 });
}
/* When no stone in the basket can finish the egg, take stones out first, so a hint never shows a wrong move. */
async function unstick(){
  const was = G.busy; setBusy(true);
  if (G.mode === 'free'){
    while (!solvable() && G.nest.length){ await say('hint-stuck'); await takeOut([G.nest[G.nest.length - 1]]); }
  } else if (G.mode === 'pair' && G.nest.length === 1 && !bestStone()){
    await say('hint-stuck'); await takeOut(G.nest.slice());
  }
  setBusy(was);

function attachBlend(area, opts){

    if (opts.canStart && !opts.canStart()) return;
    e.preventDefault(); G.lastAct = Date.now();
    try { area.setPointerCapture(e.pointerId); } catch (err) {}
    const x0 = toStage(e).x, cs = opts.centres();
    let next = 0, done = false, maxX = x0;
    opts.onStart && opts.onStart(x0);
    const move = ev => {

      while (next < cs.length && x >= cs[next] - 24 && (cs[next] >= x0 - 24 || x > x0 + 16 * (next + 1))){ opts.onLetter(next); next++; }
      if (next === cs.length && x >= opts.endX() - 40 && maxX - x0 >= 60){ done = true; opts.onDone(); }
    };

      area.removeEventListener('pointermove', move); area.removeEventListener('pointerup', up); area.removeEventListener('pointercancel', up);
      G.lastAct = Date.now();

  });
}

  if (t === 'sneeze'){
    say('achoo'); SFX.achoo(); await sleep(250);
    const rb = el('div', 'rainbow', fx, `<svg viewBox="0 0 300 150">${['#ff6b6b', '#ffb84d', '#ffe66b', '#7ee08a', '#6bc6ff', '#a98bff'].map((c, k) => `<path d="M${20 + k * 12} 150 A${130 - k * 12} ${130 - k * 12} 0 0 1 ${280 - k * 12} 150" stroke="${c}" stroke-width="12" fill="none"/>`).join('')}</svg>`);
    rb.style.left = (r.x + r.w / 2 - 150) + 'px'; rb.style.top = (r.y - 90) + 'px';
    anim(rb, [{ transform: 'scale(0)', transformOrigin: '50% 100%', opacity: 1 }, { transform: 'scale(1)', opacity: 1, offset: .5 }, { transform: 'scale(1.1)', opacity: 0 }], { duration: 2200 }).then(() => rb.remove());
    sparkle(r.x + r.w * 0.9, r.y + r.h * 0.4, 16);
  } else { SFX.sparkle(); sparkle(r.x + r.w / 2, r.y + r.h / 2, 16); }
  await sleep(1300);
  say('wow');
  d.classList.remove('front');
  await sleep(600);
  d.querySelector('.ftag').classList.remove('dots');
  G.trickBusy = false; G.lastAct = Date.now();
  if (G.phase === 'meadow'){
    G.tricks++;
    // After a couple of tricks the replay button pulses and Elizabeth offers more eggs.
    if (G.tricks === 2){ $('#againBtn').classList.add('pulse'); await sleep(300); say('play-again'); }
  }
}
async function demoTag(tag){
  if (!tag) return; tag = tag.querySelector ? (tag.querySelector('.ftag') || tag) : tag;
  const r = rectInStage(tag);
  await ghostMove({ x: r.x + 20, y: r.y + 70 }, { x: r.x + r.w - 10, y: r.y + 70 }, null, 0, 1600);
}

/* ---------------- idle hints and the speaker ---------------- */
async function replayInstruction(){
  if (G.busy || G.demo) { anim($('#speaker'), [{ transform: 'scale(1)' }, { transform: 'scale(.9)' }, { transform: 'scale(1)' }], { duration: 250 }); return; }
  stopSpeech();
  if (G.phase === 'egg'){
    if (G.mistakes > 0) return hintEgg(demoEarned());
    if (G.mode === 'free'){ await say(G.line); await unstick(); await demoStone(bestStone()); }
    else { flashEmptySpots(); await say(G.line); if (demoEarned()) await hintEgg(true); }
  } else if (G.phase === 'naming'){
    if (G.letters.every(Boolean)){ await say('name-slide'); await demoSlide(); }
    else { await say(G.line === 'name-wrong' ? 'name-wrong' : 'name-intro'); await demoGem(); }
  } else if (G.phase === 'seek'){
    await askSeek(); if (G.seekMiss >= 2 || G.idle >= 2) await demoTag(targetEl());
  } else if (G.phase === 'meadow'){
    await say('meadow-call'); await demoTag(fbabyEls()[G.tricks % 3]);
  }
  G.lastAct = Date.now();
}
setInterval(() => {
  if (G.busy || G.demo || G.dragging || G.blending || G.trickBusy) return;
  if (!['egg', 'naming', 'seek', 'meadow'].includes(G.phase)) return;
  if (Date.now() - G.lastAct < 8000) return;
  G.lastAct = Date.now();
  if (G.phase === 'egg'){ G.idle++; hintEgg(G.mode === 'free' || demoEarned()); }
  else { G.idle++; replayInstruction(); }
}, 500);
stage.addEventListener('pointerdown', () => { G.lastAct = Date.now(); }, true);
$('#speaker').addEventListener('pointerup', e => { e.preventDefault(); replayInstruction(); });

/* ---------------- start / again ---------------- */
function unlockAudio(){
  initAudio();
  try { voiceEl.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA='; const p = voiceEl.play(); p && p.catch && p.catch(() => {}); } catch (e) {}
  try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) {}
}
$('#playBtn').addEventListener('pointerup', async e => {
  e.preventDefault();
  if (G.phase !== 'start') return;
  G.phase = 'starting';
  unlockAudio(); startMusic(); SFX.sparkle();
  const st = $('#start');
  await anim(st, [{ opacity: 1 }, { opacity: 0 }], { duration: 500 * DBG.speed });
  st.classList.add('hidden'); $('#speaker').classList.remove('hidden');
  startEgg(0, true);
});
$('#againBtn').addEventListener('pointerup', async e => {
  e.preventDefault();
  if (G.phase !== 'meadow' || G.trickBusy) return;
  stopSpeech(); SFX.sparkle();
  G.babies = []; $('#meadow').querySelectorAll('.mbaby').forEach(m => m.remove());
  $('#horseshoe').style.opacity = 0;
  await anim($('#finale'), [{ opacity: 1 }, { opacity: 0 }], { duration: 500 * DBG.speed });
  $('#finale').classList.add('hidden');
  startEgg(0, false);
});
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

buildScenery();
setupNamingBlend();
buildTenFrame();
$('#egg').innerHTML = eggSVG(EGGS[0].col, 'e0');

/* ---------------- tiny debug hook ---------------- */
window.__game = {
  get state(){
    return { phase: G.phase, egg: G.egg + 1, mode: G.mode, glows: glowTotal(), moon: G.moon, nest: G.nest.map(s => s.v),
      basket: G.stones.filter(s => !s.inNest && !s.used).map(s => s.v), mistakes: G.mistakes, busy: G.busy,
      letters: G.letters.slice(), babies: G.babies.map(b => b.name), tricks: G.tricks, line: G.line, target: G.target || null,
      hiding: fbabyEls().filter(d => d.classList.contains('hiding')).map(d => d.dataset.name) };
  },
  debug: DBG,
  lines: LINES,
  drop(v){ const s = G.stones.find(s => s.v === v && !s.inNest && !s.used); if (!s || G.busy || G.phase !== 'egg') return false; placeStone(s); return true; },
  name(word){ if (G.phase !== 'naming') return false; word.split('').forEach((l, i) => { G.letters[i] = l; const s = slotEls()[i]; s.textContent = l; s.classList.add('filled'); }); readyToBlend(); return true; },
  blend(){ if (G.phase !== 'naming' || !G.letters.every(Boolean)) return false; finishName(); return true; },
  // call(i): slide along the sign of the baby at bush i (left to right). seekTarget(): the bush that hides the wanted baby.
  call(i){ const d = fbabyEls()[i]; if (!d || !['seek', 'meadow'].includes(G.phase) || G.trickBusy) return false; tagDone(d); return true; },
  seekTarget(){ return fbabyEls().indexOf(targetEl()); }
};
</script>
