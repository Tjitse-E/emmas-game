<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Actors harness</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cdeeff; font: 13px/1.2 -apple-system, system-ui, sans-serif; }
  #app { position: fixed; inset: 0; touch-action: none; }
  #app canvas { display: block; }
  #panel { position: fixed; top: 6px; right: 6px; bottom: 6px; width: 228px; overflow-y: auto; background: rgba(255, 255, 255, 0.82);
    border-radius: 12px; padding: 6px; box-sizing: border-box; -webkit-overflow-scrolling: touch; }
  #panel.hidden { display: none; }
  #panel h3 { margin: 8px 2px 4px; font-size: 12px; color: #a0457a; }
  #panel button { margin: 2px; padding: 6px 7px; border: 0; border-radius: 8px; background: #ffd7ea; color: #5a2346; font: inherit; }
  #panel button:active { background: #ffb3d6; }
  #perf { position: fixed; left: 6px; bottom: 6px; background: rgba(255, 255, 255, 0.8); border-radius: 8px; padding: 4px 8px;
    font: 12px/1.3 ui-monospace, monospace; white-space: pre; pointer-events: none; }
  #toggle { position: fixed; top: 6px; left: 6px; border: 0; border-radius: 8px; padding: 8px 10px; background: rgba(255, 255, 255, 0.85); }
</style>
</head>
<body>
<div id="app"></div>
<div id="panel"></div>
<div id="perf"></div>
<button id="toggle">panel</button>
<script type="module" src="../src/actors/dev.ts"></script>
</body>
</html>
