<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Audio Test</title>
<style>
  :root { --bg: #fff8ef; --ink: #2b2140; --btn: #ffd36e; --btn2: #b9e6ff; --hold: #ffb3c7; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 18px/1.4 system-ui, -apple-system, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 24px; margin: 8px 0 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 18px; }
  button { min-width: 72px; min-height: 72px; padding: 0 18px; border: 0; border-radius: 18px; background: var(--btn);
    color: var(--ink); font: 600 26px system-ui, sans-serif; touch-action: none; }
  button.sfx { background: var(--btn2); font-size: 18px; }
  button.hold { background: var(--hold); }
  button:active { transform: scale(0.96); }
  #play { min-width: 220px; min-height: 120px; font-size: 40px; }
  #log { white-space: pre-wrap; font: 14px/1.4 ui-monospace, monospace; background: #fff; border-radius: 12px; padding: 12px; }
</style>
</head>
<body>
<main>
  <h1>Audio test</h1>
  <div class="row"><button id="play">Play</button></div>
  <div class="row" id="sounds"></div>
  <div class="row" id="holds"></div>
  <div class="row" id="fx"></div>
  <div class="row"><button id="say" class="sfx">say goal, then word</button><button id="missing" class="sfx">say missing clip</button><button id="stop" class="sfx">stop</button></div>
  <div id="log"></div>
</main>
<script src="audio.js"></script>
<script>
  // This page sits in shared/, so the phonics folder is a sibling and there are no game clips.
  EmmaAudio.init({ base: 'test-audio/', phonics: 'audio/phonics/' });
  var log = function (m) { document.getElementById('log').textContent += m + '\n'; };
  window.testLog = [];
  function note(m) { window.testLog.push(m); log(m); }

  var SOUNDS = ['s', 'a', 't', 'p', 'b', 'd', 'g', 'l', 'r', 'sh', 'ng', 'ai', 'er'];
  var HOLDS = ['s', 'm', 'l', 'r', 'f', 't'];
  var FX = ['pop', 'chime', 'sparkle', 'whoosh', 'soft-no', 'fanfare', 'splash', 'munch', 'tick', 'magic', 'hatch'];

  function make(parent, label, cls) {
    var b = document.createElement('button');
    b.textContent = label;
    if (cls) b.className = cls;
    document.getElementById(parent).appendChild(b);
    return b;
  }

  document.getElementById('play').addEventListener('pointerdown', function () {
    EmmaAudio.unlock();
    var t0 = performance.now();
    EmmaAudio.preload(['goal-make-bun', 'word-bun']);
    EmmaAudio.preloadSounds().then(function (missing) {
      note('phonics decoded in ' + Math.round(performance.now() - t0) + ' ms, missing: ' + JSON.stringify(missing));
    });
  });

  SOUNDS.forEach(function (g) {
    make('sounds', g).addEventListener('pointerdown', function () {
      EmmaAudio.sound(g).then(function () { note('sound ' + g + ' ended'); });
    });
  });
  HOLDS.forEach(function (g) {
    var b = make('holds', 'hold ' + g, 'hold');
    var h = null;
    b.addEventListener('pointerdown', function (e) {
      b.setPointerCapture && b.setPointerCapture(e.pointerId);
      h = EmmaAudio.hold(g);
      h.done.then(function () { note('hold ' + g + ' done'); });
    });
    var end = function () { if (h) { h.stop(); h = null; } };
    b.addEventListener('pointerup', end);
    b.addEventListener('pointercancel', end);
  });
  FX.forEach(function (n) {
    make('fx', n, 'sfx').addEventListener('pointerdown', function () {
      EmmaAudio.sfx(n).then(function () { note('sfx ' + n + ' done'); });
    });
  });
  document.getElementById('say').addEventListener('pointerdown', function () {
    EmmaAudio.say('goal-make-bun').then(function () { note('goal said'); });
    EmmaAudio.say('word-bun', { queue: true }).then(function () { note('word said'); });
  });
  document.getElementById('missing').addEventListener('pointerdown', function () {
    var t = performance.now();
    EmmaAudio.say('no-such-clip').then(function () {
      note('missing clip resolved after ' + Math.round(performance.now() - t) + ' ms; missing = ' + JSON.stringify(EmmaAudio.missing));
    });
  });
  document.getElementById('stop').addEventListener('pointerdown', function () { EmmaAudio.stop(); note('stopped'); });
</script>
</body>
</html>
